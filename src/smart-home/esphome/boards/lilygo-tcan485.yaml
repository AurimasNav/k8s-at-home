esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Onboard RS485 transceiver: these must be driven high at boot to power the
# chip and enable its hardware autodirection, or the bus stays silent.
output:
  - platform: gpio
    id: rs485_enable
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    id: rs485_autodirection_enable
    pin:
      number: GPIO17
      inverted: true
  - platform: gpio
    id: rs485_5v_enable
    pin:
      number: GPIO16
      inverted: true

# Onboard WS2812 RGB LED. The board has no power LED, so without driving this
# one a running node looks identical to a dead one:
#   dark   = no power (or firmware not running)
#   blue   = powered, starting up
#   red    = running, no WiFi
#   yellow = WiFi up, but no Home Assistant API connection
#   green  = fully connected
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO4
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s

script:
  - id: refresh_status_led
    then:
      - if:
          condition: api.connected
          then:
            - light.turn_on:
                id: status_led
                brightness: 20%
                red: 0%
                green: 100%
                blue: 0%
          else:
            if:
              condition: wifi.connected
              then:
                - light.turn_on:
                    id: status_led
                    brightness: 20%
                    red: 100%
                    green: 55%
                    blue: 0%
              else:
                - light.turn_on:
                    id: status_led
                    brightness: 20%
                    red: 100%
                    green: 0%
                    blue: 0%

esphome:
  on_boot:
    - priority: -100
      then:
        - light.turn_on:
            id: status_led
            brightness: 20%
            red: 0%
            green: 0%
            blue: 100%
        - script.execute: refresh_status_led

interval:
  - interval: 5s
    then:
      - script.execute: refresh_status_led

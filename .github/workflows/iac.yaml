name: IaC (OpenTofu)

# Root modules under iac/. Today: iac/cloudflare (Cloudflare account and the sync.lt zone).
#   - Every PR touching iac/: fmt, validate, tflint (no secrets).
#   - Same-repo PRs: plan with the read-only Cloudflare token. The "PR report" job writes the
#     plan into the PR description (its own section, replaced on every run).
#   - Push to main: plan + apply in the "cloudflare" environment (edit token lives only there).
#   - Weekly: drift check; the job fails when Cloudflare differs from the code.
# Jobs that need secrets run only when the repo variable TOFU_CLOUDFLARE_ENABLED is "true".
# The repo is public, so logs and the PR description are too: plans are only ever shown
# through New-TofuPlanReport.ps1, which masks secrets, the account ID and token IDs.

on:
  pull_request:
    branches: [main]
    paths: ["iac/**", ".github/workflows/iac.yaml", ".github/scripts/**"]
  push:
    branches: [main]
    paths: ["iac/**", ".github/workflows/iac.yaml", ".github/scripts/**"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=opentofu/opentofu
  TOFU_VERSION: "1.13.2"
  # renovate: datasource=github-releases depName=terraform-linters/tflint
  TFLINT_VERSION: "0.65.0"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  STACK_DIR: iac/cloudflare
  # Values masked in plan reports (in addition to what tofu marks sensitive).
  REDACT_ENV: CLOUDFLARE_API_TOKEN,TF_VAR_cloudflare_account_id,TF_VAR_state_passphrase,TF_VAR_home_public_ipv4,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY

jobs:
  static:
    name: Static checks (fmt, validate, tflint)
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tofu + tflint (checksum-verified)
        shell: pwsh
        run: .github/scripts/Install-CiTools.ps1 -Tool tofu, tflint
      - name: tofu fmt
        id: fmt
        shell: pwsh
        run: .github/scripts/Invoke-Check.ps1 fmt { tofu fmt -check -recursive -diff -no-color iac }
      - name: tofu validate
        id: validate
        if: ${{ !cancelled() }}
        shell: pwsh
        run: >
          .github/scripts/Invoke-Check.ps1 validate {
          tofu "-chdir=$env:STACK_DIR" init -backend=false -lockfile=readonly -no-color;
          if (-not $LASTEXITCODE) { tofu "-chdir=$env:STACK_DIR" validate -no-color } }
      - name: tflint
        id: tflint
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .github/scripts/Invoke-Check.ps1 tflint { tflint "--chdir=$env:STACK_DIR" "--config=$PWD/iac/.tflint.hcl" --format=compact --no-color }
      - name: Report
        id: report
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          STEPS: ${{ toJSON(steps) }}
        run: >
          .github/scripts/New-StepReport.ps1 -Title 'Static checks'
          -Check ([ordered]@{ fmt = 'tofu fmt'; validate = 'tofu validate'; tflint = 'tflint' })

  plan:
    name: Plan (read-only token)
    needs: static
    # Secrets never reach fork PRs; Renovate and Hermes branches live in this repo.
    if: >-
      vars.TOFU_CLOUDFLARE_ENABLED == 'true' &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: iac-cloudflare-state
      cancel-in-progress: false
    outputs:
      report: ${{ steps.report.outputs.report }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_R2_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      TF_VAR_home_public_ipv4: ${{ secrets.HOME_PUBLIC_IPV4 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_IAC_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tofu (checksum-verified)
        shell: pwsh
        run: .github/scripts/Install-CiTools.ps1 -Tool tofu
      - name: Plan
        id: plan
        shell: pwsh
        # Output goes to a file, not the log; the report step shows a masked version.
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'plan.log'
          tofu "-chdir=$env:STACK_DIR" init -lockfile=readonly -no-color *> $log
          $code = $LASTEXITCODE
          if (-not $code) {
            tofu "-chdir=$env:STACK_DIR" plan -lock-timeout=5m -detailed-exitcode -no-color -out=tfplan *>> $log
            $code = $LASTEXITCODE
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "exitcode=$code"
          Write-Host "tofu plan exit code: $code (0 = no changes, 2 = changes, other = error)"
          # The Result step decides; this step only records the code.
          exit 0
      - name: Report
        id: report
        shell: pwsh
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        run: >
          .github/scripts/New-TofuPlanReport.ps1 -StackDir $env:STACK_DIR -ExitCode $env:PLAN_EXIT_CODE
          -PlanLog (Join-Path $env:RUNNER_TEMP 'plan.log') -RedactEnv ($env:REDACT_ENV -split ',')
      - name: Result
        shell: pwsh
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          Remove-Item -ErrorAction SilentlyContinue (Join-Path $env:STACK_DIR 'tfplan')
          if ($env:PLAN_EXIT_CODE -notin '0', '2') { Write-Host '::error::tofu plan failed; see the job summary.'; exit 1 }
          if ($env:GITHUB_EVENT_NAME -eq 'schedule' -and $env:PLAN_EXIT_CODE -eq '2') {
            Write-Host '::error::Cloudflare differs from iac/cloudflare; the job summary has the plan.'
            exit 1
          }

  apply:
    name: Apply (main)
    needs: static
    if: vars.TOFU_CLOUDFLARE_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The edit token is an environment secret: only jobs in this environment can read it.
    # Add a required reviewer on the environment to approve each apply by hand.
    environment: cloudflare
    concurrency:
      group: iac-cloudflare-state
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_R2_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      TF_VAR_home_public_ipv4: ${{ secrets.HOME_PUBLIC_IPV4 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_IAC_EDIT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tofu (checksum-verified)
        shell: pwsh
        run: .github/scripts/Install-CiTools.ps1 -Tool tofu
      - name: Plan
        id: plan
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'plan.log'
          tofu "-chdir=$env:STACK_DIR" init -lockfile=readonly -no-color *> $log
          $code = $LASTEXITCODE
          if (-not $code) {
            tofu "-chdir=$env:STACK_DIR" plan -lock-timeout=5m -detailed-exitcode -no-color -out=tfplan *>> $log
            $code = $LASTEXITCODE
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "exitcode=$code"
          Write-Host "tofu plan exit code: $code"
          exit 0
      - name: Plan report (job summary)
        shell: pwsh
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        run: >
          .github/scripts/New-TofuPlanReport.ps1 -StackDir $env:STACK_DIR -ExitCode $env:PLAN_EXIT_CODE
          -PlanLog (Join-Path $env:RUNNER_TEMP 'plan.log') -RedactEnv ($env:REDACT_ENV -split ',') > $null
      - name: Apply
        if: steps.plan.outputs.exitcode == '2'
        shell: pwsh
        # Applies exactly the saved (encrypted) plan above. Only the outcome is logged.
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'apply.log'
          tofu "-chdir=$env:STACK_DIR" apply -lock-timeout=5m -no-color tfplan *> $log
          $code = $LASTEXITCODE
          $secrets = ($env:REDACT_ENV -split ',') | ForEach-Object { [Environment]::GetEnvironmentVariable($_) } | Where-Object { $_ }
          $lines = Get-Content -LiteralPath $log | Select-String -Pattern '^(Apply complete|│ Error|Error)' -Context 0, 6 | ForEach-Object { $_.ToString() }
          foreach ($l in $lines) { foreach ($s in $secrets) { $l = $l.Replace($s, '***') }; Write-Host $l }
          Remove-Item -LiteralPath $log, (Join-Path $env:STACK_DIR 'tfplan') -ErrorAction SilentlyContinue
          exit $code
      - name: Result
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: |
          echo "::error::tofu plan failed; see the job summary."
          exit 1

  # Writes the static checks and the plan into the PR description (section "iac").
  report:
    name: PR report
    needs: [static, plan]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Update the PR description
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAN_ENABLED: ${{ vars.TOFU_CLOUDFLARE_ENABLED }}
        run: >
          .github/scripts/Update-PrReport.ps1
          -Repository $env:GITHUB_REPOSITORY
          -PullRequest $env:PR_NUMBER
          -HeadSha $env:HEAD_SHA
          -Section iac -Title 'IaC (OpenTofu)'
          -Jobs ([ordered]@{ static = 'Static checks (fmt, validate, tflint)'; plan = 'Plan (read-only token)' })
          -Note ($env:PLAN_ENABLED -eq 'true' ? @() : @('Plan skipped: repo variable TOFU_CLOUDFLARE_ENABLED is not "true".'))

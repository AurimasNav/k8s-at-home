apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./deployment.yaml
- ./httproute.yaml
- ./service.yaml
- ./configmap.yaml
- ./pvc.yaml

images:
# VSeerr (github.com/AurimasNav/vseerr). Tags are <Seerr release>-vseerr.<build>
# (see GitVersion.yml in that repo), pinned by digest. Renovate compares the
# build number numerically (packageRule in renovate.json).
- name: ghcr.io/aurimasnav/vseerr
  newTag: 3.5.1-vseerr.27
  digest: sha256:9c748350994b0cbb3c18578221deaba669fb17807d066e9f2569a00cd89dec8a

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./deployment.yaml
- ./ingress.yaml
- ./httproute.yaml
- ./service.yaml
- ./configmap.yaml
- ./pvc.yaml

images:
# VSeerr (github.com/AurimasNav/vseerr). Tags are <Seerr release>-vseerr.<build>
# (see GitVersion.yml in that repo), pinned by digest. Renovate compares the
# build number numerically (packageRule in renovate.json).
- name: ghcr.io/aurimasnav/vseerr
  newTag: 3.5.1-vseerr.16
  digest: sha256:dc47c0108d6c81f472a625880799867687b1ad55e03d0d6b9f767f4a81be416a

# renovate.json).
- name: ghcr.io/aurimasnav/vseerr
  newTag: 3.5.1-vseerr.2.122.0
  digest: sha256:4db9bb0c1e80e84cff80ce8398780bf267deb750dfe7cfe979bcae728ef868ea

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./deployment.yaml
- ./httproute.yaml
- ./service.yaml
- ./configmap.yaml
- ./pvc.yaml

images:
# VSeerr (github.com/AurimasNav/vseerr). Tags are <Seerr release>-vseerr.<build>
# (see GitVersion.yml in that repo), pinned by digest. Renovate compares the
# build number numerically (packageRule in renovate.json).
- name: ghcr.io/aurimasnav/vseerr
  newTag: 3.5.1-vseerr.31
  digest: sha256:6e0b87ee1501cff26fc6397b2328f74db6dd0a8573cd249d0b6aa90b8ae762c8

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./deployment.yaml
- ./ingress.yaml
- ./httproute.yaml
- ./service.yaml
- ./configmap.yaml
- ./pvc.yaml

images:
# VSeerr (github.com/AurimasNav/vseerr), built from its main branch by the
# "VSeerr Image" workflow. Pinned by digest; Renovate opens a PR for each new
# build of main (image tag sha-<commit> names the commit of each build).
- name: ghcr.io/aurimasnav/vseerr
  newTag: main
  digest: sha256:23ad1fc7b7111e3ddb53b9422b0a49a1f4e56ba5ce7927ff1f31a91545ad9024

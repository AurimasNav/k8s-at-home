apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./deployment.yaml
- ./httproute.yaml
- ./service.yaml
- ./configmap.yaml
- ./pvc.yaml

images:
# VSeerr (github.com/AurimasNav/vseerr). Tags are <Seerr release>-vseerr.<build>
# (see GitVersion.yml in that repo), pinned by digest. Renovate compares the
# build number numerically (packageRule in renovate.json).
- name: ghcr.io/aurimasnav/vseerr
  newTag: 3.5.1-vseerr.25
  digest: sha256:8b85e69dc77268a4eabc1a58ce43c39d768d6ae2543a6b0f80f0b8475b861200

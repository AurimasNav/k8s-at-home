apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./deployment.yaml
- ./httproute.yaml
- ./service.yaml
- ./configmap.yaml
- ./pvc.yaml

images:
# VSeerr (github.com/AurimasNav/vseerr). Tags are <Seerr release>-vseerr.<build>
# (see GitVersion.yml in that repo), pinned by digest. Renovate compares the
# build number numerically (packageRule in renovate.json).
- name: ghcr.io/aurimasnav/vseerr
  newTag: 3.5.1-vseerr.28
  digest: sha256:10a6fec22523ff4f8a945089797c6a9e4c06b2782c066bdf0a4b6d9aad743951

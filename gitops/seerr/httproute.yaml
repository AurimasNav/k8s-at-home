apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: seerr
spec:
  parentRefs:
  # Served only through the Cloudflare Tunnel (iac/cloudflare/tunnel.tf): seerr.sync.lt on
  # https-tunnel, the apex sync.lt on https-tunnel-apex. The home IP's 443 does not serve them.
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel-apex
  hostnames:
  - seerr.sync.lt
  - sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Envoy's default is 15 s for the whole response; 0s turns that off (long downloads,
    # interactive searches, streams). Idle connections still close after 300 s.
    timeouts:
      request: 0s
    backendRefs:
    - name: seerr
      port: 80

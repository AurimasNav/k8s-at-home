apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: seerr
spec:
  parentRefs:
  # seerr.sync.lt: only through the Cloudflare Tunnel (listener https-tunnel, iac/cloudflare/tunnel.tf).
  # The apex sync.lt: https-tunnel-apex (tunnel); https-apex (home IP) is dropped once verified.
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel-apex
  - name: main
    namespace: cilium-gateway
    sectionName: https-apex
  hostnames:
  - seerr.sync.lt
  - sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Envoy's default is 15 s for the whole response; 0s turns that off (long downloads,
    # interactive searches, streams). Idle connections still close after 300 s.
    timeouts:
      request: 0s
    backendRefs:
    - name: seerr
      port: 80

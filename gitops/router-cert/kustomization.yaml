apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Let's Encrypt certificate for the router's web UI: https://gw.sync.lt (LAN only;
# gw.sync.lt has no public DNS record, Blocky answers 192.168.1.1).
#
# - certificate.yaml: cert-manager gets gw.sync.lt via DNS-01 (Cloudflare) and renews it.
#   The key stays in the Secret gw-sync-lt-tls in this namespace.
# - push-job.yaml: after each sync and daily, sends certificate + key to the router over SSH
#   with its own key (Doppler ROUTER_CERT_SSH_KEY). The router accepts that key only with a
#   forced command, router/router-cert-install.sh: no shell, no forwarding.
# - router/router-cert-install.sh: copy of the script on the router (/jffs/scripts). It is
#   not deployed by Argo CD; after changing it, copy it to the router by hand.
#   Router setup: http_enable=2 (HTTP and HTTPS), https_lanport=443, and the key in
#   nvram sshd_authkeys as: command="/jffs/scripts/router-cert-install.sh",restrict ssh-ed25519 ...
namespace: router-cert

resources:
- ./certificate.yaml
- ./externalsecret.yaml
- ./push-job.yaml
- ./networkpolicy.yaml

configMapGenerator:
- name: router-cert-push
  files:
  - push.sh
  - known_hosts

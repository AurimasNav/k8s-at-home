# SSH login for the push Job. The private key (Doppler ROUTER_CERT_SSH_KEY, ed25519) is
# accepted by the router only with a forced command (router/router-cert-install.sh).
# The router has a single admin user; its name is the part of ASUS_MERLIN_WRT before the
# first "_". Only the name reaches this Secret, the password does not.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: router-cert-ssh
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: router-cert-ssh
    template:
      data:
        id_ed25519: "{{ .key }}"
        user: '{{ (splitn "_" 2 .login)._0 }}'
  data:
  - secretKey: key
    remoteRef:
      key: ROUTER_CERT_SSH_KEY
  - secretKey: login
    remoteRef:
      key: ASUS_MERLIN_WRT

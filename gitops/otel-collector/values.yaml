mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

# The host has memory-pressure spells of about 5 minutes (night jobs, FlareSolverr's Chrome)
# in which healthy pods answer slowly. The default 1 s timeout x 3 failures restarted them
# mid-spell; 5 s per check and ~5 min of failures before a restart rides a spell out
# (Postgres got the same in #1148).
livenessProbe:
  timeoutSeconds: 5
  periodSeconds: 30
  failureThreshold: 10
readinessProbe:
  timeoutSeconds: 5

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 15
    batch:
      send_batch_size: 10000
      timeout: 10s
    filter/drop_probes:
      error_mode: ignore
      traces:
        span:
        - 'IsMatch(attributes["http.target"], ".*/livez$")'
        - 'IsMatch(attributes["http.target"], ".*/readyz$")'
        - 'IsMatch(attributes["http.target"], ".*/healthz$")'
        - 'IsMatch(attributes["url.path"], ".*/livez$")'
        - 'IsMatch(attributes["url.path"], ".*/readyz$")'
        - 'IsMatch(attributes["url.path"], ".*/healthz$")'
      logs:
        log_record:
        - 'IsMatch(attributes["http.target"], ".*/livez$")'
        - 'IsMatch(attributes["http.target"], ".*/readyz$")'
        - 'IsMatch(attributes["http.target"], ".*/healthz$")'
        - 'IsMatch(attributes["url.path"], ".*/livez$")'
        - 'IsMatch(attributes["url.path"], ".*/readyz$")'
        - 'IsMatch(attributes["url.path"], ".*/healthz$")'

  exporters:
    # Tempo is parked (argocd-apps/base/kustomization.yaml) until the RAM upgrade; to bring
    # traces back, deploy it again and add otlp_http/tempo to the traces pipeline below.
    otlp_http/tempo:
      endpoint: http://tempo.tempo.svc:4318
    otlp_http/loki:
      endpoint: http://loki.loki.svc:3100/otlp
    prometheusremotewrite/victoriametrics:
      endpoint: http://vmsingle-victoria-metrics-k8s-stack.victoriametrics.svc:8428/api/v1/write
    debug:
      verbosity: detailed

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/drop_probes, batch]
        exporters: [debug]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, filter/drop_probes, batch]
        exporters: [prometheusremotewrite/victoriametrics, debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, filter/drop_probes, batch]
        exporters: [otlp_http/loki, debug]

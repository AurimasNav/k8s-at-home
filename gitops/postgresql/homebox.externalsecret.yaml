apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox-db
  namespace: postgresql
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: homebox-db
  data:
  - secretKey: HBOX_DATABASE_PASSWORD
    remoteRef:
      key: HBOX_DATABASE_PASSWORD

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: questlog-db
  namespace: postgresql
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: questlog-db
  data:
  - secretKey: QUESTLOG_DATABASE_PASSWORD
    remoteRef:
      key: QUESTLOG_DATABASE_PASSWORD

# One-shot: deletes the version 18 cluster that pg_upgrade --copy left behind in #1145.
# Runs after the sync, once the StatefulSet is healthy, and only if the running server and the
# data directory are both version 19. The Job deletes itself on success; this file goes in the
# next PR.
apiVersion: batch/v1
kind: Job
metadata:
  name: drop-pg18-data
  namespace: postgresql
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: drop
        image: postgres:19-alpine
        command:
        - sh
        - -euc
        - |
          B=/var/lib/postgresql
          [ -d "$B/18" ] || { echo "no $B/18; nothing to do"; exit 0; }
          v=$(psql -X -At -h postgresql -c 'SHOW server_version_num')
          case "$v" in 19*) ;; *) echo "running server is $v, not 19; keeping $B/18"; exit 1;; esac
          [ "$(cat "$B/19/docker/PG_VERSION")" = 19 ] || { echo "no version 19 cluster in $B/19/docker; keeping $B/18"; exit 1; }
          [ ! -e "$B/19/.pg-upgrade-from-18" ] || { echo "upgrade marker still present; keeping $B/18"; exit 1; }
          du -sh "$B"/*
          rm -rf "$B/18"
          echo "deleted $B/18"
          du -sh "$B"/*
        env:
        - name: PGUSER
          valueFrom:
            configMapKeyRef:
              name: postgresql
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-postgresql-0

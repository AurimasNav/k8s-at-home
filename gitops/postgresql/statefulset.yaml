apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: postgresql
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
      annotations:
        k8up.io/backupcommand: pg_dumpall -U hairsera
        k8up.io/file-extension: .sql
    spec:
      # Major-version upgrade, tested first by gitops/postgresql-upgrade-test on a copy of
      # production. pg-upgrade.sh converts /var/lib/postgresql/<OLD_MAJOR> to the image's major
      # with pg_upgrade --copy (the old cluster stays as it was, so rolling back is reverting the
      # image tag) and does nothing once the new cluster exists. old-binaries supplies the old
      # version's programs from the same Alpine build family, so text sort order stays the same.
      initContainers:
      - name: old-binaries
        image: postgres:19-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
        command: ["cp", "-a", "/usr/local/.", "/opt/pg-old/"]
        volumeMounts:
        - name: pg-old
          mountPath: /opt/pg-old
      - name: pg-upgrade
        image: postgres:19-alpine
        command: ["sh", "/scripts/pg-upgrade.sh"]
        env:
        - name: OLD_MAJOR
          value: "18"
        - name: PGBINOLD
          value: /opt/pg-old/bin
        envFrom:
        - configMapRef:
            name: postgresql
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: pg-old
          mountPath: /opt/pg-old
          readOnly: true
        - name: scripts
          mountPath: /scripts
      containers:
      - name: postgresql
        image: postgres:19-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgresql
        - secretRef:
            name: postgresql
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        readinessProbe:
          exec:
            command: [pg_isready, -U, hairsera, -d, hairsera]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: [pg_isready, -U, hairsera, -d, hairsera]
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: pg-old
        emptyDir:
          sizeLimit: 512Mi
      - name: scripts
        configMap:
          name: postgresql-scripts
          defaultMode: 0555
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: local-path
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 10Gi

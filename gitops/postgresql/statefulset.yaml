apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: postgresql
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
      annotations:
        k8up.io/backupcommand: pg_dumpall -U hairsera
        k8up.io/file-extension: .sql
    spec:
      # Major upgrades: gitops/postgresql/scripts/pg-upgrade.sh as init containers, rehearsed first
      # with gitops/postgresql-upgrade-test. 18 -> 19 was done that way in #1145.
      containers:
      - name: postgresql
        image: postgres:19-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgresql
        - secretRef:
            name: postgresql
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        # The node has short memory/IO pressure spells at night (about 5 minutes in which probes of
        # pods across the cluster time out). With the default 1 s timeout and 3 failures, the
        # liveness check killed a healthy Postgres 20 times in 26 days, dropping every app's
        # connections. These limits ride such spells out; a real hang still restarts it in ~5 min.
        readinessProbe:
          exec:
            command: [pg_isready, -U, hairsera, -d, hairsera]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command: [pg_isready, -U, hairsera, -d, hairsera]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: local-path
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 10Gi

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# scripts/pg-upgrade.sh is not deployed between major upgrades; gitops/postgresql-upgrade-test
# and the next upgrade's init containers use it.
resources:
- ./configmap.yaml
- ./externalsecret.yaml
- ./statefulset.yaml
- ./service.yaml
- ./homebox.externalsecret.yaml
- ./questlog.externalsecret.yaml
- ./umami.externalsecret.yaml
- ./databases.job.yaml

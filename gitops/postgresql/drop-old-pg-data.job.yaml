# One-shot: deletes old Postgres data directories left on the volume, after checking that the
# running server is 19 and runs from /var/lib/postgresql/19/docker:
#   18/           the version 18 cluster pg_upgrade --copy kept in #1145 (already deleted in #1148)
#   pg17-backup/  the version 17 data dir set aside on 2026-09-27 when moving to 18
# Runs after the sync and deletes itself on success; this file goes in the next PR.
apiVersion: batch/v1
kind: Job
metadata:
  name: drop-old-pg-data
  namespace: postgresql
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: drop
        image: postgres:19-alpine
        command:
        - sh
        - -euc
        - |
          B=/var/lib/postgresql
          v=$(psql -X -At -h postgresql -c 'SHOW server_version_num')
          d=$(psql -X -At -h postgresql -c 'SHOW data_directory')
          case "$v" in 19*) ;; *) echo "running server is $v, not 19; deleting nothing"; exit 1;; esac
          [ "$d" = "$B/19/docker" ] || { echo "server runs from $d, not $B/19/docker; deleting nothing"; exit 1; }
          [ "$(cat "$B/19/docker/PG_VERSION")" = 19 ] || { echo "no version 19 cluster in $B/19/docker; deleting nothing"; exit 1; }
          du -sh "$B"/*
          if [ -d "$B/18" ]; then
            [ ! -e "$B/19/.pg-upgrade-from-18" ] || { echo "upgrade marker still present; keeping $B/18"; exit 1; }
            rm -rf "$B/18"
            echo "deleted $B/18"
          fi
          if [ -d "$B/pg17-backup" ]; then
            [ "$(cat "$B/pg17-backup/PG_VERSION")" = 17 ] || { echo "$B/pg17-backup is not a version 17 data dir; keeping it"; exit 1; }
            rm -rf "$B/pg17-backup"
            echo "deleted $B/pg17-backup"
          fi
          du -sh "$B"/*
        env:
        - name: PGUSER
          valueFrom:
            configMapKeyRef:
              name: postgresql
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-postgresql-0

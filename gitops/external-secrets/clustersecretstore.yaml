apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler-secret-store
  # Leftover from Argo CD's old label tracking. No field manager owns it, so a
  # server-side apply never removes it, and Argo CD 3.6's server-side diff keeps
  # the app OutOfSync while the label is live but not in Git. Declaring it here
  # makes Argo CD own it and the diff clean.
  labels:
    app.kubernetes.io/instance: external-secrets
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-auth-api
            key: dopplerToken
            namespace: external-secrets

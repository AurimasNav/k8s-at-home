# Cilium gateway route for home.sync.lt/telegram (homepage serves the rest of the host; the
# longer path prefix wins). Google login (ExternalAuth); filter settings are explained
# in gitops/cleanuparr/httproute.yaml. Envoy streams the ~75 MB zip without buffering.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: telegram-dl
  namespace: telegram-dl
spec:
  parentRefs:
  - name: main
    namespace: cilium-gateway
    sectionName: https-wildcard
  hostnames:
  - home.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /telegram
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          name: oauth2-proxy
          namespace: oauth2-proxy
          port: 4180
        http:
          path: /_authz
          allowedHeaders:
          - cookie
          - accept
          allowedResponseHeaders:
          - x-auth-request-user
          - x-auth-request-email
    # Envoy's default is 15 s for the whole response; 0s turns that off (long downloads,
    # interactive searches, streams). Idle connections still close after 300 s.
    timeouts:
      request: 0s
    backendRefs:
    - name: telegram-dl
      port: 80

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telegram-dl
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Same Google login as the rest of home.sync.lt.
    nginx.ingress.kubernetes.io/auth-url: "https://login.sync.lt/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://login.sync.lt/oauth2/start?rd=$scheme://$best_http_host$escaped_request_uri"
    # Stream the ~75 MB zip straight through instead of spooling it to disk.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - home.sync.lt
    secretName: telegram-dl-letsencrypt
  rules:
  - host: home.sync.lt
    http:
      paths:
      - path: /telegram
        pathType: Prefix
        backend:
          service:
            name: telegram-dl
            port:
              name: http

apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole
  namespace: pihole
data:
  TZ: Europe/Vilnius
  # Pi-hole v6 settings (FTLCONF_<section>_<key>); set here they are read-only in the web UI.
  # Upstream: unbound (recursive resolver, LB 192.168.1.154).
  FTLCONF_dns_upstreams: 192.168.1.154
  # LAN clients reach the pod with their real IP (externalTrafficPolicy: Local), which is
  # "non-local" to the pod network, so the default LOCAL mode drops every LAN query.
  # Port 53 is only reachable from the LAN (no router port forward).
  FTLCONF_dns_listeningMode: ALL
  # Reverse lookups for the LAN go to the router (DHCP server), so clients show by hostname.
  FTLCONF_dns_revServers: "true,192.168.1.0/24,192.168.1.1"

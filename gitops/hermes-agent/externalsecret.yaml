apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-agent
  data:
  # Same name in Doppler and in the pod. Hermes pools ANTHROPIC_API_KEY,
  # ANTHROPIC_API_KEY_2, _3, ... automatically: key 1 is used until it is
  # rate-limited, then the next one.
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: ANTHROPIC_API_KEY
  - secretKey: ANTHROPIC_API_KEY_2
    remoteRef:
      key: ANTHROPIC_API_KEY_2
  - secretKey: TELEGRAM_BOT_TOKEN
    remoteRef:
      key: HERMES_TELEGRAM_BOT_TOKEN
  - secretKey: TELEGRAM_ALLOWED_USERS
    remoteRef:
      key: HERMES_TELEGRAM_ALLOWED_USERS
  - secretKey: TELEGRAM_GROUP_ALLOWED_CHATS
    remoteRef:
      key: HERMES_TELEGRAM_GROUP_ALLOWED_CHATS
  - secretKey: TELEGRAM_HOME_CHANNEL
    remoteRef:
      key: HERMES_TELEGRAM_HOME_CHANNEL
  - secretKey: HA_TOKEN
    remoteRef:
      key: HERMES_HASS_TOKEN
  - secretKey: SONARR_API_KEY
    remoteRef:
      key: HERMES_SONARR_API_KEY
  - secretKey: RADARR_API_KEY
    remoteRef:
      key: HERMES_RADARR_API_KEY
  - secretKey: PROWLARR_API_KEY
    remoteRef:
      key: HERMES_PROWLARR_API_KEY
  - secretKey: PLEX_TOKEN
    remoteRef:
      key: HERMES_PLEX_TOKEN
  # not GH_TOKEN: Hermes strips that from terminal children; the gh wrapper maps it
  - secretKey: HERMES_GITHUB_TOKEN
    remoteRef:
      key: HERMES_GITHUB_TOKEN
  # Cloudflare read-only token (iac-reader) for OpenTofu plans and lookups; the
  # write token (Doppler CLOUDFLARE_API_TOKEN) stays with GitHub Actions only.
  - secretKey: CLOUDFLARE_IAC_READ_TOKEN
    remoteRef:
      key: CLOUDFLARE_IAC_READ_TOKEN
  - secretKey: CLOUDFLARE_ACCOUNT_ID
    remoteRef:
      key: CLOUDFLARE_ACCOUNT_ID
  - secretKey: TOFU_STATE_PASSPHRASE
    remoteRef:
      key: TOFU_STATE_PASSPHRASE
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-mcp-setup
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: ha-mcp-setup
  data:
  - secretKey: HA_ADMIN_TOKEN
    remoteRef:
      key: HERMES_HASS_ADMIN_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-oauth2-proxy
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-agent-oauth2-proxy
  dataFrom:
  - extract:
      key: GOOGLE_OAUTH_JSON
    rewrite:
    - regexp:
        source: GOOGLE_OAUTH_CLIENT_ID
        target: OAUTH2_PROXY_CLIENT_ID
    - regexp:
        source: GOOGLE_OAUTH_CLIENT_SECRET
        target: OAUTH2_PROXY_CLIENT_SECRET
  data:
  - secretKey: OAUTH2_PROXY_COOKIE_SECRET
    remoteRef:
      key: OAUTH2_PROXY_COOKIE_SECRET
  - secretKey: AUTHENTICATED_EMAILS
    remoteRef:
      key: AUTHENTICATED_EMAILS
---
# Doppler API token, so Hermes can write new secrets (generated passwords etc.)
# through the Doppler API. External Secrets keeps its own read-only store token.
# Separate and optional, so a missing key can't block the main secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-doppler
spec:
  # short, so a rotated token reaches the pod within minutes (Reloader restarts it)
  refreshInterval: "300s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-agent-doppler
  data:
  # read/write service token scoped to k8s-at-home/prod (not the personal token)
  - secretKey: DOPPLER_TOKEN
    remoteRef:
      key: DOPPLER_SERVICE_TOKEN
---
# API keys of the RU Radarr/Sonarr (same Doppler keys their own ExternalSecrets
# use). Separate and optional, so a missing key can't block the main secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-arr-ru
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-agent-arr-ru
  data:
  - secretKey: RADARR_RU_API_KEY
    remoteRef:
      key: RADARR_RU_API_KEY
  - secretKey: SONARR_RU_API_KEY
    remoteRef:
      key: SONARR_RU_API_KEY

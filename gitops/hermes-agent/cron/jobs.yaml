# Hermes cron job definitions (source of truth).
# Synced into /opt/data/cron/jobs.json by the cron-sync init container on every pod start.
# Keys are job ids. Authored fields here win; scheduler state (next run, history) stays on the PVC.
# Jobs not listed here (ad-hoc reminders made in chat) are left untouched.
# deliver: telegram:<chat_id>:<thread_id>  (241 = Šildymas, 245 = APVA, 501 = Home server, 1128 = Media)
# script: file name in ../scripts (mounted at /opt/data/scripts); its stdout is injected into the prompt.
jobs:
  03b0d43625b1:
    name: NIBE dienos ataskaita
    schedule: 0 8 * * *
    deliver: telegram:-1004485564030:241
    script: heating_check.py
    enabled: true
    prompt: |
      Parašyk kasdienę NIBE F1245 šilumos siurblio ataskaitą lietuviškai. Pagrindinis duomenų šaltinis – aukščiau pateikta skripto heating_check.py išvestis (dabartinės reikšmės, 1 d. ir 3 d. istorija, patalpos). Jei skripto išvestyje yra KLAIDA arba trūksta duomenų, papildomai naudok HA MCP įrankį GetLiveContext. Įtrauk: lauko temperatūrą, tiekimo (be karšto vandens kaitinimo) ir skaičiuotą tiekimą, grįžtamąją, gruntą, karštą vandenį, laipsnių minutes, poslinkį S1, kompresoriaus būseną, darbo valandas ir startus, el. šildytuvą, aliarmus, energijos įvertinimą, patalpų temperatūrą ir drėgnį (Svetainė, Miegamasis, Žaidimų k.), bei 24 val./3 d. tendencijas. Formatas: aiškus, vizualus, su emoji ir Unicode juostomis, be lentelių, iki ~25 eilučių. Trumpa išvada gale. NIEKADA nekeisk šildymo nustatymų, tik pranešk. Nurodyk, jei kurių duomenų nėra.
  1fe5831c9cd1:
    name: APVA dienos ataskaita
    schedule: 0 9 * * *
    deliver: telegram:-1004485564030:245
    script: apva_check.py
    enabled: true
    prompt: |
      Parašyk lietuviškai LABAI trumpą APVA paramos būklės pranešimą (iki ~10 eilučių) namų savininkui, turinčiam saulės elektrinę ir besidominčiam namų baterijų (kaupiklių) parama. Pagrindinis šaltinis – aukščiau pateikta skripto apva_check.py išvestis (APVIS aktyvūs kvietimai ir apva.lrv.lt planuojami kvietimai). Jei skripto išvestyje yra KLAIDA, papildomai patikrink oficialius APVA šaltinius web paieška. Pirma eilutė: ar šiuo metu atidarytas kvietimas namų kaupikliams (TAIP/NE). Tada pateik TIK: 1) AKTYVIUS kvietimus, aktualius fiziniams asmenims (pavadinimas, likusi suma, pabaiga); 2) PLANUOJAMUS kvietimus, aktualius fiziniams asmenims arba energetikai (pavadinimas, numatoma pradžia, suma). Juridiniams asmenims skirtų, miškų, invazinių rūšių ir pan. kvietimų neminėk. Ankstesni (uždaryti) kvietimai nėra aktyvūs. NEPATEIKIK instrukcijų, kaip pildyti paraišką ar ką daryti. Gale 1–2 nuorodos. Nieko nespėliok. Formatas: trumpi sąrašai su emoji, be lentelių.
  c4a472c22bee:
    name: Renovate auto-merge
    schedule: 0 10 * * *
    deliver: telegram:-1004485564030:501
    script: renovate_automerge.py
    enabled: true
    prompt: |
      The script renovate_automerge.py has already run. Its output above is the full record of what happened: it merged eligible Renovate PRs in github.com/AurimasNav/k8s-at-home one at a time and watched each ArgoCD rollout. Your job is only to summarise it for the home-server Telegram topic. Do NOT merge, revert, rebase or change anything yourself.
      - If the output is exactly NO_RENOVATE_PRS, reply with exactly [SILENT].
      - If it starts with KLAIDA, report the error in 1-2 lines and say nothing was merged.
      Otherwise write a short English summary (max ~15 lines), no tables:
      1. First line: one status emoji and a headline, e.g. "✅ Renovate: 3 merged, all rolled out" or "⚠️ Renovate: 2 merged, 1 rollout failed".
      2. One bullet per PR: ✅ merged and rolled out / 📦 merged, nothing to deploy / ⏳ waiting for checks / 🔁 rebase requested / ✋ held for a human / ❌ failed. Give the PR number linked as https://github.com/AurimasNav/k8s-at-home/pull/<n>, the package and the version change, and the affected app. Add image changes or the HA version only when the output has them.
      3. If a rollout failed or something errored, say which app and what the script reported, and that the remaining PRs were left unmerged. Never claim a rollout succeeded unless the output says OK.
      4. Last line: cluster health from the "Cluster after run" section (apps not Synced/Healthy, pods not running), or "cluster healthy".
      For held PRs, say in a few words why (major update, vendored code not updated, would restart Hermes, failing checks), so the user knows what to do.
  be56cc93e148:
    name: Anthropic pool watchdog
    schedule: '* * * * *'
    deliver: telegram:-1004485564030:501
    script: anthropic_pool_watchdog.py
    no_agent: true
    enabled: true
  e54a3896f34e:
    name: Weekly media report
    schedule: 0 19 * * 5
    deliver: telegram:-1004485564030:1128
    script: media_weekly.py
    enabled: true
    prompt: |
      Write the weekly media report for the home-server media topic. The output of media_weekly.py above is the only data source: it already read VSeerr, Radarr/Sonarr (+ RU instances), Cleanuparr, qBittorrent, Plex and VictoriaMetrics for the last 7 days. Do not call any API or change anything. If a section says KLAIDA, write one line that this part is unavailable this week. Never invent numbers; use the sizes exactly as given.

      English, Telegram markdown, no tables, at most ~40 lines. Times are Vilnius time, as in the output. Leave out any section with nothing to report.

      1. Headline: "📺 Media week <first day> – <last day>", then one line: requests, GB added to the library, torrents cleaned up (and their size when given), free space.
      2. 🙋 Requests: a ranked bar chart of requests per user (█ bars, 10 chars wide, count at the end). Then one line per request: ✅ available (and how fast, if "ready ... after the request" is given), ⏳ waiting + the reason from the output, 🎬 not released yet + the date.
      3. 📥 New in the library: title, quality, size, "requested by" when known. For TV, group episodes per season. Total at the end.
      4. ⬆️ Upgrades: title, quality, new size vs replaced size, and the net space change. Mention a notable custom format (Atmos/DTS:X, Remux) when present.
      5. 🧹 Cleanuparr: torrents deleted by the download cleaner (count, total size when given, ratio vs seed-time split, average ratio and seeding days), with one fun fact (longest seeded or best ratio). Queue removals and the most-struck download, if any. Seeker: searches run and what they found.
      6. 🌱 Seeding (qBittorrent): uploaded and downloaded this week, top 3 seeders, torrents added, stuck or dead torrents.
      7. 💾 Storage: a 10-char ▓░ gauge of used/total for the /data pool, free space and its change this week; library size per instance with the change since the last report (skip instances that are empty).
      8. 🍿 Watched on Plex: total plays, top viewers (counts only), the most watched titles, movies watched.
      9. Last line "👀 Worth a look:" only for things that need a human: requests waiting more than 3 days with nothing grabbed, failed imports, stuck downloads, dead (missingFiles) torrents, pending replacement searches above 0. Otherwise end with "👀 Nothing needs attention."

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  parentRefs:
  - name: main
    namespace: cilium-gateway
    sectionName: https-hermes
  hostnames:
  - hermes.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hermes-agent
      port: 80

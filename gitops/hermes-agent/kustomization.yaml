apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./deployment.yaml
- ./rbac.yaml
- ./argocd-sync.yaml
- ./service.yaml
- ./httproute.yaml
- ./configmap.yaml
- ./pvc.yaml
- ./externalsecret.yaml
- ./ha-mcp-setup.yaml

configMapGenerator:
# Scripts for Hermes cron jobs. Fixed name and Reloader-ignored, so a script edit does NOT restart
# Hermes (which would cut every running chat): the kubelet swaps the files in the mounted volume
# (no subPath) within about a minute and each cron run reads them fresh. The other generators below
# keep the hash suffix: they feed init containers or startup, so their changes need the restart.
- name: hermes-agent-scripts
  options:
    disableNameSuffixHash: true
    annotations:
      reloader.stakater.com/ignore: "true"
  files:
  - scripts/heating_check.py
  - scripts/apva_check.py
  - scripts/renovate_automerge.py
  - scripts/anthropic_pool_watchdog.py
  - scripts/media_weekly.py
  - scripts/cron_cleanup.py
  - scripts/upstream_watch.py
- name: hermes-agent-patches
  files:
  - patches/apply.sh
  - patches/aux-rotation-144184.diff
- name: hermes-agent-plugin-approval-ping
  files:
  - plugins/approval-ping/__init__.py
  - plugins/approval-ping/plugin.yaml
- name: hermes-agent-cron
  files:
  - cron/jobs.yaml
  - cron/cron_sync.py
# pinned CAD packages for the cad-venv init container; a pin bump rolls the pod and rebuilds the venv
- name: hermes-agent-cad
  files:
  - cad/requirements.txt

images:
- name: nousresearch/hermes-agent
  newTag: v2026.9.24
- name: alpine/k8s
  newTag: 1.37.2
- name: ghcr.io/home-assistant/home-assistant
  newTag: 2026.11.1
- name: quay.io/oauth2-proxy/oauth2-proxy
  newTag: v7.15.6

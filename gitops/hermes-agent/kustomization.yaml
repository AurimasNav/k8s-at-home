apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./deployment.yaml
- ./rbac.yaml
- ./service.yaml
- ./httproute.yaml
- ./configmap.yaml
- ./pvc.yaml
- ./externalsecret.yaml
- ./ha-mcp-setup.yaml

# scripts for Hermes cron jobs; hash suffix rolls the pod on change
configMapGenerator:
- name: hermes-agent-scripts
  files:
  - scripts/heating_check.py
  - scripts/apva_check.py
- name: hermes-agent-cron
  files:
  - cron/jobs.yaml
  - cron/cron_sync.py

images:
- name: nousresearch/hermes-agent
  newTag: v2026.9.24
- name: alpine/k8s
  newTag: 1.37.1
- name: ghcr.io/home-assistant/home-assistant
  newTag: 2026.10.1
- name: quay.io/oauth2-proxy/oauth2-proxy
  newTag: v7.15.5

apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent
data:
  TZ: Europe/Vilnius
  HERMES_DASHBOARD: "1"
  # loopback only, reachable solely through the oauth2-proxy sidecar
  HERMES_DASHBOARD_HOST: "127.0.0.1"
  TELEGRAM_REQUIRE_MENTION: "true"
  HASS_URL: http://home-assistant.home-assistant.svc.cluster.local:8123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-oauth2-proxy
data:
  OAUTH2_PROXY_PROVIDER: google
  OAUTH2_PROXY_EMAIL_DOMAIN: "*"
  OAUTH2_PROXY_UPSTREAMS: "http://127.0.0.1:9119"
  OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
  OAUTH2_PROXY_REDIRECT_URL: "https://hermes.sync.lt/oauth2/callback"
  OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/authenticated-emails
  OAUTH2_PROXY_COOKIE_DOMAINS: ".sync.lt"
  OAUTH2_PROXY_WHITELIST_DOMAINS: ".sync.lt"
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

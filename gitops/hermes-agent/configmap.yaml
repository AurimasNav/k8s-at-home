apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent
data:
  TZ: Europe/Vilnius
  HERMES_DASHBOARD: "1"
  # loopback only, reachable solely through the oauth2-proxy sidecar
  HERMES_DASHBOARD_HOST: "127.0.0.1"
  TELEGRAM_REQUIRE_MENTION: "false"
  # not HASS_*: those enable Hermes' built-in HA toolset, which ignores Assist exposure
  HA_URL: http://home-assistant.home-assistant.svc.cluster.local:8123
  SONARR_URL: http://sonarr.sonarr.svc.cluster.local
  RADARR_URL: http://radarr.radarr.svc.cluster.local
  RADARR_RU_URL: http://radarr-ru.radarr-ru.svc.cluster.local
  SONARR_RU_URL: http://sonarr-ru.sonarr-ru.svc.cluster.local
  PROWLARR_URL: http://prowlarr.prowlarr.svc.cluster.local
  PLEX_URL: http://plex.plex.svc.cluster.local:32400
  GIT_AUTHOR_NAME: hermes
  GIT_AUTHOR_EMAIL: hermes@sync.lt
  GIT_COMMITTER_NAME: hermes
  GIT_COMMITTER_EMAIL: hermes@sync.lt
  # git push over https authenticates with HERMES_GITHUB_TOKEN via the gh wrapper
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: "!gh auth git-credential"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-oauth2-proxy
data:
  OAUTH2_PROXY_PROVIDER: google
  OAUTH2_PROXY_EMAIL_DOMAIN: "*"
  OAUTH2_PROXY_UPSTREAMS: "http://127.0.0.1:9119"
  OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
  OAUTH2_PROXY_REDIRECT_URL: "https://hermes.sync.lt/oauth2/callback"
  OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/authenticated-emails
  OAUTH2_PROXY_COOKIE_DOMAINS: ".sync.lt"
  OAUTH2_PROXY_WHITELIST_DOMAINS: ".sync.lt"
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

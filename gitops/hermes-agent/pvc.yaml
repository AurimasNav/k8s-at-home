apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  annotations:
    # Not backed up as a whole: k8up's PreBackupPod hermes-essentials (gitops/k8up) streams only
    # cron jobs, lists, plans, the coordination board and rollback files. The rest is in git or
    # can be rebuilt (Aurimas, 2026-11-03).
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app: hermes-agent
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # two gateways must never share /opt/data
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      initContainers:
      # one-time move of the PVC from the image's hermes uid (10000) to 1000:1000, the owner of the media
      # disks (HERMES_UID below). Marker-gated, so later starts skip the walk; never blocks the pod.
      - name: owner-1000
        image: nousresearch/hermes-agent:latest
        command: ["sh", "-c"]
        args:
        - >-
          m=/opt/data/.owner-1000;
          [ -f "$m" ] && exit 0;
          t=$(date +%s);
          if find /opt/data -xdev \( -uid 10000 -o -gid 10000 \) -exec chown -h 1000:1000 {} +; then
          touch "$m" && chown 1000:1000 "$m" && echo "owner-1000: done in $(( $(date +%s) - t ))s";
          else echo "owner-1000: chown failed, will retry on the next start"; fi;
          exit 0
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /opt/data
      - name: kubectl
        image: alpine/k8s:latest
        command: ["sh", "-c", "cp \"$(command -v kubectl)\" /tools/"]
        volumeMounts:
        - name: tools
          mountPath: /tools
      - name: gh
        image: alpine/k8s:latest
        env:
        # renovate: datasource=github-releases depName=cli/cli
        - name: GH_VERSION
          value: "2.103.3"
        command: ["sh", "-c"]
        args:
        - >-
          curl -fsSL https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz
          | tar -xzO gh_${GH_VERSION}_linux_amd64/bin/gh > /tools/gh-bin &&
          printf '#!/bin/sh\nGH_TOKEN="${GH_TOKEN:-$HERMES_GITHUB_TOKEN}" exec /usr/local/sbin/gh-bin "$@"\n' > /tools/gh &&
          chmod +x /tools/gh /tools/gh-bin
        volumeMounts:
        - name: tools
          mountPath: /tools
      # placeholders stay literal in config.yaml; Hermes resolves them from env at connect time
      - name: mcp-config
        image: nousresearch/hermes-agent:latest
        command: ["sh", "-c"]
        args:
        - >-
          hermes config set mcp_servers.home_assistant.url '${HA_URL}/api/mcp' &&
          hermes config set mcp_servers.home_assistant.headers.Authorization 'Bearer ${HA_TOKEN}' &&
          hermes config set model.default claude-opus-5-5 &&
          hermes config set agent.reasoning_effort xhigh &&
          hermes config set display.platforms.telegram.tool_progress off &&
          hermes config set display.platforms.telegram.show_reasoning false &&
          hermes config set display.platforms.telegram.interim_assistant_messages false &&
          hermes config set approvals.timeout 1800 &&
          hermes config set plugins.enabled '["approval-ping"]'
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /opt/data
      # upstream fixes not in a release yet (patches/*.diff), mounted over /opt/hermes below
      - name: hermes-patches
        image: nousresearch/hermes-agent:latest
        command: ["sh", "/patches/apply.sh"]
        env:
        - name: HOME
          value: /tmp
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: patches
          mountPath: /patches
          readOnly: true
        - name: hermes-patched
          mountPath: /patched
      # cron job definitions come from git (cron/jobs.yaml); scheduler state stays on the PVC
      - name: cron-sync
        image: nousresearch/hermes-agent:latest
        command: ["/opt/hermes/.venv/bin/python", "/cron-config/cron_sync.py", "/cron-config/jobs.yaml"]
        env:
        - name: HERMES_HOME
          value: /opt/data
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: cron-config
          mountPath: /cron-config
          readOnly: true
      # CAD tools for 3D-printing work: rebuilds /opt/data/venvs/cad from cad/requirements.txt on
      # every start so it can't drift from git. The uv cache on the PVC makes a warm start ~1 s and
      # lets it rebuild offline; a failed install only logs, it never blocks the pod.
      - name: cad-venv
        image: nousresearch/hermes-agent:latest
        command: ["sh", "-c"]
        args:
        - >-
          t=$(date +%s);
          uv venv -q --clear --python /usr/bin/python3 /opt/data/venvs/cad &&
          { uv pip install -q --python /opt/data/venvs/cad/bin/python -r /cad/requirements.txt ||
          uv pip install -q --offline --python /opt/data/venvs/cad/bin/python -r /cad/requirements.txt; } &&
          echo "cad-venv: ready in $(( $(date +%s) - t ))s" ||
          echo "cad-venv: install failed, CAD tools unavailable until the next restart";
          exit 0
        env:
        - name: UV_CACHE_DIR
          value: /opt/data/home/.cache/uv
        - name: UV_PYTHON_DOWNLOADS
          value: never
        # the image's WORKDIR is /opt/hermes, whose pyproject.toml [tool.uv] sets exclude-newer = "14 days";
        # uv would apply it here and refuse pins younger than two weeks ("no version of trimesh==5.2.0")
        - name: UV_NO_CONFIG
          value: "1"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: cad
          mountPath: /cad
          readOnly: true
      containers:
      - name: hermes-agent
        image: nousresearch/hermes-agent:latest
        args: ["gateway", "run"]
        # the image remaps its hermes user to this uid/gid at boot; 1000:1000 owns the media disks (/data),
        # so Hermes can clean them up itself (Aurimas, 2026-11-02)
        env:
        - name: HERMES_UID
          value: "1000"
        - name: HERMES_GID
          value: "1000"
        envFrom:
        - configMapRef:
            name: hermes-agent
        - secretRef:
            name: hermes-agent
        - secretRef:
            name: hermes-agent-doppler
            optional: true
        - secretRef:
            name: hermes-agent-arr-ru
            optional: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 3Gi
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: dshm
          mountPath: /dev/shm
        # read-write (Aurimas, 2026-11-02): Hermes cleans the media library itself (duplicate copies,
        # leftover torrent files, folder moves) as uid 1000, the arrs' user. Prefer the *arr/Plex/qBit
        # APIs; direct changes are deletes or renames only.
        - name: media
          mountPath: /data
        # on the image PATH and empty in debian
        - name: tools
          mountPath: /usr/local/sbin
        # git is the source of truth; edits go through PRs
        - name: scripts
          mountPath: /opt/data/scripts
          readOnly: true
        # @-mention + reminders on Telegram while an approval/clarify prompt waits
        - name: plugin-approval-ping
          mountPath: /opt/data/plugins/approval-ping
          readOnly: true
        # NousResearch/hermes-agent#144184: aux retry after pool rotation reused the capped key
        - name: hermes-patched
          mountPath: /opt/hermes/agent/auxiliary_client.py
          subPath: agent/auxiliary_client.py
          readOnly: true
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        ports:
        - containerPort: 4180
          protocol: TCP
        envFrom:
        - secretRef:
            name: hermes-agent-oauth2-proxy
        - configMapRef:
            name: hermes-agent-oauth2-proxy
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: emails
          mountPath: /etc/oauth2-proxy
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-agent-data
      - name: tools
        emptyDir: {}
      - name: cron-config
        configMap:
          name: hermes-agent-cron
      - name: cad
        configMap:
          name: hermes-agent-cad
      - name: scripts
        configMap:
          name: hermes-agent-scripts
          defaultMode: 0555
      - name: patches
        configMap:
          name: hermes-agent-patches
      - name: hermes-patched
        emptyDir: {}
      - name: plugin-approval-ping
        configMap:
          name: hermes-agent-plugin-approval-ping
      - name: media
        hostPath:
          path: /data
          type: Directory
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: emails
        secret:
          secretName: hermes-agent-oauth2-proxy
          items:
          - key: AUTHENTICATED_EMAILS
            path: authenticated-emails

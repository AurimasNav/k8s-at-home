apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app: hermes-agent
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # two gateways must never share /opt/data
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      initContainers:
      - name: kubectl
        image: alpine/k8s:latest
        command: ["sh", "-c", "cp \"$(command -v kubectl)\" /tools/"]
        volumeMounts:
        - name: tools
          mountPath: /tools
      - name: gh
        image: alpine/k8s:latest
        env:
        # renovate: datasource=github-releases depName=cli/cli
        - name: GH_VERSION
          value: "2.102.0"
        command: ["sh", "-c"]
        args:
        - >-
          curl -fsSL https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz
          | tar -xzO gh_${GH_VERSION}_linux_amd64/bin/gh > /tools/gh-bin &&
          printf '#!/bin/sh\nGH_TOKEN="${GH_TOKEN:-$HERMES_GITHUB_TOKEN}" exec /usr/local/sbin/gh-bin "$@"\n' > /tools/gh &&
          chmod +x /tools/gh /tools/gh-bin
        volumeMounts:
        - name: tools
          mountPath: /tools
      # placeholders stay literal in config.yaml; Hermes resolves them from env at connect time
      - name: mcp-config
        image: nousresearch/hermes-agent:latest
        command: ["sh", "-c"]
        args:
        - >-
          hermes config set mcp_servers.home_assistant.url '${HA_URL}/api/mcp' &&
          hermes config set mcp_servers.home_assistant.headers.Authorization 'Bearer ${HA_TOKEN}'
        volumeMounts:
        - name: data
          mountPath: /opt/data
      containers:
      - name: hermes-agent
        image: nousresearch/hermes-agent:latest
        args: ["gateway", "run"]
        envFrom:
        - configMapRef:
            name: hermes-agent
        - secretRef:
            name: hermes-agent
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 3Gi
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: dshm
          mountPath: /dev/shm
        # read-only: the container runs as root
        - name: media
          mountPath: /data
          readOnly: true
        # on the image PATH and empty in debian
        - name: tools
          mountPath: /usr/local/sbin
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        ports:
        - containerPort: 4180
          protocol: TCP
        envFrom:
        - secretRef:
            name: hermes-agent-oauth2-proxy
        - configMapRef:
            name: hermes-agent-oauth2-proxy
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: emails
          mountPath: /etc/oauth2-proxy
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-agent-data
      - name: tools
        emptyDir: {}
      - name: media
        hostPath:
          path: /data
          type: Directory
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: emails
        secret:
          secretName: hermes-agent-oauth2-proxy
          items:
          - key: AUTHENTICATED_EMAILS
            path: authenticated-emails

# GitHub token for refresh.py: a fine-grained personal access token limited to the repository
# AurimasNav/atlieku-surinkimo-grafikas, with Contents: read and write (push the bot branches,
# merge), Pull requests: read and write (open, update, close) and Metadata: read. Commit
# statuses/checks are public, so no permission is needed to read them. It doesn't need
# Workflows: the bot commits only pipeline/data.
# Doppler: SIUKSLIAVEZE_GITHUB_TOKEN. The CronJobs read it as GITHUB_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: siuksliaveze-snapshot-github
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: siuksliaveze-snapshot-github
  data:
  - secretKey: token
    remoteRef:
      key: SIUKSLIAVEZE_GITHUB_TOKEN

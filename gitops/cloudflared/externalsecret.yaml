# Connector token for tunnel "k3s". Written to Doppler by the IaC apply (iac/cloudflare/doppler.tf);
# rotating the tunnel secret there updates it, and Reloader restarts the connector.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudflared
  data:
  - secretKey: TUNNEL_TOKEN
    remoteRef:
      key: TUNNEL_TOKEN

# The connector is the internet's way in, so it may only reach what it serves.
# Ingress: kubelet probes and Hermes (health checks) on the metrics port; nothing else.
# Egress: DNS, Cloudflare's tunnel edge (TCP 7844, HTTP/2), the Cilium gateway, and the
# backends behind the tunnel hostnames.
#
# Why the backends are listed: requests to the gateway go through Envoy, and Cilium (>= 1.17.2,
# GHSA-24qp-4xx8-3jvj) checks the CLIENT's egress policy against the backend pod Envoy picks.
# So every app served through the tunnel (iac/cloudflare/tunnel.tf, local.tunnel_hostnames) needs
# an entry here, plus oauth2-proxy for the Google login check. Missing entry = 403 from Envoy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
spec:
  endpointSelector:
    matchLabels:
      app: cloudflared
  ingress:
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: "2000"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: hermes-agent
        app: hermes-agent
    toPorts:
    - ports:
      - port: "2000"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: "*"
  # Cloudflare edge: region1/region2.v2.argotunnel.com (and the US/FedRAMP variants), HTTP/2 (TCP).
  - toFQDNs:
    - matchPattern: "*.v2.argotunnel.com"
    toPorts:
    - ports:
      - port: "7844"
        protocol: TCP
  # The Cilium gateway Service (cilium-gateway/main), tunnel listener https-tunnel only.
  - toServices:
    - k8sService:
        serviceName: cilium-gateway-main
        namespace: cilium-gateway
    toPorts:
    - ports:
      - port: "10443"
        protocol: TCP
  # Backends behind the gateway, one entry per tunnel hostname.
  # Google login check (ExternalAuth) for every protected host, and login.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: oauth2-proxy
        app: oauth2-proxy
    toPorts:
    - ports:
      - port: "4180"
        protocol: TCP
  # cleanuparr.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cleanuparr
        app: cleanuparr
    toPorts:
    - ports:
      - port: "11011"
        protocol: TCP
  # homebox.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: homebox
        app: homebox
    toPorts:
    - ports:
      - port: "7745"
        protocol: TCP
  # home.sync.lt /
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: homepage
        app.kubernetes.io/name: homepage
        app.kubernetes.io/instance: homepage
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  # home.sync.lt /telegram
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: telegram-dl
        app: telegram-dl
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  # prowlarr.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: prowlarr
        app: prowlarr
    toPorts:
    - ports:
      - port: "9696"
        protocol: TCP
  # qbittorrent.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: qbittorrent
        app: qbittorrent
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  # radarr.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: radarr
        app: radarr
    toPorts:
    - ports:
      - port: "7878"
        protocol: TCP
  # radarr-lt.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: radarr-lt
        app: radarr-lt
    toPorts:
    - ports:
      - port: "7878"
        protocol: TCP
  # radarr-ru.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: radarr-ru
        app: radarr-ru
    toPorts:
    - ports:
      - port: "7878"
        protocol: TCP
  # sonarr.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: sonarr
        app: sonarr
    toPorts:
    - ports:
      - port: "8989"
        protocol: TCP
  # sonarr-lt.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: sonarr-lt
        app: sonarr-lt
    toPorts:
    - ports:
      - port: "8989"
        protocol: TCP
  # sonarr-ru.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: sonarr-ru
        app: sonarr-ru
    toPorts:
    - ports:
      - port: "8989"
        protocol: TCP
  # grafana.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: victoriametrics
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: victoria-metrics-k8s-stack
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  # seerr.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: seerr
        app: seerr
    toPorts:
    - ports:
      - port: "5055"
        protocol: TCP
  # hair.sync.lt
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: hairsera
        app: hairsera
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  # ha.sync.lt: Home Assistant runs with hostNetwork (node IP), so its identity is the host entity.
  - toEntities:
    - host
    toPorts:
    - ports:
      - port: "8123"
        protocol: TCP
  # hermes.sync.lt (the pod's own oauth2-proxy sidecar)
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: hermes-agent
        app: hermes-agent
    toPorts:
    - ports:
      - port: "4180"
        protocol: TCP

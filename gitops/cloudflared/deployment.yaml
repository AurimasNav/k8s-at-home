apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
  annotations:
    # restart when the token Secret changes
    reloader.stakater.com/auto: "true"
spec:
  # Two connectors: one can restart (upgrade, node drain) while the other keeps the tunnel up.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.10.7
        # Remotely managed tunnel: the ingress rules come from Cloudflare (iac/cloudflare/tunnel.tf).
        args:
        - tunnel
        - --no-autoupdate
        - --metrics
        - 0.0.0.0:2000
        - run
        env:
        - name: TUNNEL_TOKEN_FILE
          value: /etc/cloudflared/token/TUNNEL_TOKEN
        ports:
        - name: metrics
          containerPort: 2000
        # /ready is 200 only while the connector has a live connection to Cloudflare.
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ready
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: token
          mountPath: /etc/cloudflared/token
          readOnly: true
      volumes:
      - name: token
        secret:
          secretName: cloudflared

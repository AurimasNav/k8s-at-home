apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cleanuparr
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Google login first, then Cleanuparr's own account (password + 2FA).
    # No HTTPRoute on purpose: the Cilium gateway has no oauth2-proxy, so a route
    # there would skip the Google login.
    nginx.ingress.kubernetes.io/auth-url: "https://login.sync.lt/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://login.sync.lt/oauth2/start?rd=$scheme://$best_http_host$escaped_request_uri"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cleanuparr.sync.lt
    secretName: cleanuparr-letsencrypt
  rules:
  - host: cleanuparr.sync.lt
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cleanuparr
            port:
              name: http

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cleanuparr: queue cleaner (stalled/failed/malware downloads) + Seeker (re-searches
# missing and cutoff-unmet items in Radarr/Sonarr). https://github.com/Cleanuparr/Cleanuparr
#
# Everything is configured in the UI and stored in SQLite on the PVC (there is no
# env/file config for *arr instances). First-run order, before adding any instance:
#   1. Create the account, enable 2FA.
#   2. General: turn ON Dry Run. Keep OFF "Disable Auth for Local Addresses" (every
#      request arrives from the ingress pod, a 10.x address it would trust) and
#      "Trust Forwarded Headers" (GHSA-8q44-v65j-jc3q). Turn OFF Status Check
#      (its egress is blocked anyway).
#   3. Add Radarr http://radarr.radarr, Sonarr http://sonarr.sonarr and
#      qBittorrent http://qbittorrent.qbittorrent.
namespace: cleanuparr

resources:
- ./deployment.yaml
- ./service.yaml
- ./ingress.yaml
- ./configmap.yaml
- ./pvc.yaml
- ./networkpolicy.yaml

# Cilium gateway route. No gateway login (oauth2-proxy ExternalAuth): Cleanuparr's own Google
# sign-in (setup job, linked to one Google account) is the login, so it isn't asked for twice.
# Without a session only the app shell, /health and /api/auth/status answer; the API is 401,
# and password logins lock out after repeated failures.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cleanuparr
spec:
  parentRefs:
  # Served only through the Cloudflare Tunnel (listener https-tunnel, iac/cloudflare/tunnel.tf);
  # the home IP's 443 listener does not serve this host.
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel
  hostnames:
  - cleanuparr.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Envoy's default is 15 s for the whole response; 0s turns that off (long downloads,
    # interactive searches, streams). Idle connections still close after 300 s.
    timeouts:
      request: 0s
    backendRefs:
    - name: cleanuparr
      port: 80

# Cilium gateway route with the Google login (oauth2-proxy as ExternalAuth).
# Rule: a request without a valid _oauth2_proxy cookie never reaches Cleanuparr.
#   - Browser: oauth2-proxy answers 403 with its sign-in page; the page's script sends the
#     browser to https://login.sync.lt/oauth2/start?rd=<this URL> (one Google callback for all).
#   - Accept: application/json: 401.
# http.path /_authz is required: it prefixes every check path, so a check never hits one of
# oauth2-proxy's own endpoints. Without it /ping, /ready, /robots.txt, /oauth2/sign_in and
# /oauth2/static/* answer 200 without a session, and Envoy would pass those requests on to
# the app unauthenticated.
# allowedResponseHeaders must stay an explicit list: empty means "copy every auth response
# header into the request", which would overwrite e.g. Content-Type.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cleanuparr
spec:
  parentRefs:
  # Served only through the Cloudflare Tunnel (listener https-tunnel, iac/cloudflare/tunnel.tf);
  # the home IP's 443 listener does not serve this host.
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel
  hostnames:
  - cleanuparr.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          name: oauth2-proxy
          namespace: oauth2-proxy
          port: 4180
        http:
          path: /_authz
          allowedHeaders:
          - cookie
          - accept
          allowedResponseHeaders:
          - x-auth-request-user
          - x-auth-request-email
    # Envoy's default is 15 s for the whole response; 0s turns that off (long downloads,
    # interactive searches, streams). Idle connections still close after 300 s.
    timeouts:
      request: 0s
    backendRefs:
    - name: cleanuparr
      port: 80

# Cilium gateway route with the Google login (oauth2-proxy as ExternalAuth).
# Rule: a request without a valid _oauth2_proxy cookie never reaches Cleanuparr.
#   - Browser: oauth2-proxy answers 403 with its sign-in page; the page's script sends the
#     browser to https://login.sync.lt/oauth2/start?rd=<this URL> (one Google callback for all).
#   - Accept: application/json: 401.
# allowedResponseHeaders must stay an explicit list: empty means "copy every auth response
# header into the request", which would overwrite e.g. Content-Type.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cleanuparr
spec:
  parentRefs:
  - name: main
    namespace: cilium-gateway
    sectionName: https-wildcard
  hostnames:
  - cleanuparr.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          name: oauth2-proxy
          namespace: oauth2-proxy
          port: 4180
        http:
          allowedHeaders:
          - cookie
          - accept
          allowedResponseHeaders:
          - x-auth-request-user
          - x-auth-request-email
    backendRefs:
    - name: cleanuparr
      port: 80

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homebox
  namespace: homebox
spec:
  parentRefs:
  - name: main
    namespace: cilium-gateway
    sectionName: https-homebox
  hostnames:
  - homebox.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: homebox
      port: 80

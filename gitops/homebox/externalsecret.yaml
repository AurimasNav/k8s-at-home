apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox
  namespace: homebox
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: homebox
  data:
  - secretKey: HBOX_DATABASE_PASSWORD
    remoteRef:
      key: HBOX_DATABASE_PASSWORD
  - secretKey: HBOX_AUTH_API_KEY_PEPPER
    remoteRef:
      key: HBOX_AUTH_API_KEY_PEPPER

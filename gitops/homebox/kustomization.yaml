apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./configmap.yaml
- ./externalsecret.yaml
- ./pvc.yaml
- ./deployment.yaml
- ./service.yaml
# httproute.yaml is deliberately not included, same as the other
# oauth2-proxy-protected apps: the Cilium gateway has no ext_authz, so the
# route would serve Homebox without the login.sync.lt check.
- ./ingress.yaml

images:
- name: ghcr.io/sysadminsmedia/homebox
  newTag: 0.27.1-rootless

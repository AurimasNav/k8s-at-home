apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox
  namespace: homebox
  labels:
    app: homebox
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homebox
  template:
    metadata:
      labels:
        app: homebox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: homebox
        image: ghcr.io/sysadminsmedia/homebox:latest-rootless
        ports:
        - containerPort: 7745
        envFrom:
        - configMapRef:
            name: homebox
        - secretRef:
            name: homebox
        volumeMounts:
        - name: data
          mountPath: /data
        # The host has memory-pressure spells of about 5 minutes (night jobs, FlareSolverr's Chrome)
        # in which healthy pods answer slowly. The default 1 s timeout x 3 failures restarted them
        # mid-spell; 5 s per check and ~5 min of failures before a restart rides a spell out
        # (Postgres got the same in #1148).
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: 7745
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/status
            port: 7745
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 30
          failureThreshold: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: homebox-data

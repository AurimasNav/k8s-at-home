# Port 80: redirect every host to HTTPS with 308, same as ingress-nginx today (308 keeps POST a POST).
# Certificates use DNS-01, so nothing needs plain HTTP for ACME.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: cilium-gateway
spec:
  parentRefs:
  - name: main
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 308

# One certificate for every host: sync.lt + *.sync.lt (DNS-01, see cert-manager ClusterIssuer).
# Used by the gateway listeners https-tunnel and https-tunnel-apex (gateway.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sync-lt-wildcard
  namespace: cilium-gateway
spec:
  secretName: sync-lt-wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
  - sync.lt
  - "*.sync.lt"

# Temporary (step 1 of 2). The per-host certificates the old 15 listeners used. cert-manager's
# gateway-shim created them with an ownerReference to Gateway main, which Argo CD treats as "not
# mine", so it can neither show nor prune them. Replace=true makes Argo CD PUT these manifests,
# which drops that ownerReference and adopts them (same spec: no reissue). The next PR deletes
# this file and Argo CD prunes them; their Secrets go too (cert-manager owner-ref flag).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: flood-tls
  namespace: cilium-gateway
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  secretName: flood-tls
  dnsNames:
  - flood.sync.lt
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  usages:
  - digital signature
  - key encipherment
---

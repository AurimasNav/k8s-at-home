apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: cilium-gateway
spec:
  gatewayClassName: cilium
  listeners:
  # Plain HTTP: only the HTTP -> HTTPS redirect (http-redirect.yaml) attaches here.
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  # sync.lt and *.sync.lt share one certificate (certificate.yaml, DNS-01). A wildcard listener
  # does not match the apex, hence two listeners.
  # Routes must name their listener with sectionName (https-wildcard / https-apex): a route
  # without sectionName also attaches to the http listener and would be served over plain HTTP.
  - name: https-apex
    hostname: sync.lt
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: sync-lt-wildcard-tls
        namespace: cilium-gateway
  - name: https-wildcard
    hostname: "*.sync.lt"
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: sync-lt-wildcard-tls
        namespace: cilium-gateway

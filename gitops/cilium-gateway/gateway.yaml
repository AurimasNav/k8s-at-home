apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: cilium-gateway
spec:
  gatewayClassName: cilium
  # Every public host is served only through the Cloudflare Tunnel (gitops/cloudflared,
  # iac/cloudflare/tunnel.tf): cloudflared connects here on :10443. The router forwards no
  # port to this gateway, and the home IP is in no DNS record.
  # sync.lt and *.sync.lt share one certificate (certificate.yaml, DNS-01). A wildcard listener
  # does not match the apex, hence two listeners.
  # Routes must name their listener with sectionName (https-tunnel / https-tunnel-apex).
  listeners:
  - name: https-tunnel
    hostname: "*.sync.lt"
    port: 10443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: sync-lt-wildcard-tls
        namespace: cilium-gateway
  - name: https-tunnel-apex
    hostname: sync.lt
    port: 10443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: sync-lt-wildcard-tls
        namespace: cilium-gateway

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app: sonarr
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Stop the old pod before starting the new one: two Sonarr instances must never
  # share the /config SQLite DB (RWO local-path PVC).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        image: ghcr.io/linuxserver/sonarr:5.0.0-develop
        imagePullPolicy: Always
        ports:
        - containerPort: 8989
        envFrom:
        - configMapRef:
            name: sonarr
        - secretRef:
            name: sonarr
        volumeMounts:
        - name: sonarr-config
          mountPath: /config
        - name: data
          mountPath: /data
      volumes:
      - name: sonarr-config
        persistentVolumeClaim:
          claimName: sonarr-config
      - name: data
        hostPath:
          path: /data
          type: Directory



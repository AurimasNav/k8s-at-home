# API key of the test Prowlarr, so Hermes can run the tests through the API. The pod env name
# is fixed by Prowlarr (Prowlarr:Auth:ApiKey); the Doppler key says what it is.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr-test
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: prowlarr-test
  data:
  - secretKey: PROWLARR__AUTH__APIKEY
    remoteRef:
      key: PROWLARR_TEST_API_KEY

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Test Prowlarr for trying upstream Prowlarr contributions before they are released (first
# used for Prowlarr/Prowlarr#2765, the LostFilm.tv indexer). Image: github.com/AurimasNav/prowlarr-pr-builds,
# which builds a Prowlarr PR (optionally with a patch) on the linuxserver.io image.
# Separate from the real Prowlarr: own namespace, own empty settings, not linked to any
# Radarr/Sonarr.
#
# PARKED while no test runs: the app is commented out in argocd-apps/base/kustomization.yaml,
# so nothing here is deployed. Keep this folder. To test again: build an image, pin it in
# deployment.yaml, uncomment the app. Parking deletes the PVC, so it comes back with empty
# settings. The hostname (iac/cloudflare), the oauth2-proxy ReferenceGrant and the cloudflared
# CNP entry stay in place, so prowlarr-test.sync.lt works again as soon as the app is back.
namespace: prowlarr-test

resources:
- ./deployment.yaml
- ./service.yaml
- ./configmap.yaml
- ./externalsecret.yaml
- ./pvc.yaml
- ./httproute.yaml
- ./networkpolicy.yaml

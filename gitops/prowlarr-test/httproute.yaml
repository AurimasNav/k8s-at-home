# Cilium gateway route behind the Google login (oauth2-proxy ExternalAuth);
# the filter settings are explained in gitops/oauth2-proxy/referencegrant.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr-test
spec:
  parentRefs:
  # Served only through the Cloudflare Tunnel (listener https-tunnel, iac/cloudflare/tunnel.tf).
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel
  hostnames:
  - prowlarr-test.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          name: oauth2-proxy
          namespace: oauth2-proxy
          port: 4180
        http:
          path: /_authz
          allowedHeaders:
          - cookie
          - accept
          allowedResponseHeaders:
          - x-auth-request-user
          - x-auth-request-email
    timeouts:
      request: 0s
    backendRefs:
    - name: prowlarr-test
      port: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr-test
  labels:
    app: prowlarr-test
spec:
  replicas: 1
  # SQLite on an RWO PVC: never two pods on the same database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr-test
  template:
    metadata:
      labels:
        app: prowlarr-test
    spec:
      containers:
      - name: prowlarr
        # Prowlarr develop 69530d9 + PR #2765 head cfb7541, built by
        # github.com/AurimasNav/prowlarr-pr-builds run 41797793485 (Prowlarr 3.0.1.3): PR #2765 plus the
        # proposed fixes in patches/pr2765-lostfilm-fixes.patch (mirror session reuse, date parsing).
        image: ghcr.io/aurimasnav/prowlarr-pr-builds:pr2765-cfb7541-develop-69530d9-pr2765-pr-a-b-c-r25@sha256:afaa681563d653a52ddf029846a3f873574828e5da57d864dd7704c515c7f487
        ports:
        - containerPort: 9696
        envFrom:
        - configMapRef:
            name: prowlarr-test
        - secretRef:
            name: prowlarr-test
        readinessProbe:
          tcpSocket:
            port: 9696
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: prowlarr-test-config

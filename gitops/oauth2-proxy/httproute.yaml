apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  parentRefs:
  - name: main
    namespace: cilium-gateway
    sectionName: https-wildcard
  hostnames:
  - login.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /oauth2
    # Envoy's default is 15 s for the whole response; 0s turns that off (long downloads,
    # interactive searches, streams). Idle connections still close after 300 s.
    timeouts:
      request: 0s
    backendRefs:
    - name: oauth2-proxy
      port: 4180

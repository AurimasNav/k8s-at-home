# The photo library: a directory on media disk hdd0 (one disk, never split across the mergerfs
# pool), bound to exactly one claim. Plex reads the same files through the pool as
# /data/media/immich/library (Photos library "Immich").
# k8up backs this claim up nightly (gitops/k8up/schedules.yaml) to the restic store on hdd2.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
spec:
  capacity:
    storage: 10Ti
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: immich
    name: immich-library
  hostPath:
    path: /mnt/hdd0/media/immich
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ""
  volumeName: immich-library
  resources:
    requests:
      storage: 10Ti

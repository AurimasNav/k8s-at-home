apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: immich-db
  data:
  # Alphanumeric only (Immich's DB URL is built from it).
  - secretKey: DB_PASSWORD
    remoteRef:
      key: IMMICH_DB_PASSWORD
---
# The shared Google OAuth client (also used by oauth2-proxy and hairsera). Immich's redirect URIs
# (photos.sync.lt /auth/login, /user-settings, /api/oauth/mobile-redirect) are registered on it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-oauth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: immich-oauth
  dataFrom:
  - extract:
      key: GOOGLE_OAUTH_JSON
    rewrite:
    - regexp:
        source: GOOGLE_OAUTH_CLIENT_ID
        target: OAUTH_CLIENT_ID
    - regexp:
        source: GOOGLE_OAUTH_CLIENT_SECRET
        target: OAUTH_CLIENT_SECRET

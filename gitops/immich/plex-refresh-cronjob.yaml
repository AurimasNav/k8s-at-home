# Hourly rescan of the Plex photo library "Immich" (see plex-refresh/refresh.py for why).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-plex-refresh
spec:
  schedule: "17 * * * *"
  timeZone: Europe/Vilnius
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: immich-plex-refresh
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: refresh
            image: python
            command: ["python3", "/app/refresh.py"]
            env:
            - name: PLEX_URL
              value: http://plex.plex:32400
            - name: LIBRARY_LOCATION
              value: /data/media/immich/library
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            envFrom:
            - secretRef:
                name: immich-plex-refresh
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          volumes:
          - name: app
            configMap:
              name: immich-plex-refresh
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-plex-refresh
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: immich-plex-refresh
  data:
  - secretKey: HERMES_PLEX_TOKEN
    remoteRef:
      key: HERMES_PLEX_TOKEN

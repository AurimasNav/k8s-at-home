# Immich server: web UI, API (phone apps) and the background workers (thumbnails, metadata,
# storage template). Runs as 1000:1000, the owner of the media tree, so Plex can read the files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  labels:
    app: immich-server
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Writes /config/immich.json = config/immich.json (git) + the Google OAuth client (Doppler).
      initContainers:
      - name: render-config
        image: ghcr.io/immich-app/immich-server:v3.4.0
        command: ["node", "/config-template/render-config.js"]
        envFrom:
        - secretRef:
            name: immich-oauth
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config-template
          mountPath: /config-template
          readOnly: true
        - name: config
          mountPath: /config
      containers:
      - name: server
        image: ghcr.io/immich-app/immich-server:v3.4.0
        ports:
        - containerPort: 2283
        env:
        - name: TZ
          value: Europe/Vilnius
        - name: IMMICH_CONFIG_FILE
          value: /config/immich.json
        - name: DB_HOSTNAME
          value: immich-postgres
        - name: DB_USERNAME
          value: postgres
        - name: DB_DATABASE_NAME
          value: immich
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-db
              key: DB_PASSWORD
        - name: REDIS_HOSTNAME
          value: immich-valkey
        startupProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: library
          mountPath: /data
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: library
        persistentVolumeClaim:
          claimName: immich-library
      - name: config-template
        configMap:
          name: immich-config
      # Rendered config (holds the OAuth client secret): memory only, never on disk.
      - name: config
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
spec:
  selector:
    app: immich-server
  ports:
  - name: http
    port: 2283
    targetPort: 2283

# Motion notifications are deliberately NOT here: the Hikvision native app
# already sends them and its notification opens straight into the NVR playback
# clip, which HA cannot do (that needs a Hik-Connect deep link with an event
# timestamp; no such scheme is published). HA could only attach a clip it
# recorded itself or link to a dashboard - strictly worse. The alerts below stay
# because the native app does not cover them.

- id: hikvision_kiemas_tamper_or_videoloss_alert
  alias: Hikvision - Kiemas tamper/video loss alert
  triggers:
  - trigger: state
    entity_id: binary_sensor.parking_kiemas_tampering
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.parking_kiemas_video_loss
    to: 'on'
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: Camera alert - Kiemas
      message: >-
        {{ trigger.to_state.attributes.friendly_name }} triggered on the
        Kiemas camera.
  mode: single

- id: hikvision_nvr_reboot_on_sustained_videoloss
  alias: Hikvision - reboot NVR on sustained video loss
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.parking_kiemas_video_loss
    - binary_sensor.terrace_terasa_video_loss
    - binary_sensor.walkway_sonas_video_loss
    to: 'on'
    for:
      minutes: 15
  # video loss is a 5 s pulse per NVR event; the polled channel status stays off
  - trigger: state
    entity_id:
    - binary_sensor.parking_kiemas_camera_connected
    - binary_sensor.terrace_terasa_camera_connected
    - binary_sensor.walkway_sonas_camera_connected
    to: 'off'
    for:
      minutes: 15
  actions:
  - action: button.press
    target:
      entity_id: button.network_video_recorder_restart
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: NVR rebooted
      message: >-
        {{ trigger.to_state.attributes.friendly_name }} has been
        {{ trigger.to_state.state }} for 15+ minutes - rebooted the NVR to try
        to recover it.
  mode: single

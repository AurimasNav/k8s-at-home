- id: flexit_filter_polluted_alert
  alias: Flexit - filter polluted alert
  triggers:
  - trigger: state
    entity_id: binary_sensor.flexit_nordic_air_filter_polluted
    to: 'on'
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: Flexit ventilation
      message: >-
        Air filter is polluted and needs cleaning/replacement. Operating
        time so far: {{ states('sensor.flexit_nordic_air_filter_operating_time') }}h.
  mode: single

# Phone presence is flaky (a phone can sit at not_home for days while its owner
# is in the house, or blip home->not_home within a minute), so a 15-minute rule
# kept dropping the unit to Away with people at home. Only go Away once neither
# phone has shown up at home for a full 24 h.
#
# Polls instead of a `for: 24h` state trigger: `for` timers do not survive an HA
# restart. After a restart the person entities' last_changed resets to the boot
# time, so the 24 h window restarts too — that errs on the side of staying Home.
# Any change of a person's state (home, or a move between zones) restarts the
# window. Return-to-Home is handled by flexit_preset_home_when_someone_returns.
- id: flexit_preset_away_when_empty
  alias: Flexit - away preset when house is empty
  triggers:
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: state
    entity_id: climate.flexit_nordic
    attribute: preset_mode
    state: home
  - condition: template
    value_template: >-
      {% set people = expand('person.aurimas', 'person.aleksandra') | list %}
      {{ people | count == 2
         and people | rejectattr('state', 'in', ['home', 'unknown', 'unavailable'])
                    | list | count == 2
         and people | selectattr('last_changed', 'gt', now() - timedelta(hours=24))
                    | list | count == 0 }}
  actions:
  - action: climate.set_preset_mode
    target:
      entity_id: climate.flexit_nordic
    data:
      preset_mode: away
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: Flexit ventilation
      message: >-
        Neither phone has been home for 24 h - switched ventilation to Away.
        It goes back to Home as soon as one of you arrives.
  mode: single

- id: flexit_preset_home_when_someone_returns
  alias: Flexit - home preset when someone returns
  triggers:
  - trigger: state
    entity_id:
    - person.aurimas
    - person.aleksandra
    to: home
  conditions:
  - condition: state
    entity_id: climate.flexit_nordic
    attribute: preset_mode
    state: away
  actions:
  - action: climate.set_preset_mode
    target:
      entity_id: climate.flexit_nordic
    data:
      preset_mode: home
  mode: single

- id: flexit_boost_mode_ended
  alias: Flexit - notify when fireplace/high boost ends
  triggers:
  - trigger: state
    entity_id: climate.flexit_nordic
    attribute: preset_mode
    from:
    - fireplace
    - high
    to: home
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: Flexit ventilation
      message: Boost ventilation ended, back to normal (Home) mode.
  mode: single

- id: flexit_heater_running_when_warm
  alias: Flexit - electric heater running despite warm outside temp
  triggers:
  - trigger: numeric_state
    entity_id: sensor.flexit_nordic_electric_heater_power
    above: 0
    for:
      minutes: 10
  conditions:
  - condition: numeric_state
    entity_id: sensor.flexit_nordic_outside_air_temperature
    above: 18
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: Flexit ventilation
      message: >-
        Electric heater has been running for 10+ min while outside air is
        {{ states('sensor.flexit_nordic_outside_air_temperature') }}°C. Worth checking the unit.
  mode: single

- id: flexit_recover_after_outage
  alias: Flexit - recover connection after outage
  description: >-
    The unit drops off the network after a power cut and needs its config entry
    reloaded, or in the worst case a cable replug. Retries the reload before
    asking for hands.
  triggers:
  - trigger: state
    entity_id: climate.flexit_nordic
    to: unavailable
    for:
      minutes: 5
  # the state trigger misses a Flexit that is already unavailable when HA starts (09-27)
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: state
    entity_id: climate.flexit_nordic
    state: unavailable
    for:
      minutes: 5
  actions:
  - repeat:
      sequence:
      - action: homeassistant.reload_config_entry
        target:
          entity_id: climate.flexit_nordic
      - delay:
          minutes: 5
      until:
      - condition: template
        value_template: >-
          {{ not is_state('climate.flexit_nordic', 'unavailable')
             or repeat.index >= 6 }}
  - choose:
    - conditions:
      - condition: state
        entity_id: climate.flexit_nordic
        state: unavailable
      sequence:
      - action: notify.send_message
        target:
          entity_id:
          - notify.iphone
          - notify.xiaomi
        data:
          title: Flexit offline
          message: >-
            Flexit has been unreachable for 30+ minutes and six reload attempts
            did not recover it (192.168.1.139, BACnet id 2, router name POS3). Check
            it still has that IP (DHCP reservation for 00:05:19:22:06:0A), else
            replug its UTP cable or power-cycle the unit. Ventilation itself keeps
            running on its own controller; only monitoring and automations are
            affected.
      # Keeps the run alive so the time_pattern trigger doesn't re-notify for 6 h.
      - delay:
          hours: 6
  mode: single
  max_exceeded: silent

- id: flexit_back_online
  alias: Flexit - back online
  triggers:
  - trigger: state
    entity_id: climate.flexit_nordic
    from: unavailable
    for:
      minutes: 1
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown'] }}"
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: Flexit back online
      message: >-
        Flexit is reachable again - extract air
        {{ states('sensor.flexit_nordic_extract_air_temperature') }} C, filter
        time {{ states('sensor.flexit_nordic_air_filter_operating_time') }}h.
  mode: single
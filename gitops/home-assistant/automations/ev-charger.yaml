- id: ev_charger_plugged_in
  alias: EV charger - notify when car plugged in
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
    to: Standby (plugged)
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: EV charger
      message: >-
        Car plugged in. Mode: {{ states('sensor.charger_mode') }}.
  mode: single

- id: ev_charger_charging_started
  alias: EV charger - notify when charging starts
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
    to: Charging
  actions:
  # Let the draw settle so the estimate is meaningful rather than mid-ramp.
  - delay:
      seconds: 90
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: EV charger
      message: >-
        Charging started, drawing {{ states('sensor.charger_active_power')
        | float(0) | round(0) }} W. Mode: {{ states('sensor.charger_mode') }}.
  mode: single

- id: ev_charger_charging_complete
  alias: EV charger - notify when charging completes
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
    to: Charging completed
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: EV charger
      message: >-
        Charging completed{% if states('sensor.byd_atto_2_battery_level') | is_number %},
        battery at {{ states('sensor.byd_atto_2_battery_level') | round(0) }}%
        ({{ states('sensor.byd_atto_2_range') }} km){% endif %}.
        {{ states('sensor.ev_charging_energy_today') | float(0) | round(1) }} kWh
        charged today.
  mode: single

- id: ev_charger_fault
  alias: EV charger - notify on fault or suspension
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
    to:
    - Faulted
    - Unavailable
    - Charging is suspended (Charge side)
    - Charging suspended (EV side)
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: EV charger problem
      message: >-
        Charger state: {{ states('sensor.charger_status') }}.
  mode: single

# BYD cloud polling is a fixed timer with no sleep/parked back-off (checked in
# coordinator.py), and both intervals default to 300s - ~288 wake-ups a day
# versus a handful from opening the app. Each poll wakes the car and draws its
# 12V battery, so idle polling is pushed right down and only telemetry is sped
# up while the charger reports Charging. Polling then is close to free: the car
# is awake and on shore power anyway.
#
# GPS stays slow even while charging - the car is parked, so location cannot
# change. Raise it in the UI if live tracking while driving is ever wanted.
#
# Entity IDs are discovered via integration_entities() because they carry the
# vehicle name, which is not known until the integration is configured. Before
# that this automation finds nothing and does nothing.
#
# Reconciles on a timer as well as on charger-status changes: a missed edge
# would otherwise leave the car being polled every 5 minutes indefinitely,
# which is exactly the failure this exists to prevent. Every 10 min rather than
# 30 so a freshly-added integration (which starts at upstream's 300s default)
# is pulled down promptly; the action is a no-op when the value already matches.
- id: byd_adaptive_poll_interval
  alias: BYD - fast telemetry poll only while charging
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
  - trigger: time_pattern
    minutes: /10
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      idle_seconds: 14400        # 4 h; max the integration allows is 28800 (8 h)
      charging_seconds: 300
      telemetry: >-
        {{ integration_entities('byd_vehicle')
           | select('search', 'telemetry_poll_interval') | list }}
      gps: >-
        {{ integration_entities('byd_vehicle')
           | select('search', 'gps_poll_interval') | list }}
      wanted_telemetry: >-
        {{ charging_seconds if states('sensor.charger_status') == 'Charging'
           else idle_seconds }}
  - repeat:
      for_each: "{{ telemetry }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ states(repeat.item) | int(0) != wanted_telemetry | int }}"
        then:
        - action: number.set_value
          target:
            entity_id: "{{ repeat.item }}"
          data:
            value: "{{ wanted_telemetry | int }}"
  - repeat:
      for_each: "{{ gps }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ states(repeat.item) | int(0) != idle_seconds | int }}"
        then:
        - action: number.set_value
          target:
            entity_id: "{{ repeat.item }}"
          data:
            value: "{{ idle_seconds | int }}"
  mode: single

# Plugged in and then nothing happens is the classic EV failure - you walk away
# assuming it is charging. Triggered from the charger (5s polling, authoritative
# on plug state) rather than the car, whose plug sensor only refreshes every 4h
# while idle and would report this hours late.
#
# 20 minutes of grace so a scheduled or solar-waiting start is not flagged.
- id: ev_charger_plugged_but_idle
  alias: EV charger - plugged in but not charging
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
    to: Standby (plugged)
    for:
      minutes: 20
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: EV charger
      message: >-
        Car has been plugged in for 20 min without charging. Mode:
        {{ states('sensor.charger_mode') }}.
  mode: single

# Solar-surplus charging with a cheap-grid deadline guarantee.
#
# Sungrow already implements surplus charging: in Eco mode with "grid power draw
# permission" denied, the charger takes PV surplus only and never imports. So
# this arbitrates that one permission rather than modulating current from HA -
# the EMS keeps doing the hard part, and nothing breaks if HA is down.
#
#   default            -> permission OFF: surplus only, never imports
#   below target, and
#   now is one of the
#   cheapest hours     -> permission ON: import allowed to meet the deadline
#   target reached     -> permission OFF
#
# Re-evaluated every 15 min against the CURRENT SoC, which is what makes it
# self-correcting: if charging turns out slower than the assumed rate, later
# runs see a bigger remaining gap and fewer hours left, so more of those hours
# get selected. The assumed rate therefore only has to be roughly right.
#
# Fails safe: no Nord Pool, no SoC, or any missing input all fall through to
# surplus-only rather than granting grid import.
#
# NOTE: the charger must be left in Eco mode (set once in the Sungrow app) -
# this repo deliberately does not write the mode register.
- id: ev_surplus_and_cheap_grid
  alias: EV charger - surplus by default, cheapest grid hours for deadline
  triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: state
    entity_id:
    - sensor.charger_status
    - input_number.ev_target_soc
    - input_datetime.ev_ready_by
    - input_boolean.ev_deadline_charging
  - trigger: homeassistant
    event: start
  variables:
    assumed_charge_kw: 7        # planning rate only; self-corrects (see above)
    battery_kwh: 45             # BYD Atto 2 usable; calibrate from measured kWh vs SoC delta
    area: LT
  actions:
  # --- surplus-only fast paths -------------------------------------------
  - if:
    - condition: template
      value_template: >-
        {{ states('sensor.charger_status') not in ['Standby (plugged)', 'Charging']
           or is_state('input_boolean.ev_deadline_charging', 'off')
           or not states('sensor.byd_atto_2_battery_level') | is_number
           or states('sensor.byd_atto_2_battery_level') | float(0)
              >= states('input_number.ev_target_soc') | float(80)
           or integration_entities('nordpool') | count == 0 }}
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.charger_allow_grid_charging
    - stop: surplus only

  # --- fetch prices ------------------------------------------------------
  - variables:
      np_entry: "{{ config_entry_id(integration_entities('nordpool') | first) }}"
  - action: nordpool.get_prices_for_date
    data:
      config_entry: "{{ np_entry }}"
      date: "{{ now().date() }}"
      areas: ["{{ area }}"]
    response_variable: prices_today
  - action: nordpool.get_prices_for_date
    data:
      config_entry: "{{ np_entry }}"
      date: "{{ (now() + timedelta(days=1)).date() }}"
      areas: ["{{ area }}"]
    response_variable: prices_tomorrow

  # --- decide ------------------------------------------------------------
  - variables:
      allow_grid: >-
        {% set soc = states('sensor.byd_atto_2_battery_level') | float(0) %}
        {% set target = states('input_number.ev_target_soc') | float(80) %}
        {% set h = state_attr('input_datetime.ev_ready_by', 'hour') | int(7) %}
        {% set m = state_attr('input_datetime.ev_ready_by', 'minute') | int(0) %}
        {% set dl0 = today_at('%02d:%02d' | format(h, m)) %}
        {% set deadline = dl0 if dl0 > now() else dl0 + timedelta(days=1) %}
        {% set this_hour = now().replace(minute=0, second=0, microsecond=0) %}
        {% set need_kwh = (target - soc) / 100 * battery_kwh %}
        {% set hours_needed = (need_kwh / assumed_charge_kw) | round(0, 'ceil') | int %}
        {% set entries = (prices_today.get(area, []) + prices_tomorrow.get(area, [])) %}
        {% set ns = namespace(win=[]) %}
        {% for e in entries %}
          {% set st = e.start | as_datetime | as_local %}
          {% if st >= this_hour and st < deadline %}
            {% set ns.win = ns.win + [{'start': st, 'price': e.price}] %}
          {% endif %}
        {% endfor %}
        {% set chosen = (ns.win | sort(attribute='price'))[:hours_needed] %}
        {{ hours_needed > 0
           and chosen | selectattr('start', 'eq', this_hour) | list | count > 0 }}
  - if:
    - condition: template
      value_template: "{{ allow_grid }}"
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.charger_allow_grid_charging
    else:
    - action: switch.turn_off
      target:
        entity_id: switch.charger_allow_grid_charging
  mode: single

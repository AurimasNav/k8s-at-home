- id: ev_charger_plugged_in
  alias: EV charger - notify when car plugged in
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
    to: Standby (plugged)
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: EV charger
      message: >-
        Car plugged in. Mode: {{ states('sensor.charger_mode') }}.
  mode: single

- id: ev_charger_charging_started
  alias: EV charger - notify when charging starts
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
    to: Charging
  actions:
  # Let the draw settle so the estimate is meaningful rather than mid-ramp.
  - delay:
      seconds: 90
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: EV charger
      message: >-
        Charging started, drawing {{ states('sensor.charger_active_power')
        | float(0) | round(0) }} W. Mode: {{ states('sensor.charger_mode') }}.
  mode: single

- id: ev_charger_charging_complete
  alias: EV charger - notify when charging completes
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
    to: Charging completed
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: EV charger
      message: >-
        Charging completed{% if states('sensor.byd_atto_2_battery_level') | is_number %},
        battery at {{ states('sensor.byd_atto_2_battery_level') | round(0) }}%
        ({{ states('sensor.byd_atto_2_range') }} km){% endif %}.
        {{ states('sensor.ev_charging_energy_today') | float(0) | round(1) }} kWh
        charged today.
  mode: single

- id: ev_charger_fault
  alias: EV charger - notify on fault or suspension
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
    to:
    - Faulted
    - Unavailable
    - Charging is suspended (Charge side)
    - Charging suspended (EV side)
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: EV charger problem
      message: >-
        Charger state: {{ states('sensor.charger_status') }}.
  mode: single

# BYD cloud polling is a fixed timer with no sleep/parked back-off (checked in
# coordinator.py), and both intervals default to 300s - ~288 wake-ups a day
# versus a handful from opening the app. Each poll wakes the car and draws its
# 12V battery, so idle polling is pushed right down and only telemetry is sped
# up while the charger reports Charging. Polling then is close to free: the car
# is awake and on shore power anyway.
#
# GPS stays slow even while charging - the car is parked, so location cannot
# change. Raise it in the UI if live tracking while driving is ever wanted.
#
# Entity IDs are discovered via integration_entities() because they carry the
# vehicle name, which is not known until the integration is configured. Before
# that this automation finds nothing and does nothing.
#
# Reconciles on a timer as well as on charger-status changes: a missed edge
# would otherwise leave the car being polled every 5 minutes indefinitely,
# which is exactly the failure this exists to prevent. Every 10 min rather than
# 30 so a freshly-added integration (which starts at upstream's 300s default)
# is pulled down promptly; the action is a no-op when the value already matches.
- id: byd_adaptive_poll_interval
  alias: BYD - fast telemetry poll only while charging
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
  - trigger: time_pattern
    minutes: /10
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      idle_seconds: 14400        # 4 h; max the integration allows is 28800 (8 h)
      charging_seconds: 300
      telemetry: >-
        {{ integration_entities('byd_vehicle')
           | select('search', 'telemetry_poll_interval') | list }}
      gps: >-
        {{ integration_entities('byd_vehicle')
           | select('search', 'gps_poll_interval') | list }}
      wanted_telemetry: >-
        {{ charging_seconds if states('sensor.charger_status') == 'Charging'
           else idle_seconds }}
  - repeat:
      for_each: "{{ telemetry }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ states(repeat.item) | int(0) != wanted_telemetry | int }}"
        then:
        - action: number.set_value
          target:
            entity_id: "{{ repeat.item }}"
          data:
            value: "{{ wanted_telemetry | int }}"
  - repeat:
      for_each: "{{ gps }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ states(repeat.item) | int(0) != idle_seconds | int }}"
        then:
        - action: number.set_value
          target:
            entity_id: "{{ repeat.item }}"
          data:
            value: "{{ idle_seconds | int }}"
  mode: single

# Plugged in and then nothing happens is the classic EV failure - you walk away
# assuming it is charging. Triggered from the charger (5s polling, authoritative
# on plug state) rather than the car, whose plug sensor only refreshes every 4h
# while idle and would report this hours late.
#
# 20 minutes of grace so a scheduled or solar-waiting start is not flagged.
- id: ev_charger_plugged_but_idle
  alias: EV charger - plugged in but not charging
  triggers:
  - trigger: state
    entity_id: sensor.charger_status
    to: Standby (plugged)
    for:
      minutes: 20
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.xiaomi
    data:
      title: EV charger
      message: >-
        Car has been plugged in for 20 min without charging. Mode:
        {{ states('sensor.charger_mode') }}.
  mode: single

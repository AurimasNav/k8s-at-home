# The manual max-light hold (Aqara button 7) lives in
# packages/entrance_hall.yaml, because it ships an input_boolean. Both
# automations below stand down while that hold is on, so a deliberate button
# press is never undone by presence.
- id: '1785649890735'
  alias: Entrance hall - light on presence when dark
  triggers:
  - entity_id: binary_sensor.entrance_hall_presence_still_target
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.entrance_hall_manual_light
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.entrance_hall_presence_ambient_light
    below: 50
  actions:
  - choose:
    - conditions:
      - condition: time
        after: '22:00:00'
        before: '06:00:00'
      sequence:
      - target:
          area_id:
          - entrance_hall
        action: light.turn_on
        data:
          rgb_color: [255, 0, 0]
          brightness_pct: 10
    - conditions:
      - condition: time
        after: '21:00:00'
        before: '22:00:00'
      sequence:
      - target:
          area_id:
          - entrance_hall
        action: light.turn_on
        data:
          rgb_color: [255, 255, 0]
          brightness_pct: 100
    default:
    - target:
        area_id:
        - entrance_hall
      action: light.turn_on
      data:
        color_temp_kelvin: 6500
        brightness_pct: 100
  mode: single
- id: '1785649924624'
  alias: Entrance hall - lights off when clear
  triggers:
  - entity_id: binary_sensor.entrance_hall_presence_still_target
    to: 'off'
    for:
      seconds: 2
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.entrance_hall_manual_light
    state: 'off'
  actions:
  - target:
      area_id:
      - entrance_hall
    action: light.turn_off
  mode: single

- id: entrance_hall_presence_engineering_mode_on
  alias: Entrance hall - re-enable presence radar engineering mode
  triggers:
  - trigger: state
    entity_id: switch.entrance_hall_entrance_hall_presence_engineering_mode
    to: 'off'
    for:
      seconds: 10
  - trigger: time_pattern
    minutes: '/5'
  conditions:
  - condition: state
    entity_id: switch.entrance_hall_entrance_hall_presence_engineering_mode
    state: 'off'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.entrance_hall_entrance_hall_presence_engineering_mode
  mode: single

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./httproute.yaml
- ./ghcr-pull.externalsecret.yaml
namespace: home-assistant

# Vendored mkaiser Sungrow package (full sensor set) shipped as a ConfigMap and
# mounted at /config/packages (see values.yaml additionalVolumes / additionalMounts).
#
# Flexit and lighting automations are vendored the same way, but each kept in
# its own included file (automations_flexit.yaml / automations_lights.yaml,
# merged in via the "automation flexit:" / "automation lights:" keys) rather
# than folded into automations.yaml, so the UI-managed automations.yaml stays
# writable and untouched (see values.yaml comment).
configMapGenerator:
# also carries the iHomeManager package — both mount into /config/packages
- name: ha-sungrow-package
  files:
  - packages/modbus_sungrow.yaml
  - packages/modbus_ihomemanager.yaml
- name: ha-flexit-automations
  files:
  - automations/flexit.yaml
- name: ha-light-automations
  files:
  - automations/lights.yaml
- name: ha-hikvision-automations
  files:
  - automations/hikvision.yaml
- name: ha-ev-charger-automations
  files:
  - automations/ev-charger.yaml
- name: ha-backup-power-automations
  files:
  - automations/backup-power.yaml
- name: ha-mower-automations
  files:
  - automations/mower.yaml
# package, not an automations file: ships integration/utility_meter helpers
- name: ha-ev-charger-package
  files:
  - packages/ev_charger.yaml
# package, not an automations file: ships the manual-light input_boolean
- name: ha-entrance-hall-package
  files:
  - packages/entrance_hall.yaml
# package, not an automations file: ships a utility_meter helper too
- name: ha-nibe-package
  files:
  - packages/nibe.yaml
# package, not an automations file: ships the off-grid template binary_sensor
- name: ha-backup-power-package
  files:
  - packages/backup_power.yaml
# package, not an automations file: ships the winterized input_boolean and the
# notification script alongside the B-hyve winterization reminders
- name: ha-bhyve-winterize-package
  files:
  - packages/bhyve_winterize.yaml
# package: Pribus water softener salt reminder (input_datetime/input_button helpers)
- name: ha-water-softener-package
  files:
  - packages/water_softener.yaml
# package: LG OLED turn-on via Wake-on-LAN (webostv.turn_on trigger)
- name: ha-lg-tv-package
  files:
  - packages/lg_tv.yaml
# package: Bambu Lab P2S alerts and fume ventilation (input_boolean helper)
- name: ha-printer-package
  files:
  - packages/printer.yaml
# package: Ignitis/ESO electricity price sensors for Energy dashboard costs
- name: ha-energy-price-package
  files:
  - packages/energy_price.yaml
- name: ha-energy-dashboard
  files:
  - dashboards/energy.yaml
- name: ha-garden-dashboard
  files:
  - dashboards/garden.yaml
- name: ha-printer-dashboard
  files:
  - dashboards/printer.yaml
generatorOptions:
  disableNameSuffixHash: true

helmCharts:
- name: home-assistant
  version: 0.3.91
  repo: http://pajikos.github.io/home-assistant-helm-chart/
  releaseName: home-assistant
  includeCRDs: true
  namespace: home-assistant
  valuesFile: values.yaml

patches:
  # subPath mounts never see ConfigMap updates, so HA must be restarted on change
  - target:
      kind: StatefulSet
      name: home-assistant
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: home-assistant
        annotations:
          reloader.stakater.com/auto: "true"
  - target:
      kind: Service
      name: home-assistant
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: udp-9999
          port: 9999
          targetPort: 9999
          protocol: UDP

# Home Assistant image (values.yaml image:); kustomize sets the tag and digest on the
# rendered chart. Built by AurimasNav/home-assistant-image: <HA version>.<build number>.
images:
- name: ghcr.io/aurimasnav/home-assistant-image
  newTag: 2026.11.1.2
  digest: sha256:6191107a1834753e44fa565e154fac10f88ac62c383dec37e91dc0ae48187a41

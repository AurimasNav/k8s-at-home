apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources: []
namespace: home-assistant

# Vendored mkaiser Sungrow package (full sensor set) shipped as a ConfigMap and
# mounted at /config/packages (see values.yaml additionalVolumes / additionalMounts).
#
# Flexit and lighting automations are vendored the same way, but each kept in
# its own included file (automations_flexit.yaml / automations_lights.yaml,
# merged in via the "automation flexit:" / "automation lights:" keys) rather
# than folded into automations.yaml, so the UI-managed automations.yaml stays
# writable and untouched (see values.yaml comment).
configMapGenerator:
# also carries the iHomeManager package — both mount into /config/packages
- name: ha-sungrow-package
  files:
  - packages/modbus_sungrow.yaml
  - packages/modbus_ihomemanager.yaml
- name: ha-flexit-automations
  files:
  - automations/flexit.yaml
- name: ha-light-automations
  files:
  - automations/lights.yaml
- name: ha-hikvision-automations
  files:
  - automations/hikvision.yaml
- name: ha-ev-charger-automations
  files:
  - automations/ev-charger.yaml
- name: ha-backup-power-automations
  files:
  - automations/backup-power.yaml
# package, not an automations file: ships integration/utility_meter helpers
- name: ha-ev-charger-package
  files:
  - packages/ev_charger.yaml
# package, not an automations file: ships the manual-light input_boolean
- name: ha-entrance-hall-package
  files:
  - packages/entrance_hall.yaml
# package, not an automations file: ships a utility_meter helper too
- name: ha-nibe-package
  files:
  - packages/nibe.yaml
# package, not an automations file: ships the off-grid template binary_sensor
- name: ha-backup-power-package
  files:
  - packages/backup_power.yaml
- name: ha-energy-dashboard
  files:
  - dashboards/energy.yaml
- name: ha-garden-dashboard
  files:
  - dashboards/garden.yaml
# Vendored maciej-or/hikvision_next (HACS "Hikvision NVR / IP Camera"), split
# into 3 ConfigMaps matching its directory layout — mounted at
# /config/custom_components/hikvision_next (see values.yaml) so it's installed
# without needing HACS itself. Renovate tracks the source tag:
# https://github.com/maciej-or/hikvision_next/archive/refs/tags/v1.1.1.tar.gz
- name: ha-hikvision-next

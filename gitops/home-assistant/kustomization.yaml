apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./httproute.yaml
namespace: home-assistant

# Vendored mkaiser Sungrow package (full sensor set) shipped as a ConfigMap and
# mounted at /config/packages (see values.yaml additionalVolumes / additionalMounts).
#
# Flexit and lighting automations are vendored the same way, but each kept in
# its own included file (automations_flexit.yaml / automations_lights.yaml,
# merged in via the "automation flexit:" / "automation lights:" keys) rather
# than folded into automations.yaml, so the UI-managed automations.yaml stays
# writable and untouched (see values.yaml comment).
configMapGenerator:
# also carries the iHomeManager package — both mount into /config/packages
- name: ha-sungrow-package
  files:
  - packages/modbus_sungrow.yaml
  - packages/modbus_ihomemanager.yaml
- name: ha-flexit-automations
  files:
  - automations/flexit.yaml
- name: ha-light-automations
  files:
  - automations/lights.yaml
- name: ha-hikvision-automations
  files:
  - automations/hikvision.yaml
- name: ha-ev-charger-automations
  files:
  - automations/ev-charger.yaml
- name: ha-backup-power-automations
  files:
  - automations/backup-power.yaml
- name: ha-mower-automations
  files:
  - automations/mower.yaml
# package, not an automations file: ships integration/utility_meter helpers
- name: ha-ev-charger-package
  files:
  - packages/ev_charger.yaml
# package, not an automations file: ships the manual-light input_boolean
- name: ha-entrance-hall-package
  files:
  - packages/entrance_hall.yaml
# package, not an automations file: ships a utility_meter helper too
- name: ha-nibe-package
  files:
  - packages/nibe.yaml
# package, not an automations file: ships the off-grid template binary_sensor
- name: ha-backup-power-package
  files:
  - packages/backup_power.yaml
# package, not an automations file: ships the winterized input_boolean and the
# notification script alongside the B-hyve winterization reminders
- name: ha-bhyve-winterize-package
  files:
  - packages/bhyve_winterize.yaml
# package: Pribus water softener salt reminder (input_datetime/input_button helpers)
- name: ha-water-softener-package
  files:
  - packages/water_softener.yaml
# package: LG OLED turn-on via Wake-on-LAN (webostv.turn_on trigger)
- name: ha-lg-tv-package
  files:
  - packages/lg_tv.yaml
# package: Bambu Lab P2S alerts and fume ventilation (input_boolean helper)
- name: ha-printer-package
  files:
  - packages/printer.yaml
- name: ha-energy-dashboard
  files:
  - dashboards/energy.yaml
- name: ha-garden-dashboard
  files:
  - dashboards/garden.yaml
- name: ha-printer-dashboard
  files:
  - dashboards/printer.yaml
# Vendored yannik2480/hikvision_bridge (Apache-2.0) for the DS-7604NXI-K1 NVR. It replaced
# hikvision_next (unlicensed, unmaintained) on 2026-11-07 (#1029).
# Nothing is configured automatically: the integration is added in the HA UI.
# One ConfigMap per upstream directory (ConfigMaps can't nest), mounted at
# /config/custom_components/hikvision_bridge (see values.yaml).
# Left out: the 29 non-English translations (1.33 MB; there is no lt.json and this
# house runs HA in English), same choice as bhyve/byd_vehicle. brand/ IS vendored:
# home-assistant/brands has no custom_integrations/hikvision_bridge, so these PNGs are
# the only icon source (HA serves a custom integration's brand/ folder first).
# Sizes: brand/ (667 KB of PNGs, binaryData) and frontend/ (459 KB, hls.light.min.js)
# each fit a ConfigMap's 1 MiB limit on their own.
# ServerSideApply on brand/ and frontend/: as client-side apply their
# kubectl.kubernetes.io/last-applied-configuration annotation (915 KB / 467 KB) is over
# the apiserver's 256 KiB annotation limit and the sync fails; the other 7 stay under it.
# ConfigMap keys can't contain '@', so brand/'s icon@2x.png and logo@2x.png are stored
# as icon-2x.png / logo-2x.png and renamed back by the volume's items (values.yaml).
# Renovate tracks the source tag:
# https://github.com/yannik2480/hikvision_bridge/archive/refs/tags/v0.9.17.tar.gz
- name: ha-hikvision-bridge
  # Server-side apply although it fits client-side today (~200 KB of the 256 KiB
  # last-applied limit): upstream grew ~27 KB in the 11 days to v0.9.12, and a
  # re-vendor that crosses the limit would pass CI and then fail the Argo sync.
  options:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true
  files:
  - custom_components/hikvision_bridge/__init__.py
  - custom_components/hikvision_bridge/alarm_control_panel.py
  - custom_components/hikvision_bridge/binary_sensor.py
  - custom_components/hikvision_bridge/button.py
  - custom_components/hikvision_bridge/camera.py
  - custom_components/hikvision_bridge/cloud_entry.py
  - custom_components/hikvision_bridge/config_flow.py
  - custom_components/hikvision_bridge/const.py
  - custom_components/hikvision_bridge/diagnostics.py
  - custom_components/hikvision_bridge/entity.py
  - custom_components/hikvision_bridge/event.py
  - custom_components/hikvision_bridge/icons.json
  - custom_components/hikvision_bridge/image.py
  - custom_components/hikvision_bridge/manifest.json
  - custom_components/hikvision_bridge/media_source.py
  - custom_components/hikvision_bridge/number.py
  - custom_components/hikvision_bridge/panel.py
  - custom_components/hikvision_bridge/repairs.py
  - custom_components/hikvision_bridge/select.py
  - custom_components/hikvision_bridge/sensor.py
  - custom_components/hikvision_bridge/services.py
  - custom_components/hikvision_bridge/services.yaml
  - custom_components/hikvision_bridge/switch.py
  - custom_components/hikvision_bridge/views.py
  - custom_components/hikvision_bridge/websocket.py
- name: ha-hikvision-bridge-brand
  options:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true
  files:
  - custom_components/hikvision_bridge/brand/icon.png
  - icon-2x.png=custom_components/hikvision_bridge/brand/icon@2x.png
  - custom_components/hikvision_bridge/brand/logo.png
  - logo-2x.png=custom_components/hikvision_bridge/brand/logo@2x.png
- name: ha-hikvision-bridge-cloud

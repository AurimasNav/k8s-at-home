# Vendored algirdasc/hass-eso — imports metered consumption/export statistics from
# the DSO (ESO or Ignitis "Energy Smart"), plus the kaupimas storage-bank balance.
# Previous-day data only, one import per day, so it is for reconciliation and
# billing insight - not usable for automations.
#
# Pinned to commit 5969af1678 (main as of 2026-10-20): this project publishes NO
# tags or releases, so unlike every other vendored component here it cannot be
# pinned to a version. The manifest says 1.3.0 but no such tag exists. Upstream
# also warns it is still in testing and may break. Re-pin by picking a newer SHA:
# https://github.com/algirdasc/hass-eso/archive/5969af16786d9af87b68dd9c79f2cfb22730c851.tar.gz
# Upstream's brand/ folder (4 PNGs) is not vendored: the same images, byte for
# byte, are served for this domain from home-assistant/brands
# (custom_integrations/eso), so the UI icon is unchanged without them.
- name: ha-eso
  files:
  - custom_components/eso/__init__.py
  - custom_components/eso/config_flow.py
  - custom_components/eso/const.py
  - custom_components/eso/eso_client.py
  - custom_components/eso/form_parser.py
  - custom_components/eso/ignitis_client.py
  - custom_components/eso/manifest.json
  - custom_components/eso/objects_parser.py
  - custom_components/eso/repairs.py
  - custom_components/eso/sensor.py
  - custom_components/eso/services.yaml
  - custom_components/eso/strings.json
- name: ha-eso-translations
  files:
  - custom_components/eso/translations/en.json
# Installs release-zip custom components (bambu_lab, petkit) in init containers; see values.yaml initContainers
- name: ha-custom-component-installer
  files:
  - scripts/install_release_component.py
generatorOptions:
  disableNameSuffixHash: true

helmCharts:
- name: home-assistant
  version: 0.3.90
  repo: http://pajikos.github.io/home-assistant-helm-chart/
  releaseName: home-assistant
  includeCRDs: true
  namespace: home-assistant
  valuesFile: values.yaml

patches:
  # subPath mounts never see ConfigMap updates, so HA must be restarted on change
  - target:
      kind: StatefulSet
      name: home-assistant
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: home-assistant
        annotations:
          reloader.stakater.com/auto: "true"
  - target:
      kind: Service
      name: home-assistant
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: udp-9999
          port: 9999
          targetPort: 9999
          protocol: UDP

# init-container image (values.yaml initContainers); kustomize sets the tag on the rendered chart
images:
- name: python
  newTag: 3.15.2-alpine3.24

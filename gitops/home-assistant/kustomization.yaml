apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources: []
namespace: home-assistant

# Vendored mkaiser Sungrow package (full sensor set) shipped as a ConfigMap and
# mounted at /config/packages (see values.yaml additionalVolumes / additionalMounts).
#
# Flexit and lighting automations are vendored the same way, but each kept in
# its own included file (automations_flexit.yaml / automations_lights.yaml,
# merged in via the "automation flexit:" / "automation lights:" keys) rather
# than folded into automations.yaml, so the UI-managed automations.yaml stays
# writable and untouched (see values.yaml comment).
configMapGenerator:
- name: ha-sungrow-package
  files:
  - packages/modbus_sungrow.yaml
- name: ha-flexit-automations
  files:
  - automations/flexit.yaml
- name: ha-light-automations
  files:
  - automations/lights.yaml
- name: ha-hikvision-automations
  files:
  - automations/hikvision.yaml
# package, not an automations file: ships a utility_meter helper too
- name: ha-nibe-package
  files:
  - packages/nibe.yaml
- name: ha-energy-dashboard
  files:
  - dashboards/energy.yaml
# Vendored maciej-or/hikvision_next v1.1.1 (HACS "Hikvision NVR / IP Camera"), split
# into 3 ConfigMaps matching its directory layout — mounted at
# /config/custom_components/hikvision_next (see values.yaml) so it's installed
# without needing HACS itself.
- name: ha-hikvision-next
  files:
  - custom_components/hikvision_next/__init__.py
  - custom_components/hikvision_next/binary_sensor.py
  - custom_components/hikvision_next/camera.py
  - custom_components/hikvision_next/config_flow.py
  - custom_components/hikvision_next/const.py
  - custom_components/hikvision_next/coordinator.py
  - custom_components/hikvision_next/diagnostics.py
  - custom_components/hikvision_next/hikvision_device.py
  - custom_components/hikvision_next/image.py
  - custom_components/hikvision_next/manifest.json
  - custom_components/hikvision_next/notifications.py
  - custom_components/hikvision_next/sensor.py
  - custom_components/hikvision_next/services.py
  - custom_components/hikvision_next/services.yaml
  - custom_components/hikvision_next/strings.json
  - custom_components/hikvision_next/switch.py
- name: ha-hikvision-next-isapi
  files:
  - custom_components/hikvision_next/isapi/__init__.py
  - custom_components/hikvision_next/isapi/const.py
  - custom_components/hikvision_next/isapi/isapi.py
  - custom_components/hikvision_next/isapi/models.py
  - custom_components/hikvision_next/isapi/utils.py
- name: ha-hikvision-next-translations
  files:
  - custom_components/hikvision_next/translations/en.json
  - custom_components/hikvision_next/translations/fr.json
  - custom_components/hikvision_next/translations/it.json
  - custom_components/hikvision_next/translations/pl.json
  - custom_components/hikvision_next/translations/pt-BR.json
  - custom_components/hikvision_next/translations/pt.json
  - custom_components/hikvision_next/translations/ru.json
# Vendored sebr/bhyve-home-assistant v4.1.2 (Orbit B-hyve), same 3-ConfigMap pattern
- name: ha-bhyve
  files:
  - custom_components/bhyve/__init__.py
  - custom_components/bhyve/binary_sensor.py
  - custom_components/bhyve/config_flow.py
  - custom_components/bhyve/const.py
  - custom_components/bhyve/coordinator.py
  - custom_components/bhyve/diagnostics.py
  - custom_components/bhyve/manifest.json
  - custom_components/bhyve/select.py
  - custom_components/bhyve/sensor.py
  - custom_components/bhyve/services.yaml
  - custom_components/bhyve/strings.json
  - custom_components/bhyve/switch.py
  - custom_components/bhyve/util.py
  - custom_components/bhyve/valve.py
- name: ha-bhyve-pybhyve
  files:
  - custom_components/bhyve/pybhyve/__init__.py
  - custom_components/bhyve/pybhyve/client.py
  - custom_components/bhyve/pybhyve/const.py
  - custom_components/bhyve/pybhyve/devices.json
  - custom_components/bhyve/pybhyve/errors.py
  - custom_components/bhyve/pybhyve/typings.py
  - custom_components/bhyve/pybhyve/websocket.py
- name: ha-bhyve-translations
  files:
  - custom_components/bhyve/translations/en.json
generatorOptions:
  disableNameSuffixHash: true

helmCharts:
- name: home-assistant
  version: 0.3.70
  repo: http://pajikos.github.io/home-assistant-helm-chart/
  releaseName: home-assistant
  includeCRDs: true
  namespace: home-assistant
  valuesFile: values.yaml

patches:
  # subPath mounts never see ConfigMap updates, so HA must be restarted on change
  - target:
      kind: StatefulSet
      name: home-assistant
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: home-assistant
        annotations:
          reloader.stakater.com/auto: "true"
  - target:
      kind: Service
      name: home-assistant
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: udp-9999
          port: 9999
          targetPort: 9999
          protocol: UDP
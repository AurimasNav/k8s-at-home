add_center_links:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hikvision_bridge
    dry_run:
      default: true
      selector:
        boolean:
    kinds:
      selector:
        select:
          multiple: true
          options:
            - motion
            - intrusion
            - line_crossing
            - region_entrance
            - region_exiting
            - tamper
            - scene_change

isapi_request:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hikvision_bridge
    method:
      default: GET
      selector:
        select:
          options:
            - GET
            - PUT
            - POST
            - DELETE
    path:
      required: true
      example: /ISAPI/System/deviceInfo
      selector:
        text:
    body:
      selector:
        text:
          multiline: true
    confirm_write:
      default: false
      selector:
        boolean:

ptz_move:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hikvision_bridge
    pan:
      default: 0
      selector:
        number:
          min: -100
          max: 100
    tilt:
      default: 0
      selector:
        number:
          min: -100
          max: 100
    zoom:
      default: 0
      selector:
        number:
          min: -100
          max: 100
    duration:
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          unit_of_measurement: s

ptz_preset:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hikvision_bridge
    preset:
      required: true
      selector:
        number:
          min: 1
          max: 300
          mode: box

set_notification_host:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hikvision_bridge
    slot:
      default: 1
      selector:
        number:
          min: 1
          max: 8
          mode: box
    confirm_write:
      required: true
      default: false
      selector:
        boolean:

search_recordings:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hikvision_bridge
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    source:
      default: auto
      selector:
        select:
          translation_key: recording_source
          options:
            - auto
            - recorder
            - card

download_recording:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hikvision_bridge
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    source:
      default: auto
      selector:
        select:
          translation_key: recording_source
          options:
            - auto
            - recorder
            - card
    format:
      default: mp4
      selector:
        select:
          translation_key: recording_format
          options:
            - mp4
            - h264
            - ts
            - original
    trim:
      default: true
      selector:
        boolean:

cloud_create_area:
  fields:
    device_id:
      selector:
        device:
          integration: hikvision_bridge
    device_serial:
      selector:
        text:
    group_name:
      required: true
      example: Entrance
      selector:
        text:
    resource_ids:
      required: true
      selector:
        object:

cloud_update_area:
  fields:
    device_id:
      selector:
        device:
          integration: hikvision_bridge
    device_serial:
      selector:
        text:
    group_id:
      required: true
      selector:
        number:
          mode: box
    group_name:
      required: true
      example: Entrance
      selector:
        text:
    resource_ids:
      required: true
      selector:
        object:

cloud_delete_area:
  fields:
    device_id:
      selector:
        device:
          integration: hikvision_bridge
    device_serial:
      selector:
        text:
    group_id:
      required: true
      selector:
        number:
          mode: box

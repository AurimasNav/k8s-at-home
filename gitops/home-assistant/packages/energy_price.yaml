# Ignitis "Išmanus - 15" + ESO "Namai", net metering; EUR incl. VAT, matches the Sept 2026 bill

# the Ignitis path of the eso integration only reports the balance as a statistic
input_number:
  net_metering_balance:
    name: Net-metering balance
    unit_of_measurement: kWh
    min: 0
    max: 100000
    step: 0.001
    mode: box
    icon: mdi:bank

template:
  - sensor:
      # Nord Pool LT is quoted without VAT; 0.12514 covers supplier margin, ESO distribution and VIAP
      - name: Electricity plan price
        unique_id: electricity_plan_price
        unit_of_measurement: EUR/kWh
        state_class: measurement
        icon: mdi:cash
        availability: "{{ has_value('sensor.nord_pool_lt_current_price') }}"
        state: "{{ (states('sensor.nord_pool_lt_current_price') | float * 1.21 + 0.12514) | round(5) }}"
      # what a grid kWh costs now: the ESO take-back fee while the stored balance lasts
      - name: Electricity import price
        unique_id: electricity_import_price
        unit_of_measurement: EUR/kWh
        state_class: measurement
        icon: mdi:cash-check
        availability: >-
          {{ states('input_number.net_metering_balance') | float(0) > 0
             or has_value('sensor.electricity_plan_price') }}
        state: >-
          {{ 0.0726 if states('input_number.net_metering_balance') | float(0) > 0
             else states('sensor.electricity_plan_price') | float }}

automation:
- id: net_metering_balance_sync
  alias: Energy - copy the net-metering balance from ESO
  triggers:
  # the eso integration imports at 10:30 and retries for a while
  - trigger: time
    at:
    - "11:00:00"
    - "15:00:00"
  - trigger: homeassistant
    event: start
  actions:
  - action: recorder.get_statistics
    data:
      statistic_ids:
      - eso:energy_export_balance_153500
      start_time: "{{ (now() - timedelta(days=30)).isoformat() }}"
      period: hour
      types:
      - state
    response_variable: stats
  - variables:
      rows: "{{ stats.statistics.get('eso:energy_export_balance_153500', []) }}"
  - condition: template
    value_template: "{{ rows | count > 0 and rows[-1].state is number }}"
  - action: input_number.set_value
    target:
      entity_id: input_number.net_metering_balance
    data:
      value: "{{ rows[-1].state }}"
  mode: single

# Battery strategy follows the net-metering bank. While the bank holds energy a
# grid kWh costs only the 0.0726 EUR take-back fee, so charging the battery from
# the grid gains nothing and loses ~5 % to conversion: the iHomeManager's AI mode
# should run "Maximize PV energy usage". Once the bank is empty grid kWh cost the
# full plan price and "Maximize revenue" (buy cheap at night, use at the evening
# peak) pays. HA can't switch the strategy itself (it is an iSolarCloud setting,
# not exposed over Modbus), so these only tell Aurimas when to switch.
# Hysteresis: empty below 1 kWh, refilled above 50 kWh, so one sunny winter day
# doesn't flip the advice back and forth.
- id: energy_bank_empty_switch_to_revenue
  alias: Energy - net-metering bank empty, switch battery to Maximize revenue
  triggers:
  - trigger: numeric_state
    entity_id: input_number.net_metering_balance
    below: 1
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.xiaomi
    data:
      title: 🏦 Net-metering bank is empty
      message: >-
        Grid power now costs the full plan price
        ({{ states('sensor.electricity_plan_price') }} EUR/kWh right now).
        In iSolarCloud switch AI mode to "Maximize revenue" so the battery
        charges on cheap night hours.
  mode: single

- id: energy_bank_refilled_switch_to_pv
  alias: Energy - net-metering bank refilled, switch battery to Maximize PV
  triggers:
  - trigger: numeric_state
    entity_id: input_number.net_metering_balance
    above: 50
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.xiaomi
    data:
      title: 🏦 Net-metering bank is filling again
      message: >-
        The bank holds {{ states('input_number.net_metering_balance') | float(0) | round(0) }} kWh,
        so grid power costs only the 0.0726 EUR/kWh take-back fee. In iSolarCloud
        switch AI mode back to "Maximize PV energy usage".
  mode: single

# Grid charging = the battery takes more than PV gives while the house imports.
# Backtested on 10 days of history (11-04..11-14) with these thresholds: fired
# on exactly the three real grid charges (11-05 12:28, 11-08 09:53, 11-13 06:46)
# and nothing else.
- id: energy_battery_grid_charging_while_bank
  alias: Energy - alert when the battery charges from the grid while the bank has energy
  triggers:
  - trigger: template
    value_template: >-
      {{ states('sensor.battery_charging_power') | float(0)
         - states('sensor.total_dc_power') | float(0) > 500
         and states('sensor.import_power') | float(0) > 500 }}
    for:
      minutes: 5
  conditions:
  - condition: numeric_state
    entity_id: input_number.net_metering_balance
    above: 1
  # at most one alert per 6 h, so a long forced charge doesn't spam
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
         or now() - this.attributes.last_triggered > timedelta(hours=6) }}
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.xiaomi
    data:
      title: 🔋 Battery is charging from the grid
      message: >-
        Battery {{ states('sensor.battery_charging_power') }} W at
        {{ states('sensor.battery_level') }}%, grid import
        {{ states('sensor.import_power') }} W, PV {{ states('sensor.total_dc_power') }} W{%
        if states('sensor.charger_active_power') | float(0) > 0 %}, EV
        {{ states('sensor.charger_active_power') }} W{% endif %}. The bank still holds
        {{ states('input_number.net_metering_balance') | float(0) | round(0) }} kWh, so this
        gains nothing. Check that iSolarCloud AI mode is on "Maximize PV energy usage".
  mode: single

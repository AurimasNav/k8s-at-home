# EV charging energy, from the charger's real power measurement.
#
# sensor.charger_active_power (iHM unit 247 reg 8593, see
# packages/modbus_ihomemanager.yaml) is a genuine measurement of what the
# wallbox is delivering - found and validated 2026-08-14. This package only
# integrates it into energy totals; there is no estimation left here.
#
# The previous load-minus-baseline estimate, its rolling-baseline sensor and the
# heat-pump compensation were all deleted rather than kept as a fallback: they
# existed solely because no real measurement was available, and keeping a second
# number that disagrees with the meter is worse than having one.

# Settings for deadline charging. These are genuine user inputs - things you
# decide - unlike the derived baseline helper removed earlier, which represented
# a computed value that had no business being adjustable.
input_number:
  ev_target_soc:
    # Gates GRID charging only - surplus charging is never capped by it.
    name: EV grid-charge target
    min: 30
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-charging-80

input_datetime:
  ev_ready_by:
    name: EV ready by
    has_date: false
    has_time: true

input_boolean:
  ev_deadline_charging:
    name: EV deadline charging
    icon: mdi:calendar-clock


sensor:
  - platform: integration
    source: sensor.charger_active_power
    name: EV charging energy
    unique_id: ev_charging_energy
    unit_prefix: k
    unit_time: h
    method: left
    max_sub_interval:
      minutes: 1

utility_meter:
  ev_charging_energy_daily:
    name: EV charging energy today
    source: sensor.ev_charging_energy
    cycle: daily

# Cilium gateway route for Home Assistant (HA has its own login). WebSockets are on for every
# gateway route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
  # https-tunnel = Cloudflare Tunnel; https-wildcard (home IP) is dropped once the tunnel is verified.
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel
  - name: main
    namespace: cilium-gateway
    sectionName: https-wildcard
  hostnames:
  - ha.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Envoy's default is 15 s for the whole response; 0s turns that off (long downloads,
    # interactive searches, streams). Idle connections still close after 300 s.
    timeouts:
      request: 0s
    backendRefs:
    - name: home-assistant
      port: 8123

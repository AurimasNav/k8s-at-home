  - type: markdown
    title: What each setting does
    content: |
      **Offset** (menu 1.1, −10…+10) moves the whole curve up or down: about
      1.3 °C of supply per step on this pump, the same in mild weather and in
      frost.

      **Curve** (menu 1.9.1, 0…15, factory 9) sets how fast the supply rises as
      it gets colder. The curves fan out from about 20 °C of supply at +20 °C
      outdoors, so a step changes little in mild weather and a lot in frost.
      *Curve +1, offset −1* keeps mild days close to where they are and adds
      heat only as it gets colder.

      **Point offset** (menu 1.9.8) bends the curve only within ±5 °C of one
      outdoor temperature, for a house that is cold or warm in one band of
      weather only.

      **Min / max supply** (menus 1.9.3 / 5.1.2) clip the curve. Underfloor
      heating normally keeps the maximum at 35–45 °C.

      **Stop heating** (menu 4.9.2) switches space heating off above an outdoor
      average, taken over the *outdoor averaging time*. The curve itself follows
      the current outdoor temperature, lightly smoothed, not that average.

      **Room sensor factor** (menu 1.9.4) only matters once a room sensor is
      connected. Until then the pump knows nothing about the rooms.

      **Rooms** are measured by the AC units: whole degrees, mounted near the
      ceiling, and they barely update while the AC is off. Read the trend, not
      the last degree.

      **Electricity and cost** are estimates. The F1245 doesn't meter itself,
      so the kWh come from a model: 1970 W while the compressor runs, plus the
      immersion heater and the pumps (see the Heat pump view). *Paid* prices
      each kWh at what a grid kWh cost at that moment: the 0.0726 EUR take-back
      fee while the net-metering bank holds energy, the full plan price once it
      is empty. *At plan price* uses Nord Pool plus fees throughout: what the
      same heat costs once the bank runs out. The cost history starts when
      these sensors were added (late November 2026); the kWh go back to
      August.

      Change one thing at a time and give it two or three days: the floor slab
      takes about a day to settle.

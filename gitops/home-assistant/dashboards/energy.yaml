# YAML dashboard (values.yaml -> lovelace.dashboards); the built-in Energy one can't show SOC.
title: Energy+
views:
- title: Energy
  path: energy
  icon: mdi:transmission-tower
  cards:
  # Energy cards read the period from this card; without it they have nothing to
  # scope their queries to.
  - type: energy-date-selection

  - type: horizontal-stack
    cards:
    - type: gauge
      entity: sensor.battery_level
      name: Battery charge
      min: 0
      max: 100
      needle: true
      severity:
        red: 0
        yellow: 20
        green: 50
    - type: entity
      entity: sensor.battery_charge
      name: Stored energy
    - type: entity
      entity: sensor.battery_power
      name: Battery flow

  - type: energy-distribution
    link_dashboard: true

  - type: entities
    title: Live power
    entities:
    - entity: sensor.total_dc_power
      name: PV production
    - entity: sensor.load_power
      name: House load
    - entity: sensor.export_power_raw
      name: "Grid (+ export / - import)"
    - entity: sensor.battery_power
      name: "Battery (+ discharge / - charge)"
    - entity: sensor.battery_level
      name: Battery charge
    - entity: sensor.battery_charge
      name: Stored energy
    - entity: sensor.battery_charge_nominal
      name: Stored energy (usable, min/max SOC)
    - entity: sensor.running_state
      name: Inverter state

  - type: entities
    title: EV charger
    entities:
    - entity: sensor.charger_status
      name: Status
    - entity: sensor.charger_mode
      name: Mode
    - entity: binary_sensor.charger_enabled
      name: Enabled
    - entity: binary_sensor.charger_grid_power_draw
      name: Grid power draw allowed
    - type: section
      label: Power (measured at the charger)
    - entity: sensor.charger_active_power
      name: Charging power
    - entity: sensor.ev_charging_energy_today
      name: Charged today
    - entity: sensor.charger_phase_a_power
      name: Phase A
    - entity: sensor.charger_phase_b_power
      name: Phase B
    - entity: sensor.charger_phase_c_power
      name: Phase C
    - type: section
      label: Charging strategy
    - entity: switch.charger_allow_grid_charging
      name: Grid charging allowed
    - entity: input_boolean.ev_deadline_charging
      name: Deadline charging
    - entity: input_number.ev_target_soc
      name: Grid-charge target (surplus ignores this)
    - entity: input_datetime.ev_ready_by
      name: Ready by
    - type: section
      label: Car (polled every 4 h unless charging)
    - entity: sensor.byd_atto_2_battery_level
      name: Battery
    - entity: sensor.byd_atto_2_range
      name: Range
    - entity: binary_sensor.byd_atto_2_plug
      name: Plugged in
    - entity: binary_sensor.byd_atto_2_charging
      name: Charging (car)
    - entity: sensor.byd_atto_2_telemetry_last_updated
      name: Car data as of

  # Supports the open decision on which meter should feed the Energy dashboard:
  # the iHomeManager sits at the meter, the inverter only sees its own side.
  - type: entities
    title: Meter cross-check — iHomeManager vs inverter
    entities:
    - entity: sensor.ihm_meter_power_raw
      name: "iHM grid (+ import / - export)"
    - entity: sensor.export_power_raw
      name: "Inverter grid (+ export / - import)"
    - type: section
      label: Lifetime counters
    - entity: sensor.ihm_grid_import_energy
      name: iHM imported
    - entity: sensor.total_imported_energy
      name: Inverter imported
    - entity: sensor.ihm_grid_export_energy
      name: iHM exported
    - entity: sensor.total_exported_energy
      name: Inverter exported
    - type: section
      label: Load
    - entity: sensor.ihm_load_power
      name: iHM house load
    - entity: sensor.load_power
      name: Inverter house load

  - type: horizontal-stack
    cards:
    - type: energy-self-sufficiency-gauge
    - type: energy-grid-neutrality-gauge

  - type: energy-usage-graph
  - type: energy-solar-graph
  - type: energy-sources-table

  - type: markdown
    title: What these mean
    content: |
      **PV production** — what the panels are making right now, in watts. **House
      load** is what the house is drawing. The difference goes to the battery or
      the grid.

      **Grid** — positive means you are exporting (selling), negative means
      importing (buying).

      **Battery flow** — positive means the battery is discharging into the
      house, negative means it is charging. So negative is "storing", which reads
      backwards until you get used to it.

      **Battery charge** is percent full. **Stored energy** is the same thing in
      kWh, which is more useful: compare it against your house load to see how
      many hours you are holding. **Stored energy (usable)** is smaller because
      the inverter reserves headroom below the minimum and above the maximum SOC.

      **Self-sufficiency** — the share of what the house used that came from your
      own panels and battery rather than the grid. **Grid neutrality** — whether
      you exported more than you imported over the period.

      The graphs and table are period totals in kWh, controlled by the date
      picker at the top. The live power rows above are instantaneous watts, so
      they will not add up to the graphs.

      **EV charging power is measured, not estimated.** It comes from the
      iHomeManager's own charger registers (total plus the three phases), found
      by diffing the register map between an idle and a charging session. It
      tracks the car only — a household appliance switching on does not move it.

      **Charging strategy** — the charger normally runs surplus-only: it takes
      solar that would otherwise be exported and never imports. *Grid charging
      allowed* is switched on automatically only when the car is below the
      *Grid-charge target* and the current hour is among the cheapest remaining
      before the *Ready by* time, then off again. Turn *Deadline charging* off to
      stay surplus-only regardless.

      **The target applies to paid grid charging only.** Surplus charging is
      never capped: once the target is reached HA simply stops granting grid
      import and leaves the charger taking free solar, so sunshine fills the car
      to 100%. Nothing here stops charging — the only limits are the car's own. This needs the charger left in **Eco mode** in
      the Sungrow app; the mode itself is not written from here.

      **The car rows come from BYD's cloud, not the charger**, and are only
      refreshed every 4 hours while idle (every 5 minutes during charging) to
      avoid waking the car and draining its 12 V battery. So *Battery* and
      *Range* can be hours old when parked — check *Car data as of*. The
      charger rows above are live to within seconds either way.

      **Meter cross-check** — the iHomeManager sits at the grid meter, the
      inverter only sees its own connection, so the two disagree by whatever
      the inverter cannot see. The Energy dashboard still uses the inverter's
      figures; the rows are there to judge whether to switch before changing
      anything, since switching sources mid-history skews self-sufficiency and
      cost.

- title: Heat pump
  path: heatpump
  icon: mdi:heat-pump
  cards:
  - type: markdown
    title: What the heat pump is doing right now
    content: |
      {% set prio = states('sensor.prio_43086') %}
      {% set dm = states('number.degree_minutes_16_bit_43005') | float(0) %}
      {% set supply = states('sensor.bt2_supply_temp_s1_40008') | float(0) %}
      {% set target = states('sensor.calc_supply_s1_43009') | float(0) %}
      {% set bin = states('sensor.eb100_ep14_bt10_brine_in_temp_40015') | float(0) %}
      {% set bout = states('sensor.eb100_ep14_bt11_brine_out_temp_40016') | float(0) %}
      {% set add = states('sensor.int_el_add_power_43084') | float(0) %}
      {% set alarm = states('sensor.alarm_45001') | float(0) %}

      **Job right now: {{ prio }}** —
      {%- if prio == 'HOT WATER' %} heating the hot water tank. House heating
      waits its turn: there is one compressor, and hot water takes priority.
      {%- elif prio == 'HEAT' %} heating the house.
      {%- elif prio == 'OFF' %} idle. Neither the house nor the tank is asking
      for heat.
      {%- else %} {{ prio }}.
      {%- endif %}

      **Compressor: {{ states('sensor.compressor_state_ep14_43427') }}.**
      It runs at one fixed speed, so it works by switching on and off rather than
      throttling.

      **Heat deficit: {{ dm }} degree-minutes.**
      Zero means the house is exactly as warm as the pump intends. It drifts
      negative as rooms fall behind, and the further negative, the harder the
      pump tries: the compressor starts around -60, and the immersion heater only
      joins in several hundred further down.

      **Water to the radiators: {{ supply }} °C, aiming for {{ target }} °C**
      {%- if supply < target - 3 %} — {{ (target - supply) | round(1) }} °C
      short, so it is still catching up. Normal after a start or a hot water
      cycle; a persistent gap in cold weather means it cannot keep up.
      {%- else %} — on target.
      {%- endif %}
      The target is not a setting you pick; the pump computes it from the outdoor
      temperature and the heat curve, which is why it moves on its own.

      **Immersion heater:**
      {%- if add > 0 %} ⚠️ drawing {{ add }} kW. This is a plain electric element:
      1 kWh of electricity buys 1 kWh of heat, where the compressor buys three to
      five. Fine for a cold snap, expensive as a habit.
      {%- else %} off — where you want it.
      {%- endif %}

      **Ground loop: {{ bin }} °C coming in from the ground, {{ bout }} °C going
      back out.**
      The pump harvests the {{ (bin - bout) | round(1) }} °C difference; 2-5 °C
      while running is healthy. Both numbers sink over a winter and recover in
      summer. If brine out keeps reaching -8 °C or below, the ground around the
      collector is being drained faster than it recovers.

      {% if alarm > 0 %}⚠️ **Alarm {{ alarm | int }} is active** — check the
      pump's own display for the description.{% else %}**No alarm.**{% endif %}

  - type: entities
    title: Operation
    entities:
    - entity: sensor.prio_43086
      name: Priority
    - entity: sensor.compressor_state_ep14_43427
      name: Compressor
    - entity: sensor.int_el_add_power_43084
      name: Immersion heater
    - entity: number.degree_minutes_16_bit_43005
      name: Degree minutes
    - entity: sensor.alarm_45001
      name: Alarm code

  - type: entities
    title: Temperatures
    entities:
    - entity: sensor.bt1_outdoor_temperature_40004
      name: Outdoor
    - entity: sensor.bt1_average_40067
      name: Outdoor (average)
    - entity: sensor.bt2_supply_temp_s1_40008
      name: Supply
    - entity: sensor.calc_supply_s1_43009
      name: Supply (target)
    - entity: sensor.eb100_ep14_bt3_return_temp_40012
      name: Return
    - entity: sensor.bt7_hw_top_40013
      name: Hot water top
    - entity: sensor.bt6_hw_load_40014
      name: Hot water load

  - type: entities
    title: Ground loop
    entities:
    - entity: sensor.eb100_ep14_bt10_brine_in_temp_40015
      name: Brine in
    - entity: sensor.eb100_ep14_bt11_brine_out_temp_40016
      name: Brine out
    - entity: sensor.ep14_gp2_brine_pump_status_ep14_43439
      name: Brine pump
    - entity: sensor.supply_pump_speed_ep14_43437
      name: Supply pump

  - type: entities
    title: Wear and running hours
    entities:
    - entity: sensor.compressor_starts_eb100_ep14_43416
      name: Compressor starts (lifetime)
    - entity: sensor.nibe_compressor_starts_daily
      name: Compressor starts (today)
    - entity: sensor.tot_op_time_compr_eb100_ep14_43420
      name: Compressor hours (total)
    - entity: sensor.tot_hw_op_time_compr_eb100_ep14_43424
      name: Compressor hours (hot water)
    - entity: sensor.tot_op_time_add_43081
      name: Immersion heater hours

  - type: statistics-graph
    title: Electricity used per day (estimated)
    entities:
    - sensor.heat_pump_energy_estimate
    stat_types:
    - change
    period: day
    days_to_show: 30
    chart_type: bar

  - type: history-graph
    title: Power draw (estimated)
    hours_to_show: 24
    entities:
    - sensor.heat_pump_power_estimate
    - sensor.int_el_add_power_43084

  - type: markdown
    title: About the electricity figures
    content: |
      The F1245 does not meter itself — nothing in its protocol reports what the
      compressor draws — so these two are **modelled, not measured**: a flat
      1600 W whenever the compressor is running, plus the immersion heater's own
      reported kW, plus a little for the circulation pumps.

      That is a reasonable shape because the compressor runs at one fixed speed,
      but the constant is a guess. **To calibrate it:** watch *House load* on the
      Energy view and note how much it jumps the moment the compressor starts, at
      night when little else is on. Tell me the number and I will set it.

      Real measurement, if you want it: a clamp meter on the pump's circuit (a
      Shelly EM on its breaker is the least invasive) reports true watts and
      kWh. NIBE's own route is a pulse energy meter wired to the input board's
      X22/X23, which the pump then exposes as an accumulated-kWh coil, but that
      needs input board version 35 or later.

      Once the daily figures look right you can add *Heat pump energy estimate*
      to the built-in Energy dashboard under **Settings → Energy → Add device**,
      and it will appear in the device-consumption breakdown.

  - type: history-graph
    title: Is it keeping up? (supply vs target)
    hours_to_show: 24
    entities:
    - sensor.bt2_supply_temp_s1_40008
    - sensor.calc_supply_s1_43009
    - sensor.bt1_outdoor_temperature_40004

  - type: history-graph
    title: Ground loop over 48h
    hours_to_show: 48
    entities:
    - sensor.eb100_ep14_bt10_brine_in_temp_40015
    - sensor.eb100_ep14_bt11_brine_out_temp_40016

  - type: markdown
    title: Glossary
    content: |
      **Priority** — a single-compressor pump does one job at a time: `HEAT`,
      `HOT WATER`, or `OFF`. Hot water interrupts heating, not the other way
      round.

      **Degree minutes** — the pump's running tally of how far the house has
      fallen behind, in °C multiplied by minutes. 0 is satisfied, negative is
      behind. It is the trigger for everything: compressor on near -60,
      immersion heater several hundred lower, both set in the pump's menu 4.9.3.

      **Supply / Return** — water leaving to the radiators and coming back. The
      gap between them (5-10 °C while running) shows how much heat the house is
      actually absorbing.

      **Supply (target)** — computed from outdoor temperature and the heat curve.
      Nudge it with *Heat Offset S1* if rooms run cold or warm; do not chase it
      with the thermostat.

      **Outdoor (average)** — a smoothed outdoor reading. The curve follows this
      rather than the raw value, so the pump ignores brief cold gusts.

      **Hot water top / load** — top of the tank is what reaches the tap first;
      the load sensor lower down decides when charging starts. That is why the
      tap can run hot while the pump still says the tank needs charging.

      **Brine in / out** — fluid arriving from the ground (warmer) and returning
      to it (colder). The difference is harvested heat; the absolute values show
      how much the ground has left. NIBE's own low-brine alarm sits near -12 °C.

      **Immersion heater** — the electric backup element, in kW. Cheap to build,
      expensive to run: no heat pump multiplier, just resistance heating.

      **Compressor starts** — wear. Many short cycles are harder on it than
      fewer long runs; the automations flag more than 30 starts in a day.

      **Alarm code** — 0 is healthy. Anything else is a fault code to look up on
      the pump's display; you get a phone notification either way.

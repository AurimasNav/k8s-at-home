# Doppler secrets for Questlog:
#   QUESTLOG (JSON): BETTER_AUTH_SECRET, ADMIN_EMAILS, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET
#                    (a provider without credentials is hidden; Facebook is off for now, and adding
#                    FACEBOOK_CLIENT_ID and FACEBOOK_CLIENT_SECRET here would turn it on).
#   QUESTLOG_DATABASE_PASSWORD: the questlog role's password (URL-safe, e.g. openssl rand -hex 24);
#                    gitops/postgresql/databases.job.yaml sets the same password on the role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: questlog
  namespace: questlog
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: questlog
  dataFrom:
  - extract:
      key: QUESTLOG
  data:
  - secretKey: QUESTLOG_DATABASE_PASSWORD
    remoteRef:
      key: QUESTLOG_DATABASE_PASSWORD

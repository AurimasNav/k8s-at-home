apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Questlog: game guides with checklists, notes and an agent API (https://github.com/AurimasNav/questlog).
# Image tags are bumped by that repo's deploy workflow (kustomize edit set image).

components:
- ./components/reloader

resources:
- ./configmap.yaml
- ./externalsecret.yaml
- ./ghcr-pull.externalsecret.yaml
- ./google-oauth.externalsecret.yaml
- ./migrate.job.yaml
- ./deployment.yaml
- ./service.yaml
- ./httproute.yaml
images:
- name: ghcr.io/aurimasnav/questlog
  newTag: 0.1.0-3
- name: ghcr.io/aurimasnav/questlog-migrate
  newTag: 0.1.0-3

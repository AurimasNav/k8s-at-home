apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: questlog
  namespace: questlog
spec:
  parentRefs:
  # Served only through the Cloudflare Tunnel (listener https-tunnel, iac/cloudflare/tunnel.tf).
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel
  hostnames:
  - questlog.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: questlog
      port: 80

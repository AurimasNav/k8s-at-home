# The shared Google OAuth client (also used by oauth2-proxy, hairsera and immich). Its authorised redirect
# URIs must include https://questlog.sync.lt/api/auth/callback/google.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: questlog-google-oauth
  namespace: questlog
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: questlog-google-oauth
  dataFrom:
  - extract:
      key: GOOGLE_OAUTH_JSON
    rewrite:
    - regexp:
        source: GOOGLE_OAUTH_CLIENT_ID
        target: GOOGLE_CLIENT_ID
    - regexp:
        source: GOOGLE_OAUTH_CLIENT_SECRET
        target: GOOGLE_CLIENT_SECRET

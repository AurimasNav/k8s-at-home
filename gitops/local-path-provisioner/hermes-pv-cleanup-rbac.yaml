# TEMPORARY: remove in the follow-up PR once the PV below is gone.
# Lets Hermes (SA hermes-agent/hermes-agent) delete one orphaned PersistentVolume and nothing else.
# pvc-90833cb7-… belonged to satisfactory/config; that namespace was removed long ago, the PV has
# been Released since, and the provisioner retries (and fails) to clean it up every 15 minutes
# ("cannot find affinited node"). Deleting the PV object stops the retries; the 128 MiB directory
# /opt/local-path-provisioner/pvc-90833cb7-…_satisfactory_config stays on the host.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-orphan-pv-cleanup
rules:
- apiGroups: [""]
  resources: ["persistentvolumes"]
  resourceNames: ["pvc-90833cb7-b2d9-486b-8227-f71d13fd34d0"]
  verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-orphan-pv-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-orphan-pv-cleanup
subjects:
- kind: ServiceAccount
  name: hermes-agent
  namespace: hermes-agent

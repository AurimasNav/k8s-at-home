apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr-ru
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Google login (allowed emails only) is the only lock: the app itself runs with
    # AUTH__METHOD=External. No HTTPRoute on purpose: the Cilium gateway has no
    # oauth2-proxy, so a route there would skip the login.
    nginx.ingress.kubernetes.io/auth-url: "https://login.sync.lt/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://login.sync.lt/oauth2/start?rd=$scheme://$best_http_host$escaped_request_uri"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sonarr-ru.sync.lt
    secretName: sonarr-ru-letsencrypt
  rules:
  - host: sonarr-ru.sync.lt
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonarr-ru
            port:
              name: app

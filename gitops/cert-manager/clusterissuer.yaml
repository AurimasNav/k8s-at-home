apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: rimtc@outlook.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    # DNS-01 through Cloudflare: works for wildcards and needs no ingress controller.
    # Token "cert-manager" (iac/cloudflare): DNS Write + Zone Read on sync.lt only.
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-dns-api-token
            key: CLOUDFLARE_DNS_API_TOKEN
      selector:
        dnsZones:
        - sync.lt
---

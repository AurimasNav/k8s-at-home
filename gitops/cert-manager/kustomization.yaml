apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.yaml
- ./clusterissuer.yaml
- ./externalsecret.yaml

patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --enable-gateway-api
    # Certificate Secrets get an ownerReference to their Certificate, so removing a
    # Certificate (or its Ingress) also removes the Secret.
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --enable-certificate-owner-ref=true
  target:
    kind: Deployment
    name: cert-manager
    namespace: cert-manager

# Cloudflare token for the ClusterIssuers' DNS-01 solver. Created by iac/cloudflare
# (account token "cert-manager"), which writes it to Doppler. A ClusterIssuer reads
# secrets from the cert-manager namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns-api-token
  namespace: cert-manager
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-dns-api-token
  data:
  - secretKey: CLOUDFLARE_DNS_API_TOKEN
    remoteRef:
      key: CLOUDFLARE_DNS_API_TOKEN

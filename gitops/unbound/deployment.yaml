apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: unbound
  name: unbound
  namespace: unbound
  annotations:
    # restart on unbound.conf changes (subPath mounts never update in place)
    reloader.stakater.com/auto: "true"
spec:
  # Two pods: Blocky (and so every LAN device) forwards here. One pod could be stopped by a restart
  # or a node drain; the Service only sends queries to pods that answer on port 53.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      containers:
      - name: unbound
        image: mvance/unbound:1.22.0
        # tag is pinned (Renovate bumps it): start from the cached image after a reboot
        imagePullPolicy: IfNotPresent
        ports:
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
        - name: dns-udp
          containerPort: 53
          protocol: UDP
        volumeMounts:
        - name: root-hints
          mountPath: /opt/unbound/etc/unbound/root.hints
          subPath: root.hints
        - name: unbound-config
          mountPath: /opt/unbound/etc/unbound/unbound.conf
          subPath: unbound.conf
        readinessProbe:
          tcpSocket:
            port: dns-tcp
          periodSeconds: 10
        # 7-day peak per pod: ~11 MiB, under 1m CPU
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
      volumes:
      - name: root-hints
        configMap:
          name: root-hints
      - name: unbound-config
        configMap:
          name: unbound

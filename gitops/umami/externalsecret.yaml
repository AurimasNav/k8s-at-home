# Doppler secrets for Umami:
#   UMAMI_APP_SECRET:        signs Umami's login tokens (openssl rand -hex 32)
#   UMAMI_DATABASE_PASSWORD: the umami role's password (URL-safe, e.g. openssl rand -hex 24);
#                            gitops/postgresql/databases.job.yaml sets the same password on the role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: umami
  data:
  - secretKey: APP_SECRET
    remoteRef:
      key: UMAMI_APP_SECRET
  - secretKey: UMAMI_DATABASE_PASSWORD
    remoteRef:
      key: UMAMI_DATABASE_PASSWORD

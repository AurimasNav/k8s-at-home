apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Umami: cookieless visitor counting for Questlog (https://umami.is).
# Questlog passes its tracker script and visit pings through to the in-cluster Service
# (questlog: apps/web/src/lib/analytics.ts), so the collector has no public address.
# The dashboard is stats.sync.lt, behind the Google login and then Umami's own login.

resources:
- ./externalsecret.yaml
- ./deployment.yaml
- ./service.yaml
- ./httproute.yaml

images:
- name: ghcr.io/umami-software/umami
  newTag: 3.5.0

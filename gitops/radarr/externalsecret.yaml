# Google sign-in settings for radarr (see configmap.yaml). Client from the shared Google OAuth
# client, allowed account from Doppler ADMIN_GOOGLE_EMAIL (kept out of this public repo).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
  # Before the Deployment, which needs this Secret (envFrom, not optional).
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: radarr
  dataFrom:
  # Shared Google OAuth client (also oauth2-proxy, hairsera, Immich); redirect URI
  # https://<host>/signin-oidc is registered on it.
  - extract:
      key: GOOGLE_OAUTH_JSON
    rewrite:
    - regexp:
        source: GOOGLE_OAUTH_CLIENT_ID
        target: RADARR__AUTH__OIDCCLIENTID
    - regexp:
        source: GOOGLE_OAUTH_CLIENT_SECRET
        target: RADARR__AUTH__OIDCCLIENTSECRET
  data:
  - secretKey: RADARR__AUTH__OIDCUSERIDENTIFIER
    remoteRef:
      key: ADMIN_GOOGLE_EMAIL

# Cilium gateway route. No gateway login (oauth2-proxy ExternalAuth): the app's own Google
# sign-in (configmap.yaml, ExternalSecret) is the login, so it isn't asked for twice. Without a
# session the app answers only /ping, the login page and the Google callback; the API needs the key.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: radarr
spec:
  parentRefs:
  # Served only through the Cloudflare Tunnel (listener https-tunnel, iac/cloudflare/tunnel.tf);
  # the home IP's 443 listener does not serve this host.
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel
  hostnames:
  - radarr.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Envoy's default is 15 s for the whole response; 0s turns that off (long downloads,
    # interactive searches, streams). Idle connections still close after 300 s.
    timeouts:
      request: 0s
    backendRefs:
    - name: radarr
      port: 80

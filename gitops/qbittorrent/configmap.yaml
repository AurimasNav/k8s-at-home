apiVersion: v1
kind: ConfigMap
# qBittorrent reads QBT_<OPTION> env vars only as command-line options (QBT_WEBUI_PORT and
# QBT_TORRENTING_PORT, set in deployment.yaml). QBT_<Section>__<Key> settings are ignored by this
# image; those live in qBittorrent.conf (setup/webui_auth.py) or the Web UI.
metadata:
  name: qbittorrent
data:
  TZ: Europe/London

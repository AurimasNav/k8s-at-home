apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app: qbittorrent
spec:
  replicas: 1
  # Never two qBittorrents on the same config and torrents: the old one saves its settings on
  # exit, which would undo the init container's login settings in the file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      # Turns on the Web UI/API login (Doppler) and removes the auth bypass before qBittorrent
      # starts. See setup/webui_auth.py.
      - name: webui-auth
        image: python
        command: ["python3", "/setup/webui_auth.py"]
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        envFrom:
        - secretRef:
            name: qbittorrent-webui
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
        - name: setup
          mountPath: /setup
          readOnly: true
      containers:
      - name: qbittorrent
        image: ghcr.io/onedr0p/qbittorrent:5.0.4
        ports:
        - containerPort: 8080
          name: webui
          protocol: TCP
        - containerPort: 6881
          name: traffic
          protocol: TCP
        - containerPort: 6881
          name: traffic-udp
          protocol: UDP
        envFrom:
        - configMapRef:
            name: qbittorrent
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
        - name: torrents
          mountPath: /data/torrents
        - name: media
          mountPath: /data/media
        - name: vuetorrent
          mountPath: /vuetorrent
      volumes:
      - name: qbittorrent-config
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: torrents
        hostPath:
          path: /data/torrents
          type: Directory
      - name: media
        hostPath:
          path: /data/media
          type: Directory
      - name: vuetorrent
        emptyDir:
          sizeLimit: 500Mi
      - name: setup
        configMap:
          name: qbittorrent-setup

apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app: qbittorrent
spec:
  replicas: 1
  # Never two qBittorrents on the same config and torrents: the old one saves its settings on
  # exit, which would undo the init container's login settings in the file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # DNS through Blocky -> Unbound instead of the node's resolver (router -> ISP), which answers
      # some tracker sites with the ISP block page (e.g. linkomanija.net, rutor, nnmclub). Same setup
      # as Prowlarr (gitops/prowlarr/deployment.yaml): Blocky sends cluster.local back to CoreDNS, and
      # there is no second nameserver, because musl asks all of them at once and takes the first answer.
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 192.168.1.152 # Blocky LoadBalancer (gitops/blocky)
        searches:
        - qbittorrent.svc.cluster.local
        - svc.cluster.local
        - cluster.local
        options:
        - name: ndots
          value: "5"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      # Turns on the Web UI/API login (Doppler) and removes the auth bypass before qBittorrent
      # starts. See setup/webui_auth.py.
      - name: webui-auth
        image: python
        command: ["python3", "/setup/webui_auth.py"]
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        envFrom:
        - secretRef:
            name: qbittorrent-webui
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
        - name: setup
          mountPath: /setup
          readOnly: true
      containers:
      - name: qbittorrent
        # onedr0p/containers is archived (no releases after 5.0.4); home-operations/containers is its successor,
        # same Dockerfile/entrypoint and the same userdocs static build of qBittorrent.
        image: ghcr.io/home-operations/qbittorrent:5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
        ports:
        - containerPort: 8080
          name: webui
          protocol: TCP
        - containerPort: 6881
          name: traffic
          protocol: TCP
        - containerPort: 6881
          name: traffic-udp
          protocol: UDP
        # The onedr0p image set these two in its Dockerfile; the home-operations image does not.
        # qBittorrent reads QBT_<OPTION> as its --webui-port / --torrenting-port command-line options.
        env:
        - name: QBT_WEBUI_PORT
          value: "8080"
        - name: QBT_TORRENTING_PORT
          value: "50413"
        envFrom:
        - configMapRef:
            name: qbittorrent
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
        - name: torrents
          mountPath: /data/torrents
        - name: media
          mountPath: /data/media
      volumes:
      - name: qbittorrent-config
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: torrents
        hostPath:
          path: /data/torrents
          type: Directory
      - name: media
        hostPath:
          path: /data/media
          type: Directory
      - name: setup
        configMap:
          name: qbittorrent-setup

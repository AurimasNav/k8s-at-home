# qBittorrent Web UI / API login (Doppler). Only the webui-auth init container reads it; it
# writes the username and a PBKDF2 hash into qBittorrent.conf. Radarr, Sonarr, Prowlarr and
# the RU instances hold the same login in their download client settings; Cleanuparr gets it
# from its setup Job (gitops/cleanuparr/setup-job.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-webui
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: qbittorrent-webui
  data:
  - secretKey: WEBUI_USERNAME
    remoteRef:
      key: QBITTORRENT_USERNAME
  - secretKey: WEBUI_PASSWORD
    remoteRef:
      key: QBITTORRENT_PASSWORD

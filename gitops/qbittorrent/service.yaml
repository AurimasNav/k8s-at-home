apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
spec:
  ports:
  - name: app
    port: 80
    targetPort: 8080
    protocol: TCP
    appProtocol: http
  selector:
    app: qbittorrent
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-traffic
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.212
spec:
  ports:
  # Same port as QBT_TORRENTING_PORT (deployment.yaml); the router forwards 50413 TCP+UDP here.
  - name: traffic
    port: 50413
    targetPort: 50413
    protocol: TCP
    appProtocol: TCP
  - name: traffic-udp
    port: 50413
    targetPort: 50413
    protocol: UDP
    appProtocol: UDP
  selector:
    app: qbittorrent
  type: LoadBalancer

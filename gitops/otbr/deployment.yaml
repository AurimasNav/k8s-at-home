apiVersion: apps/v1
kind: Deployment
metadata:
  name: otbr
  namespace: otbr
  labels:
    app: otbr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otbr
  template:
    metadata:
      labels:
        app: otbr
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: ubuntu-k8s
      # Re-apply the host IPv6 sysctls OTBR needs to route between the Thread mesh
      # (wpan0) and the LAN (eno1). hostNetwork + privileged lets this write the host's
      # network sysctls; it runs on every pod start, so it survives node reboots (which
      # reset these to defaults and break Matter commissioning). See
      # docs/matter-thread-setup.md. ip6table_filter is not needed here (FIREWALL=0).
      initContainers:
      - name: host-ipv6-sysctls
        image: busybox:1.38
        securityContext:
          privileged: true
        command:
        - /bin/sh
        - -c
        - |
          # accept_ra=2 before forwarding=1 so eno1 keeps its global IPv6 address
          echo 2  > /proc/sys/net/ipv6/conf/all/accept_ra
          echo 2  > /proc/sys/net/ipv6/conf/eno1/accept_ra
          echo 64 > /proc/sys/net/ipv6/conf/eno1/accept_ra_rt_info_max_plen
          echo 1  > /proc/sys/net/ipv6/conf/all/forwarding
          echo "host IPv6 set -> forwarding=$(cat /proc/sys/net/ipv6/conf/all/forwarding) accept_ra_all=$(cat /proc/sys/net/ipv6/conf/all/accept_ra) accept_ra_eno1=$(cat /proc/sys/net/ipv6/conf/eno1/accept_ra) rt_info=$(cat /proc/sys/net/ipv6/conf/eno1/accept_ra_rt_info_max_plen)"
      containers:
      - name: otbr
        image: ghcr.io/ownbee/hass-otbr-docker:latest
        securityContext:
          privileged: true
        env:
        # Point DEVICE to the persistent path mounted inside the container
        - name: DEVICE
          value: /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_DCB4D9124108-if00
        - name: BAUDRATE
          value: "460800"
        - name: FLOW_CONTROL
          value: "true"
        - name: BACKBONE_IF
          value: eno1
        - name: FIREWALL
          value: "0"
        - name: NAT64
          value: "0"
        - name: OTBR_REST_PORT
          value: "8081"
        - name: OTBR_WEB_PORT
          value: "8086"
        - name: AUTOFLASH_FIRMWARE
          value: "1"
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                for i in $(seq 1 30); do
                  prefix=$(ot-ctl br omrprefix 2>/dev/null | grep "Local:" | awk '{print $2}')
                  if [ -n "$prefix" ]; then
                    ip -6 route add "$prefix" dev wpan0 2>/dev/null || true
                    break
                  fi
                  sleep 2
                done
        volumeMounts:
        - name: data
          mountPath: /data
        # Mount the host /dev directory so container can resolve symlinks to /dev/ttyACM*
        - name: dev
          mountPath: /dev
        - name: tun
          mountPath: /dev/net/tun
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: otbr-data
      # Mount /dev from host as Directory
      - name: dev
        hostPath:
          path: /dev
          type: Directory
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./deployment.yaml
- ./pvc.yaml
- ./service.yaml

# s6 service definition for otbr-omr-route. The name hash restarts OTBR when the script
# changes, which is needed: s6-overlay compiles its services only at container start.
configMapGenerator:
- name: otbr-omr-route
  namespace: otbr
  files:
  - run=s6/otbr-omr-route/run
  literals:
  - type=longrun
  - dependency=
  - bundle-entry=

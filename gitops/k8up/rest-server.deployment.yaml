apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
  namespace: k8up
  labels:
    app: rest-server
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
    spec:
      initContainers:
      # One-time move from the system SSD (/var/backups/restic) to the media disk. Copies only when
      # the new location is still empty; the old directory is left in place (delete by hand later).
      - name: migrate
        image: restic/rest-server:latest
        command:
        - sh
        - -c
        - |
          set -eu
          if [ -z "$(ls -A /data)" ] && [ -n "$(ls -A /old 2>/dev/null)" ]; then
            echo "copying /old -> /data"
            cp -a /old/. /data/
            echo "done: $(du -sh /data | cut -f1)"
          else
            echo "nothing to copy"
          fi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: old-data
          mountPath: /old
          readOnly: true
      - name: htpasswd
        image: restic/rest-server:latest
        command: ["sh", "-c", "htpasswd -B -b -c /auth/.htpasswd k8up \"$REST_PASSWORD\""]
        env:
        - name: REST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rest-server
              key: REST_PASSWORD
        volumeMounts:
        - name: auth
          mountPath: /auth
      containers:
      - name: rest-server
        image: restic/rest-server:latest
        env:
        - name: PASSWORD_FILE
          value: /auth/.htpasswd
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: data
          mountPath: /data
        - name: auth
          mountPath: /auth
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: auth
        emptyDir: {}
      # Media disk hdd2 (20 TB), not the system SSD the backed-up PVCs live on. The disk itself,
      # not the mergerfs pool (/data): a restic repository must stay on one disk.
      - name: data
        hostPath:
          path: /mnt/hdd2/.backups/restic
          type: Directory
      # previous location, read only by the migrate init container
      - name: old-data
        hostPath:
          path: /var/backups/restic
          type: DirectoryOrCreate

apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: k8up-restic
spec:
  externalSecretName: k8up-restic
  # keep in sync with the namespaces in schedules.yaml
  namespaceSelectors:
  - matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - postgresql
      - homebox
      - home-assistant
      - hermes-agent
      - matter-server
      - otbr
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: "1800s"
    secretStoreRef:
      name: doppler-secret-store
      kind: ClusterSecretStore
    target:
      name: k8up-restic
      template:
        mergePolicy: Merge
        data:
          REST_USER: k8up
    dataFrom:
    - extract:
        key: RESTIC

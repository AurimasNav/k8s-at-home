apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- https://github.com/k8up-io/k8up/releases/download/k8up-4.10.1/k8up-crd.yaml
- ./rest-server.externalsecret.yaml
- ./rest-server.deployment.yaml
- ./rest-server.service.yaml
- ./restic.clusterexternalsecret.yaml
- ./schedules.yaml
- ./monitoring.yaml

helmGlobals:
  chartHome: charts
helmCharts:
- name: k8up
  version: 4.10.1
  repo: https://k8up-io.github.io/k8up
  releaseName: k8up
  namespace: k8up
  valuesFile: values.yaml

images:
- name: restic/rest-server
  newTag: 0.14.0

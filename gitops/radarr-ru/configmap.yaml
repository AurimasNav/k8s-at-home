apiVersion: v1
kind: ConfigMap
metadata:
  name: radarr-ru
data:
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/Vilnius
  RADARR__APP__INSTANCENAME: Radarr RU
  # Behind the gateway + oauth2-proxy; in-cluster callers (Seerr/VSeerr,
  # Prowlarr, Hermes) use the API key.
  RADARR__AUTH__METHOD: External
  RADARR__AUTH__REQUIRED: DisabledForLocalAddresses

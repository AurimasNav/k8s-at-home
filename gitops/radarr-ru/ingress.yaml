apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-ru
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Google login (allowed emails only) is the only lock: the app itself runs with
    # AUTH__METHOD=External. The Cilium gateway route
    # (httproute.yaml) has the same Google login (ExternalAuth).
    nginx.ingress.kubernetes.io/auth-url: "https://login.sync.lt/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://login.sync.lt/oauth2/start?rd=$scheme://$best_http_host$escaped_request_uri"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - radarr-ru.sync.lt
    secretName: radarr-ru-letsencrypt
  rules:
  - host: radarr-ru.sync.lt
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: radarr-ru
            port:
              name: app

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    template:
      mergePolicy: Merge
      data:
        admin-user: admin
  data:
  - secretKey: admin-password
    remoteRef:
      key: GRAFANA_ADMIN_PASSWORD
---
# Grafana Google sign-in (values.yaml grafana.envFromSecrets). Redirect URI
# https://grafana.sync.lt/login/google is registered on the shared Google OAuth client.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-google
  # Before the Grafana Deployment, which needs this Secret (envFromSecrets, not optional).
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-google
    template:
      data:
        GF_AUTH_GOOGLE_CLIENT_ID: "{{ .GOOGLE_OAUTH_CLIENT_ID }}"
        GF_AUTH_GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_OAUTH_CLIENT_SECRET }}"
        GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_PATH: "email == '{{ .ADMIN_GOOGLE_EMAIL | lower }}' && 'GrafanaAdmin' || ''"
  dataFrom:
  - extract:
      key: GOOGLE_OAUTH_JSON
  data:
  - secretKey: ADMIN_GOOGLE_EMAIL
    remoteRef:
      key: ADMIN_GOOGLE_EMAIL

# Grafana dashboard (sidecar ConfigMap): which pods and namespaces use the most RAM and CPU.
# Linked from NodeMemoryPressure, NodeCPUPressure and ProcessOOMKilled (node-pressure.yaml).
# Cheap to keep open: no auto-refresh, the refresh picker starts at 1m, the "now" panels are
# instant queries, and the graphs use a 1m minimum step with topk_max() (top N plus "other").
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pods
  namespace: victoriametrics
  labels:
    grafana_dashboard: "1"
data:
  pods.json: |
    {
      "uid": "home-pods",
      "title": "Home server / Pods",
      "editable": true,
      "graphTooltip": 1,
      "description": "Which pods and namespaces use the most RAM and CPU, now and over time.",
      "tags": [
        "home",
        "kubernetes"
      ],
      "schemaVersion": 39,
      "version": 1,
      "id": null,
      "links": [
        {
          "title": "Node Exporter Full",
          "type": "link",
          "url": "/d/rYdddlPWk?orgId=1",
          "icon": "dashboard",
          "keepTime": true
        },
        {
          "title": "Pod detail",
          "type": "link",
          "url": "/d/k8s_views_pods?orgId=1",
          "icon": "dashboard",
          "keepTime": true
        }
      ],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "",
      "timepicker": {
        "refresh_intervals": [
          "1m",
          "5m",
          "15m",
          "1h"
        ]
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            },
            "hide": 2,
            "refresh": 1
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kube_pod_info{job=\"kube-state-metrics\"}, namespace)",
            "query": {
              "query": "label_values(kube_pod_info{job=\"kube-state-metrics\"}, namespace)",
              "refId": "namespace-var"
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1,
            "hide": 0
          },
          {
            "name": "topn",
            "label": "Top N in graphs",
            "type": "custom",
            "query": "5,8,12,20",
            "current": {
              "text": "8",
              "value": "8"
            },
            "options": [],
            "hide": 0,
            "multi": false,
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Now",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Node RAM used",
          "description": "RAM in use on the server (total minus available), all of it: pods, k3s and the OS.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (1 - node_memory_MemAvailable_bytes{job=\"node-exporter\"} / node_memory_MemTotal_bytes{job=\"node-exporter\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "RAM in pods",
          "description": "Working set of every container in the selected namespaces.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(container_memory_working_set_bytes{job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",container!=\"\",container!=\"POD\",pod!=\"\",namespace=~\"$namespace\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "id": 4,
          "title": "RAM outside pods",
          "description": "Approximate: node RAM used minus the RAM of all pods. That is k3s itself (API server, kubelet, SQLite), containerd and the OS. It ignores the namespace filter.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "clamp_min((node_memory_MemTotal_bytes{job=\"node-exporter\"} - node_memory_MemAvailable_bytes{job=\"node-exporter\"}) - on () sum(container_memory_working_set_bytes{job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",container!=\"\",container!=\"POD\",pod!=\"\"}), 0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "id": 5,
          "title": "Swap used",
          "description": "Swap lives on the system SSD that also holds k3s's database and every app volume.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "node_memory_SwapTotal_bytes{job=\"node-exporter\"} - node_memory_SwapFree_bytes{job=\"node-exporter\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1610612736.0
                  },
                  {
                    "color": "red",
                    "value": 3221225472
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "id": 6,
          "title": "Memory stall (5m)",
          "description": "Share of time processes waited for memory (PSI). NodeMemoryPressure fires above 15 % for 15 min.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * rate(node_pressure_memory_waiting_seconds_total{job=\"node-exporter\"}[5m])",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 15
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "id": 7,
          "title": "CPU used",
          "description": "5-minute average across the 4 threads (2 cores).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(node_cpu_seconds_total{job=\"node-exporter\",mode!~\"idle|iowait|steal\"}[5m])) / count(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}) * 100",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "bargauge",
          "id": 8,
          "title": "RAM by namespace",
          "description": "Top 15 namespaces by working-set RAM right now.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 11,
            "w": 8,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(topk(15, sum by (namespace) (container_memory_working_set_bytes{job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",container!=\"\",container!=\"POD\",pod!=\"\",namespace=~\"$namespace\"})))",
              "legendFormat": "{{namespace}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": {
                "mode": "continuous-BlYlRd"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "valueMode": "text",
            "showUnfilled": true,
            "namePlacement": "left",
            "sizing": "manual",
            "minVizHeight": 16,
            "maxVizHeight": 22,
            "minVizWidth": 8,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "bargauge",
          "id": 9,
          "title": "CPU by namespace (cores, 5m avg)",
          "description": "Top 15 namespaces by CPU, in cores (1 = one full thread; the server has 4).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 11,
            "w": 8,
            "x": 8,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(topk(15, sum by (namespace) (rate(container_cpu_usage_seconds_total{job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",container!=\"\",container!=\"POD\",pod!=\"\",namespace=~\"$namespace\"}[5m]))))",
              "legendFormat": "{{namespace}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "color": {
                "mode": "continuous-BlYlRd"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "valueMode": "text",
            "showUnfilled": true,
            "namePlacement": "left",
            "sizing": "manual",
            "minVizHeight": 16,
            "maxVizHeight": 22,
            "minVizWidth": 8,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "table",
          "id": 20,
          "title": "Pods now (click a pod for its detail dashboard)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 14,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "description": "Every running pod. RAM is the working set (what the kernel and the OOM killer count), CPU the 5-minute average in cores (1 = one full core; the server has 4 threads). RAM limit is empty when the pod has none. Restarts are over the last 24 h.",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",container!=\"\",container!=\"POD\",pod!=\"\",namespace=~\"$namespace\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",container!=\"\",container!=\"POD\",pod!=\"\",namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "",
              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (kube_pod_container_resource_limits{job=\"kube-state-metrics\",namespace=~\"$namespace\",resource=\"memory\"})",
              "legendFormat": "",
              "refId": "C",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{job=\"kube-state-metrics\",namespace=~\"$namespace\"}[24h]))",
              "legendFormat": "",
              "refId": "D",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "namespace": 0,
                  "pod": 1,
                  "Value #A": 2,
                  "Value #B": 3,
                  "Value #C": 4,
                  "Value #D": 5
                },
                "renameByName": {
                  "Value #A": "RAM",
                  "Value #B": "CPU (cores)",
                  "Value #C": "RAM limit",
                  "Value #D": "Restarts 24h"
                }
              }
            },
            {
              "id": "filterByValue",
              "options": {
                "type": "exclude",
                "match": "all",
                "filters": [
                  {
                    "fieldName": "RAM",
                    "config": {
                      "id": "isNull",
                      "options": {}
                    }
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              },
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "RAM"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.width",
                    "value": 260
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "lcd",
                      "valueDisplayMode": "text"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "continuous-GrYlRd"
                    }
                  },
                  {
                    "id": "min",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU (cores)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "custom.width",
                    "value": 260
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "lcd",
                      "valueDisplayMode": "text"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "continuous-GrYlRd"
                    }
                  },
                  {
                    "id": "min",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "RAM limit"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.width",
                    "value": 110
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Restarts 24h"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.width",
                    "value": 120
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "transparent",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "namespace"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 160
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "pod"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Pod detail",
                        "url": "/d/k8s_views_pods?orgId=1&var-namespace=${__data.fields.namespace}&var-pod=${__data.fields.pod}"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "sortBy": [
              {
                "displayName": "RAM",
                "desc": true
              }
            ],
            "footer": {
              "show": true,
              "reducer": [
                "sum"
              ],
              "fields": [
                "RAM",
                "CPU (cores)"
              ],
              "countRows": false
            }
          }
        },
        {
          "type": "bargauge",
          "id": 21,
          "title": "Closest to their memory limit (OOM risk)",
          "description": "Containers that have a memory limit, as % of it. At 100 % the kernel kills them (ContainerOOMKilled alert).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 11,
            "w": 8,
            "x": 16,
            "y": 5
          },
          "targets": [

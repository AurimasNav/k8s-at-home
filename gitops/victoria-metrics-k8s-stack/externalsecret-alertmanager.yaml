# Telegram bot token + chat for Alertmanager (values.yaml: alertmanager). Same bot and chat as
# Hermes; alerts go to the "Alerts" topic (message_thread_id in values.yaml).
# Mounted at /etc/vm/secrets/alertmanager-telegram/ (alertmanager.spec.secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram
  data:
  - secretKey: bot-token
    remoteRef:
      key: HERMES_TELEGRAM_BOT_TOKEN
  - secretKey: chat-id
    remoteRef:
      key: HERMES_TELEGRAM_HOME_CHANNEL

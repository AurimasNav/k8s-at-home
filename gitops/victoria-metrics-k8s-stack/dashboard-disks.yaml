# Grafana dashboard (sidecar ConfigMap), linked from alert messages through the `dashboard`
# annotation (values.yaml defaultRules, gitops/smartctl-exporter). Generated layout, edit the JSON directly.
# Cheap to keep open: no auto-refresh, the refresh picker starts at 1m, and every panel has a
# minimum step matched to the scrape interval, so long time ranges stay a few hundred points.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-disks
  namespace: victoriametrics
  labels:
    grafana_dashboard: "1"
data:
  disks.json: |
    {
      "uid": "home-disks",
      "title": "Home server / Disks",
      "description": "Filesystem space, SMART health and I/O of the home server's disks (sda system SSD, sdb-sdd media pool). Linked from the NodeFilesystem*, NodeDiskIOSaturation and Disk* alerts.",
      "tags": [
        "home-server",
        "disks"
      ],
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "id": null,
      "links": [],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "",
      "timepicker": {
        "refresh_intervals": [
          "1m",
          "5m",
          "15m",
          "1h"
        ]
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            },
            "hide": 2,
            "refresh": 1
          },
          {
            "name": "mountpoint",
            "label": "Mount",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(node_filesystem_size_bytes{job=\"node-exporter\",fstype=~\"ext4|xfs|btrfs\"}, mountpoint)",
            "query": {
              "query": "label_values(node_filesystem_size_bytes{job=\"node-exporter\",fstype=~\"ext4|xfs|btrfs\"}, mountpoint)",
              "refId": "mountpoint-var"
            },
            "refresh": 1,
            "multi": true,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1,
            "hide": 0
          },
          {
            "name": "device",
            "label": "Disk",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(node_disk_io_time_seconds_total{job=\"node-exporter\"}, device)",
            "query": {
              "query": "label_values(node_disk_io_time_seconds_total{job=\"node-exporter\"}, device)",
              "refId": "device-var"
            },
            "refresh": 1,
            "multi": true,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "id": 100,
          "title": "Space",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "bargauge",
          "id": 1,
          "title": "Used",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "description": "NodeFilesystemAlmostOutOfSpace fires below 5 % free (warning) / 3 % (critical).",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (1 - node_filesystem_avail_bytes{job=\"node-exporter\",fstype=~\"ext4|xfs|btrfs\",mountpoint=~\"$mountpoint\"} / node_filesystem_size_bytes{job=\"node-exporter\",fstype=~\"ext4|xfs|btrfs\",mountpoint=~\"$mountpoint\"})",
              "legendFormat": "{{mountpoint}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 85
                  },
                  {
                    "color": "red",
                    "value": 95
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "bargauge",
          "id": 2,
          "title": "Free",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "node_filesystem_avail_bytes{job=\"node-exporter\",fstype=~\"ext4|xfs|btrfs\",mountpoint=~\"$mountpoint\"}",
              "legendFormat": "{{mountpoint}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "bargauge",
          "id": 10,
          "title": "Inodes used",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "description": "NodeFilesystemAlmostOutOfFiles fires below 5 % free inodes (warning) / 3 % (critical).",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (1 - node_filesystem_files_free{job=\"node-exporter\",fstype=~\"ext4|xfs|btrfs\",mountpoint=~\"$mountpoint\"} / node_filesystem_files{job=\"node-exporter\",fstype=~\"ext4|xfs|btrfs\",mountpoint=~\"$mountpoint\"})",
              "legendFormat": "{{mountpoint}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 85
                  },
                  {
                    "color": "red",
                    "value": 95
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "timeseries",
          "id": 3,
          "title": "Used over time",
          "description": "5-minute steps; NodeFilesystemSpaceFillingUp extrapolates this line 24 h / 4 h ahead.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "interval": "5m",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (1 - node_filesystem_avail_bytes{job=\"node-exporter\",fstype=~\"ext4|xfs|btrfs\",mountpoint=~\"$mountpoint\"} / node_filesystem_size_bytes{job=\"node-exporter\",fstype=~\"ext4|xfs|btrfs\",mountpoint=~\"$mountpoint\"})",
              "legendFormat": "{{mountpoint}}",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "id": 101,
          "title": "SMART health",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          }
        },
        {
          "type": "table",
          "id": 4,
          "title": "SMART summary",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Current SMART values per disk (instant). Reallocated / pending sectors above 0 and a FAILED self-assessment are the alerts' triggers; CRC errors point at the cable or port.",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (device, model_name, serial_number) (smartctl_device{device=~\"$device\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (device) (smartctl_device_smart_status{device=~\"$device\"})",
              "legendFormat": "",
              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (device) (smartctl_device_temperature{temperature_type=\"current\",device=~\"$device\"})",
              "legendFormat": "",
              "refId": "C",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (device) (smartctl_device_power_on_seconds{device=~\"$device\"})",
              "legendFormat": "",
              "refId": "D",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (device) (smartctl_device_attribute{attribute_name=\"Reallocated_Sector_Ct\",attribute_value_type=\"raw\",device=~\"$device\"})",
              "legendFormat": "",
              "refId": "E",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (device) (smartctl_device_attribute{attribute_name=~\"Current_Pending_Sector|Offline_Uncorrectable\",attribute_value_type=\"raw\",device=~\"$device\"})",
              "legendFormat": "",
              "refId": "F",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (device) (smartctl_device_attribute{attribute_name=\"UDMA_CRC_Error_Count\",attribute_value_type=\"raw\",device=~\"$device\"})",
              "legendFormat": "",
              "refId": "G",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "device",
                "mode": "outer"
              }
            },
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "pattern": "^(device|model_name|serial_number|Value #[B-G])$"
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "indexByName": {
                  "device": 0,
                  "model_name": 1,
                  "serial_number": 2,
                  "Value #B": 3,
                  "Value #C": 4,
                  "Value #D": 5,
                  "Value #E": 6,
                  "Value #F": 7,
                  "Value #G": 8
                },
                "renameByName": {
                  "device": "Disk",
                  "model_name": "Model",
                  "serial_number": "Serial",
                  "Value #B": "SMART",
                  "Value #C": "Temp",
                  "Value #D": "Powered on",
                  "Value #E": "Reallocated",
                  "Value #F": "Pending / uncorrectable",
                  "Value #G": "CRC errors"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "SMART"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "PASSED",
                            "color": "green",
                            "index": 0
                          },
                          "0": {
                            "text": "FAILED",
                            "color": "red",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Temp"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 50
                        },
                        {
                          "color": "red",
                          "value": 55
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Powered on"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Reallocated"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Pending / uncorrectable"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "CRC errors"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          }
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "Temperature",
          "description": "smartctl-exporter scrapes every 5 min. DiskTooHot fires above 55 °C for 30 min.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 25
          },
          "interval": "5m",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (device) (smartctl_device_temperature{temperature_type=\"current\",device=~\"$device\"})",
              "legendFormat": "{{device}}",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 55
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "Sector and CRC error counters",
          "description": "Raw SMART counters; a healthy disk stays at 0. Growth here is the cue to replace the disk.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 25
          },
          "interval": "5m",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (device, attribute_name) (smartctl_device_attribute{attribute_name=~\"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable|UDMA_CRC_Error_Count\",attribute_value_type=\"raw\",device=~\"$device\"})",
              "legendFormat": "{{device}} {{attribute_name}}",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "id": 102,
          "title": "I/O",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 33
          }
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "Busy",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 34
          },
          "interval": "1m",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * rate(node_disk_io_time_seconds_total{job=\"node-exporter\",device=~\"$device\"}[$__rate_interval])",
              "legendFormat": "{{device}}",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "Throughput (write below zero)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 34
          },
          "interval": "1m",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "rate(node_disk_read_bytes_total{job=\"node-exporter\",device=~\"$device\"}[$__rate_interval])",
              "legendFormat": "{{device}} read",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "rate(node_disk_written_bytes_total{job=\"node-exporter\",device=~\"$device\"}[$__rate_interval])",
              "legendFormat": "{{device}} write",
              "refId": "B",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,

# Cilium gateway route behind the Google login (oauth2-proxy ExternalAuth);
# the filter settings are explained in gitops/cleanuparr/httproute.yaml.
# Defaults (group, kind, weight) are written out: this app syncs with ServerSideApply, so Argo CD
# compares with the live object, where the API server has filled them in (otherwise: OutOfSync).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: victoriametrics
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: main
    namespace: cilium-gateway
    sectionName: https-wildcard
  hostnames:
  - grafana.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          group: ""
          kind: Service
          name: oauth2-proxy
          namespace: oauth2-proxy
          port: 4180
        http:
          path: /_authz
          allowedHeaders:
          - cookie
          - accept
          allowedResponseHeaders:
          - x-auth-request-user
          - x-auth-request-email
    # Envoy's default is 15 s for the whole response; 0s turns that off (long downloads,
    # interactive searches, streams). Idle connections still close after 300 s.
    timeouts:
      request: 0s
    backendRefs:
    - group: ""
      kind: Service
      name: victoria-metrics-k8s-stack-grafana
      port: 80
      weight: 1

# Šiukšliavežė (https://github.com/AurimasNav/atlieku-surinkimo-grafikas): the waste pickup
# schedule data its daily GitHub Actions job publishes to GitHub Pages. Nothing of it runs in
# this cluster; the job writes its own state to metrics.txt, which is scraped here.
#
# When a waste company changes a file's format, the build of that source fails and yesterday's
# data stays published, so the thing to watch is the age of the data. Metrics and their meaning:
# docs/monitoring.md in that repository.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: siuksliaveze-data
spec:
  jobName: siuksliaveze-data
  targetEndpoints:
  - targets:
    - aurimasnav.github.io
    scheme: https
    path: /atlieku-surinkimo-grafikas/metrics.txt
    # The file changes once a day (04:17 UTC, and on merges that change the pipeline).
    interval: 10m
    scrapeTimeout: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: siuksliaveze-data
spec:
  groups:
  - name: siuksliaveze-data
    interval: 10m
    rules:
    # `source` is one per waste company or municipality; the list is in docs/monitoring.md of the
    # app repository.
    # Every rule reads the newest sample of the last 20 min (last_over_time [20m]). vmalert queries
    # at whole 10 min marks with a 5 min lookback, so a bare selector sees this 10 min scrape only
    # when it lands less than 5 min before the mark. Today it lands 45 s before, but vmagent derives
    # the scrape's offset from a hash of the target: changing the URL or labels can move it and
    # silently blind every rule here.
    # 30 h = one daily run missed or failed.
    - alert: ScheduleDataStale
      expr: time() - last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[20m]) > 30 * 3600
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} schedule data is {{ $value | humanizeDuration }} old; its
          daily build fails or doesn't run
        dashboard: https://github.com/AurimasNav/atlieku-surinkimo-grafikas/actions/workflows/schedule-data.yml
    - alert: ScheduleDataShrank
      expr: |-
        last_over_time(siuksliaveze_data_places{job="siuksliaveze-data"}[20m])
          < 0.9 * last_over_time(siuksliaveze_data_places{job="siuksliaveze-data"}[20m] offset 1d)
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} data covers {{ $value }} places, over 10% fewer than
          yesterday (compared with a day earlier, so it clears after 24 h even if nothing was fixed)
        dashboard: '{{ $externalURL }}/d/siuksliaveze?orgId=1&var-source={{ $labels.source }}'
    # Warnings of a build that pipeline/known-warnings.json of the app repository doesn't list (row
    # and page numbers and a site copy's date left out): usually a new typo or a renamed village in
    # the source file, so the data is still published but those addresses have no schedule. Known
    # warnings never fire it, and it stays until the parser is fixed or the warnings acknowledged
    # (`status --write-known`, docs/monitoring.md of the app repository), not 24 h; with
    # Alertmanager's repeat_interval it is re-sent daily until then. Warning, not info: info-level
    # alerts never reach Telegram (values.yaml routes them to the blackhole receiver).
    - alert: ScheduleDataNewWarnings
      expr: last_over_time(siuksliaveze_data_new_warnings{job="siuksliaveze-data"}[20m]) > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} build has {{ $value }} new warnings (not in
          pipeline/known-warnings.json); fix the parser or acknowledge them
        dashboard: https://aurimasnav.github.io/atlieku-surinkimo-grafikas/warnings.html#{{ $labels.source }}
    # The last pickup date the published schedules have. Sources with yearly (or half-yearly or
    # quarterly) files: if the next file isn't posted or isn't read, the build stays green while the
    # reminders stop after the last date. Which sources and waste types are watched, and with how
    # much notice, is explained per source in docs/monitoring.md of the app repository; this
    # expression is the same with the job filter and [20m] windows.
    - alert: ScheduleDataRunsOut
      expr: |-
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"mazeikiai|telsiai|plunge"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"klaipedos|jurbarkas|siauliai|rietavas",kind=~"household|packaging"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="alytus",kind="household"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="radviliskis",kind=~"household|packaging"}[20m]) - time() < 2 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="silale"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="taurage",kind=~"household|packaging|food"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="pagegiai",kind=~"household|packaging|glass"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"pasvalys|rokiskis|birzai|panevezio-r",kind=~"household|packaging|glass"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"marijampole|vilkaviskis|kalvarija|kazluruda|sakiai",kind=~"household|packaging|food"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="raseiniai",kind=~"household|packaging|glass"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="jonava",kind=~"household|packaging"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kretinga",kind=~"household|packaging|food"}[20m]) - time() < 2 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"silute|trakai|salcininkai"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kedainiai",kind=~"household|packaging"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="moletai",kind=~"household|packaging"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="skuodas",kind=~"household|packaging"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="ukmerge",kind=~"household|packaging"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="anyksciai",kind=~"household|packaging|glass"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="utena",kind=~"household|packaging"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="ignalina",kind=~"household|packaging"}[20m]) - time() < 2 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="elektrenai",kind=~"household|packaging"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="sirvintos",kind="household"}[20m]) - time() < 2 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="sirvintos",kind=~"packaging|glass"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kupiskis",kind="packaging"}[20m]) - time() < 2 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="svencionys",kind="packaging"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="zarasai",kind=~"packaging|glass"}[20m]) - time() < 7 * 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} {{ $labels.kind }} schedule ends within a week (or
          has ended); the next period isn't published or isn't read
        dashboard: https://github.com/AurimasNav/atlieku-surinkimo-grafikas/actions/workflows/schedule-data.yml
    # A source that was in metrics.txt in the last 3 days is gone while the file itself is fetched
    # fine: ScheduleDataStale can't fire for a series that no longer exists. Happens when a
    # source's build fails and there is no published copy to keep, or the file is truncated.
    - alert: ScheduleDataSourceMissing
      expr: |-
        group by (source) (last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[3d]))
          unless on (source)
        group by (source) (last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[20m]))
          and on ()
        (last_over_time(up{job="siuksliaveze-data"}[20m]) == 1)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} data is missing from metrics.txt; its build or the
          publish step broke (it clears after 3 days even if nothing was fixed)
        dashboard: https://github.com/AurimasNav/atlieku-surinkimo-grafikas/actions/workflows/schedule-data.yml
    # absent_over_time: also fires when the scrape itself is gone (VMStaticScrape removed or its job
    # renamed); then every other rule here would stay quiet.
    - alert: ScheduleDataNotScraped
      expr: |-
        last_over_time(up{job="siuksliaveze-data"}[20m]) == 0
          or absent_over_time(up{job="siuksliaveze-data"}[20m])
      for: 2h
      labels:
        severity: warning
      annotations:
        summary: "Šiukšliavežė: metrics.txt hasn't been fetched from GitHub Pages for 2 hours (fetch failing, or the scrape is gone)"
        dashboard: https://aurimasnav.github.io/atlieku-surinkimo-grafikas/metrics.txt

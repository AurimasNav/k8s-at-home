# Šiukšliavežė (https://github.com/AurimasNav/atlieku-surinkimo-grafikas): the waste pickup
# schedule data its daily GitHub Actions job publishes to GitHub Pages. Nothing of it runs in
# this cluster; the job writes its own state to metrics.txt, which is scraped here.
#
# When a waste company changes a file's format, the build of that source fails and yesterday's
# data stays published, so the thing to watch is the age of the data. Metrics and their meaning:
# docs/monitoring.md in that repository.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: siuksliaveze-data
spec:
  jobName: siuksliaveze-data
  targetEndpoints:
  - targets:
    - aurimasnav.github.io
    scheme: https
    path: /atlieku-surinkimo-grafikas/metrics.txt
    # The file changes once a day (04:17 UTC, and on merges that change the pipeline).
    interval: 10m
    scrapeTimeout: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: siuksliaveze-data
spec:
  groups:
  - name: siuksliaveze-data
    interval: 10m
    rules:
    # `source` is nemencine or nemezio (Vilniaus r.), kauno (Kauno r.), mazeikiai (Mažeikių r.),
    # klaipedos (Klaipėdos r.) or jurbarkas (Jurbarko r.).
    # Every rule reads the newest sample of the last 20 min (last_over_time [20m]). vmalert queries
    # at whole 10 min marks with a 5 min lookback, so a bare selector sees this 10 min scrape only
    # when it lands less than 5 min before the mark. Today it lands 45 s before, but vmagent derives
    # the scrape's offset from a hash of the target: changing the URL or labels can move it and
    # silently blind every rule here.
    # 30 h = one daily run missed or failed.
    - alert: ScheduleDataStale
      expr: time() - last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[20m]) > 30 * 3600
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} schedule data is {{ $value | humanizeDuration }} old; its
          daily build fails or doesn't run
        dashboard: https://github.com/AurimasNav/atlieku-surinkimo-grafikas/actions/workflows/schedule-data.yml
    - alert: ScheduleDataShrank
      expr: |-
        last_over_time(siuksliaveze_data_places{job="siuksliaveze-data"}[20m])
          < 0.9 * last_over_time(siuksliaveze_data_places{job="siuksliaveze-data"}[20m] offset 1d)
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} data covers {{ $value }} places, over 10% fewer than
          yesterday (compared with a day earlier, so it clears after 24 h even if nothing was fixed)
        dashboard: '{{ $externalURL }}/d/siuksliaveze?orgId=1&var-source={{ $labels.source }}'
    # Warnings are rows the parser couldn't place, so a rise usually means a new typo or a renamed
    # village in the source file: the data is still published, but those addresses have no
    # schedule. Warning, not info: info-level alerts never reach Telegram (values.yaml routes them
    # to the blackhole receiver).
    - alert: ScheduleDataMoreWarnings
      expr: |-
        last_over_time(siuksliaveze_data_warnings{job="siuksliaveze-data"}[20m])
          > last_over_time(siuksliaveze_data_warnings{job="siuksliaveze-data"}[20m] offset 1d)
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} build has {{ $value }} warnings, more than yesterday
          (new typo or renamed place in the source?). Compared with a day earlier, so it clears after
          24 h even if nothing was fixed
        dashboard: '{{ $externalURL }}/d/siuksliaveze?orgId=1&var-source={{ $labels.source }}'
    # The last pickup date the published schedules have. Mažeikių r., Klaipėdos r. and Jurbarko r.
    # get one file per year; if next year's isn't posted (or the job doesn't recognise it), the
    # build stays green while the reminders stop after the last date. Only these sources: the
    # quarterly files of the Vilniaus r. companies come close to their last date every quarter.
    # Klaipėdos r. and Jurbarko r. collect glass a few times a year and green waste only part of
    # the year (Jurbarko r.: last on 16 December), so only their mixed waste and packaging.
    - alert: ScheduleDataRunsOut
      expr: |-
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="mazeikiai"}[20m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"klaipedos|jurbarkas",kind=~"household|packaging"}[20m]) - time() < 7 * 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} {{ $labels.kind }} schedule ends within a week (or
          has ended); the next period isn't published or isn't read
        dashboard: https://github.com/AurimasNav/atlieku-surinkimo-grafikas/actions/workflows/schedule-data.yml
    # A source that was in metrics.txt in the last 3 days is gone while the file itself is fetched
    # fine: ScheduleDataStale can't fire for a series that no longer exists. Happens when a
    # source's build fails and there is no published copy to keep, or the file is truncated.
    - alert: ScheduleDataSourceMissing
      expr: |-
        group by (source) (last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[3d]))
          unless on (source)
        group by (source) (last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[20m]))
          and on ()
        (last_over_time(up{job="siuksliaveze-data"}[20m]) == 1)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} data is missing from metrics.txt; its build or the
          publish step broke (it clears after 3 days even if nothing was fixed)
        dashboard: https://github.com/AurimasNav/atlieku-surinkimo-grafikas/actions/workflows/schedule-data.yml
    # absent_over_time: also fires when the scrape itself is gone (VMStaticScrape removed or its job
    # renamed); then every other rule here would stay quiet.
    - alert: ScheduleDataNotScraped
      expr: |-
        last_over_time(up{job="siuksliaveze-data"}[20m]) == 0
          or absent_over_time(up{job="siuksliaveze-data"}[20m])
      for: 2h
      labels:
        severity: warning
      annotations:
        summary: "Šiukšliavežė: metrics.txt hasn't been fetched from GitHub Pages for 2 hours (fetch failing, or the scrape is gone)"
        dashboard: https://aurimasnav.github.io/atlieku-surinkimo-grafikas/metrics.txt

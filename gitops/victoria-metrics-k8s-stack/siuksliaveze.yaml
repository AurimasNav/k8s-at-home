# Šiukšliavežė (https://github.com/AurimasNav/atlieku-surinkimo-grafikas): the waste pickup
# schedule data its daily GitHub Actions job publishes to GitHub Pages. Nothing of it runs in
# this cluster; the job writes its own state to metrics.txt, which is scraped here.
#
# When a waste company changes a file's format, the build of that source fails and yesterday's
# data stays published, so the thing to watch is the age of the data. Metrics and their meaning:
# docs/monitoring.md in that repository.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: siuksliaveze-data
spec:
  jobName: siuksliaveze-data
  targetEndpoints:
  - targets:
    - aurimasnav.github.io
    scheme: https
    path: /atlieku-surinkimo-grafikas/metrics.txt
    # The file changes once a day (04:17 UTC, and on merges that change the pipeline).
    interval: 10m
    scrapeTimeout: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: siuksliaveze-data
spec:
  groups:
  - name: siuksliaveze-data
    interval: 10m
    rules:
    # `source` is one per waste company or municipality; the list is in docs/monitoring.md of the
    # app repository.
    # Every rule reads the newest sample of a window of at least 20 min (last_over_time). vmalert
    # queries at whole 10 min marks with a 5 min lookback, so a bare selector sees this 10 min
    # scrape only when it lands less than 5 min before the mark. Today it lands 45 s before, but
    # vmagent derives the scrape's offset from a hash of the target: changing the URL or labels can
    # move it and silently blind every rule here.
    # Rules that fire until someone fixes something use longer windows, because two missed scrapes
    # in a row empty a 20 min window: the alert would resolve with nothing fixed (a resolved
    # message in Telegram) and fire again after its `for`. A failed scrape leaves a gap in every
    # series but `up`, which gets a 0. A [W] window bridges W/10 min - 1 failed scrapes in a row.
    # Each rule says which window and why.
    # 30 h = one daily run missed. The job writes the checked time at the end of every run that
    # publishes, whatever its sources' builds did, so an old one means the job itself: the schedule
    # didn't start, the run hit its time limit or the deploy failed. One alert for all sources.
    # [2h30m]: ScheduleDataNotScraped (for: 2h) fires only once 13 fetches in a row have failed. A
    # shorter window would resolve this alert in a fetch outage before that one fires; [2h30m]
    # bridges 14, so it keeps firing until NotScraped has fired. The newest sample still wins, so
    # a publish clears it at the next evaluation. After a target change, the old and new target's
    # series both stay in the window for 2h30m, so a late job then gives two alerts.
    - alert: ScheduleDataNotPublished
      expr: time() - last_over_time(siuksliaveze_status_checked_timestamp_seconds{job="siuksliaveze-data"}[2h30m]) > 30 * 3600
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the daily job hasn't published for {{ $value | humanizeDuration }}; check its
          last run
        dashboard: https://github.com/AurimasNav/atlieku-surinkimo-grafikas/actions/workflows/schedule-data.yml
    # A source the last published run didn't rebuild: its build failed and yesterday's part was
    # kept, so its data is older than the job's own checked time by more than a run takes (the
    # data job's limit is 45 min, so 2 h). It fires 30 h after the source's last good build, as
    # before. While the whole job is late, every source is about as old as the checked time, so
    # only ScheduleDataNotPublished fires. max(): `on ()` needs one checked series, and a changed
    # target would give two for the length of the window.
    # [30m] bridges two missed scrapes in a row. Not [1h]: a source the run drops from metrics.txt
    # keeps its last, old sample in the window next to the new checked time, and for an hour that
    # is long enough to fire this next to ScheduleDataSourceMissing, two alerts for one cause. So
    # three or more failed fetches in a row still resolve it once.
    - alert: ScheduleDataStale
      expr: |-
        (time() - last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[30m]) > 30 * 3600)
          and
        (max(last_over_time(siuksliaveze_status_checked_timestamp_seconds{job="siuksliaveze-data"}[30m]))
          - on () group_right last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[30m])
          > 2 * 3600)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} schedule data is {{ $value | humanizeDuration }} old;
          its build fails, so the daily job keeps publishing its old data
        dashboard: https://github.com/AurimasNav/atlieku-surinkimo-grafikas/actions/workflows/schedule-data.yml
    - alert: ScheduleDataShrank
      expr: |-
        last_over_time(siuksliaveze_data_places{job="siuksliaveze-data"}[20m])
          < 0.9 * last_over_time(siuksliaveze_data_places{job="siuksliaveze-data"}[20m] offset 1d)
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} data covers {{ $value }} places, over 10% fewer than
          yesterday (compared with a day earlier, so it clears after 24 h even if nothing was fixed)
        dashboard: '{{ $externalURL }}/d/siuksliaveze?orgId=1&var-source={{ $labels.source }}'
    # Warnings of a build that pipeline/known-warnings.json of the app repository doesn't list. The
    # app compares the texts without the numbers that change from day to day, such as row and page
    # numbers and a site copy's date. Usually a new typo or a renamed village in the source file, so
    # the data is still published but those addresses have no schedule. Known warnings never fire
    # it, and it stays until the parser is fixed or the warnings acknowledged (`status
    # --write-known`, docs/monitoring.md of the app repository), not 24 h; with Alertmanager's
    # repeat_interval it is re-sent daily until then. Warning, not info: info-level alerts never
    # reach Telegram (values.yaml routes them to the blackhole receiver).
    # [1h], not [20m] like the other rules: two missed scrapes in a row empty a 20 min window, and
    # the alert would resolve with nothing fixed (a resolved message in Telegram) and fire again
    # 40 min later. 1 h bridges up to five missed scrapes in a row; a longer fetch outage is
    # ScheduleDataNotScraped's (for: 2h). last_over_time still takes the newest sample, so the 0
    # published after a fix or an acknowledgement clears it at the next evaluation.
    - alert: ScheduleDataNewWarnings
      expr: last_over_time(siuksliaveze_data_new_warnings{job="siuksliaveze-data"}[1h]) > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} build has warnings not in
          pipeline/known-warnings.json (new: {{ $value }}); fix the parser or acknowledge them
        dashboard: https://aurimasnav.github.io/atlieku-surinkimo-grafikas/warnings.html#{{ $labels.source }}
    # The last pickup date the published schedules have. Sources with yearly (or half-yearly or
    # quarterly) files: if the next file isn't posted or isn't read, the build stays green while the
    # reminders stop after the last date. Which sources and waste types are watched, and with how
    # much notice, is explained per source in docs/monitoring.md of the app repository; this
    # expression is the same with the job filter. [30m] keeps it firing through two missed scrapes
    # in a row.
    # kaisiadorys: SĮ Kaišiadorių paslaugos publishes one year at a time. Mixed waste runs all year
    # (the 2026 data has dates in every month), so a missing next-year mixed waste schedule a week
    # before the last date (31 December 2026) needs a look. Packaging and glass (2026: April to
    # December) and green waste (December only) are left out: their gap over winter is normal and
    # nobody could act on it.
    - alert: ScheduleDataRunsOut
      expr: |-
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"mazeikiai|telsiai|plunge"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"klaipedos|jurbarkas|siauliai|rietavas",kind=~"household|packaging"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="alytus",kind="household"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="radviliskis",kind=~"household|packaging"}[30m]) - time() < 2 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="silale"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="taurage",kind=~"household|packaging|food"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="pagegiai",kind=~"household|packaging|glass"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"pasvalys|rokiskis|birzai|panevezio-r",kind=~"household|packaging|glass"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"marijampole|vilkaviskis|kalvarija|kazluruda|sakiai",kind=~"household|packaging|food"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="raseiniai",kind=~"household|packaging|glass"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="jonava",kind=~"household|packaging"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kretinga",kind=~"household|packaging|food"}[30m]) - time() < 2 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source=~"silute|trakai|salcininkai"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kedainiai",kind=~"household|packaging"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="moletai",kind=~"household|packaging"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="skuodas",kind=~"household|packaging"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="ukmerge",kind=~"household|packaging"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="anyksciai",kind=~"household|packaging|glass"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="utena",kind=~"household|packaging"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="ignalina",kind=~"household|packaging"}[30m]) - time() < 2 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="elektrenai",kind=~"household|packaging"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="sirvintos",kind="household"}[30m]) - time() < 2 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="sirvintos",kind=~"packaging|glass"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kupiskis",kind="packaging"}[30m]) - time() < 2 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="svencionys",kind="packaging"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="zarasai",kind=~"packaging|glass"}[30m]) - time() < 7 * 86400
          or
        last_over_time(siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kaisiadorys",kind="household"}[30m]) - time() < 7 * 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} {{ $labels.kind }} schedule ends within a week (or
          has ended); the next period isn't published or isn't read
        dashboard: https://github.com/AurimasNav/atlieku-surinkimo-grafikas/actions/workflows/schedule-data.yml
    # A source the app expects is missing from metrics.txt while the file itself is fetched:
    # ScheduleDataStale can't fire for a series that no longer exists. Happens when a source's
    # build fails and there is no published copy to keep, or the file is truncated.
    # siuksliaveze_data_expected{source} is 1 for every source in the app repository's committed
    # list of expected sources (docs/monitoring.md there). A PR that adds or removes a provider
    # edits the list in the same change, and the app's PR check fails when the list and the built
    # sources differ, so a source removed on purpose loses both series in the same publish and a
    # new one gains both: neither fires. A source that goes missing fires until it is back or a PR
    # removes it from the list.
    # First part: expected, unless in the file now, while the file is fetched. Its guard needs at
    # least one good fetch in the window (max_over_time), not a good newest fetch:
    # last_over_time(up) reads a failed scrape's 0 and would resolve the alert on a single
    # failure. Its [30m] windows cover the same scrapes, so failed fetches empty them together and
    # a source still in the file is never counted as missing. Two failed fetches in a row keep it
    # firing.
    # Second part: a source whose expected line was in every good fetch of the last 2h30m (its
    # sample count equals the number of good fetches) and that was in none of them. It needs no
    # guard, so a source missing that long keeps firing through 14 failed fetches in a row, until
    # ScheduleDataNotScraped (for: 2h) has fired at the 13th, as ScheduleDataNotPublished does. A
    # source a PR removes from the list leaves this part at the first good fetch without it, even
    # when the fetches after that fail, and the first part at the third evaluation after it. Only
    # in the first 2h20m after a source drops out is it held by the first part alone: three failed
    # fetches in a row then still resolve it once. After a scrape target change both targets'
    # fetches are counted, so for 2h30m only the first part works.
    # The 3-day side of the first part is the earlier rule, used only while no expected series
    # were fetched in the last 2h30m, so this rule can go live before the app publishes the list:
    # a source seen in the last 3 days and missing now (it clears 3 days after its last sample,
    # fixed or not). Every part gives just `source`, so an alert that is firing when the list
    # first appears keeps firing.
    - alert: ScheduleDataSourceMissing
      expr: |-
        (
          group by (source) (last_over_time(siuksliaveze_data_expected{job="siuksliaveze-data"}[30m]))
            or
          (
            group by (source) (last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[3d]))
              unless on ()
            count(last_over_time(siuksliaveze_data_expected{job="siuksliaveze-data"}[2h30m]))
          )
        )
          unless on (source)
        group by (source) (last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[30m]))
          and on ()
        (max_over_time(up{job="siuksliaveze-data"}[30m]) == 1)
          or
        (
          group by (source) (
            count_over_time(siuksliaveze_data_expected{job="siuksliaveze-data"}[2h30m])
              >= scalar(sum(sum_over_time(up{job="siuksliaveze-data"}[2h30m])))
          )
            unless on (source)
          group by (source) (last_over_time(siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data"}[2h30m]))
        )
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          Šiukšliavežė: the {{ $labels.source }} data is missing from metrics.txt; its build or the
          publish step broke. It stays until the source is back or a PR removes it from the app's
          list of expected sources
        dashboard: https://github.com/AurimasNav/atlieku-surinkimo-grafikas/actions/workflows/schedule-data.yml
    # absent_over_time: also fires when the scrape itself is gone (VMStaticScrape removed or its job
    # renamed); then every other rule here would stay quiet.
    - alert: ScheduleDataNotScraped
      expr: |-
        last_over_time(up{job="siuksliaveze-data"}[20m]) == 0
          or absent_over_time(up{job="siuksliaveze-data"}[20m])
      for: 2h
      labels:
        severity: warning
      annotations:
        summary: "Šiukšliavežė: metrics.txt hasn't been fetched from GitHub Pages for 2 hours (fetch failing, or the scrape is gone)"
        dashboard: https://aurimasnav.github.io/atlieku-surinkimo-grafikas/metrics.txt

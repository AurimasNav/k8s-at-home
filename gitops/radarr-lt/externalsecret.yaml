# API key is fixed from Doppler so Seerr/VSeerr, Prowlarr and Hermes can be
# configured before first start. The same Doppler key feeds Hermes'
# ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-lt
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: radarr-lt
  dataFrom:
  # Shared Google OAuth client (also oauth2-proxy, hairsera, Immich); redirect URI
  # https://<host>/signin-oidc is registered on it.
  - extract:
      key: GOOGLE_OAUTH_JSON
    rewrite:
    - regexp:
        source: GOOGLE_OAUTH_CLIENT_ID
        target: RADARR__AUTH__OIDCCLIENTID
    - regexp:
        source: GOOGLE_OAUTH_CLIENT_SECRET
        target: RADARR__AUTH__OIDCCLIENTSECRET
  data:
  - secretKey: RADARR__AUTH__APIKEY
    remoteRef:
      key: RADARR_LT_API_KEY
  - secretKey: RADARR__AUTH__OIDCUSERIDENTIFIER
    remoteRef:
      key: ADMIN_GOOGLE_EMAIL

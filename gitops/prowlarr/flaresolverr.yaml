# FlareSolverr: a headless browser that passes Cloudflare "Just a moment..."
# checks for Prowlarr indexers tagged "flaresolverr" (e.g. RuTracker login).
# In-cluster only (no Service outside the namespace, no Ingress); Prowlarr reaches
# it at http://flaresolverr.prowlarr.svc.cluster.local:8191.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  labels:
    app: flaresolverr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      annotations:
        # bump to restart the pod via GitOps (Hermes has no delete/patch RBAC here)
        restartedAt: "2026-11-03T13:55"
      labels:
        app: flaresolverr
    spec:
      # Same DNS as Prowlarr (see deployment.yaml): it opens the tracker pages itself.
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 192.168.1.152 # Blocky LoadBalancer (gitops/blocky)
        searches:
        - prowlarr.svc.cluster.local
        - svc.cluster.local
        - cluster.local
        options:
        - name: ndots
          value: "5"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
        # Solve one challenge at a time (one Chrome): two Chromes don't fit in the 1 GiB limit.
        # The image's own entrypoint and app, started through flaresolverr/one_at_a_time.py.
        # Drop the command and the mount once a FlareSolverr release limits this itself
        # FlareSolverr/FlareSolverr#1735, MAX_CONCURRENT_SOLVES).
        command: ["/usr/bin/dumb-init", "--", "/usr/local/bin/python", "-u", "/opt/one-at-a-time/one_at_a_time.py"]
        ports:
        - containerPort: 8191
        env:
        - name: LOG_LEVEL
          value: info
        - name: TZ
          value: Europe/Vilnius
        - name: LANG
          value: en_US
        # read by one_at_a_time.py: solves at once, and the longest one solve may take
        - name: MAX_CONCURRENT_SOLVES
          value: "1"
        - name: SOLVE_TIMEOUT_SECONDS
          value: "60"
        # Headless Chromium leaks memory over long runs; the limit restarts it
        # instead of letting it grow.
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: one-at-a-time
          mountPath: /opt/one-at-a-time
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8191
          initialDelaySeconds: 10
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8191
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
      volumes:
      - name: one-at-a-time
        configMap:
          name: flaresolverr-one-at-a-time

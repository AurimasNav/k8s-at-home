# Cilium gateway route behind the Google login (oauth2-proxy ExternalAuth);
# the filter settings are explained in gitops/cleanuparr/httproute.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  parentRefs:
  # https-tunnel = Cloudflare Tunnel; https-wildcard (home IP) is dropped once the tunnel is verified.
  - name: main
    namespace: cilium-gateway
    sectionName: https-tunnel
  - name: main
    namespace: cilium-gateway
    sectionName: https-wildcard
  hostnames:
  - prowlarr.sync.lt
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          name: oauth2-proxy
          namespace: oauth2-proxy
          port: 4180
        http:
          path: /_authz
          allowedHeaders:
          - cookie
          - accept
          allowedResponseHeaders:
          - x-auth-request-user
          - x-auth-request-email
    # Envoy's default is 15 s for the whole response; 0s turns that off (long downloads,
    # interactive searches, streams). Idle connections still close after 300 s.
    timeouts:
      request: 0s
    backendRefs:
    - name: prowlarr
      port: 80

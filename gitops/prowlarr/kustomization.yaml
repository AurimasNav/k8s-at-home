apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./deployment.yaml
- ./httproute.yaml
- ./service.yaml
- ./configmap.yaml
- ./pvc.yaml
- ./flaresolverr.yaml
- ./flaresolverr-service.yaml
- ./flaresolverr-networkpolicy.yaml

# FlareSolverr start-up wrapper: one Cloudflare challenge (one Chrome) at a time.
# The name hash changes with the script, so an edit restarts FlareSolverr.
configMapGenerator:
- name: flaresolverr-one-at-a-time
  files:
  - flaresolverr/one_at_a_time.py

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  labels:
    app: prowlarr
spec:
  replicas: 1
  # SQLite on an RWO PVC: never run two Prowlarr pods on the same database (a rolling update
  # starts the new pod while the old one is still Terminating).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      containers:
      - name: prowlarr
        image: ghcr.io/linuxserver/prowlarr:3.0.0-develop
        ports:
        - containerPort: 9696
        envFrom:
        - configMapRef:
            name: prowlarr
        volumeMounts:
        - name: prowlarr-config
          mountPath: /config
      volumes:
      - name: prowlarr-config
        persistentVolumeClaim:
          claimName: prowlarr-config

# Production's superuser password: the seed step dumps production with it (read-only), and the
# test cluster gets the same superuser, as a pg_dumpall restore expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-upgrade-test
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: postgresql-upgrade-test
  dataFrom:
  - extract:
      key: POSTGRESQL

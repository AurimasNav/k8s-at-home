# API key is fixed from Doppler so Seerr/VSeerr, Prowlarr and Hermes can be
# configured before first start. The same Doppler key feeds Hermes'
# ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-lt
spec:
  refreshInterval: "1800s"
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: sonarr-lt
  data:
  - secretKey: SONARR__AUTH__APIKEY
    remoteRef:
      key: SONARR_LT_API_KEY

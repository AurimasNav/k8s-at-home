# Sonarr for Lithuanian-language releases (VSeerr version "Lithuanian").
# Library: /data/media/tv-lt; qBittorrent category: sonarr-lt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr-lt
  labels:
    app: sonarr-lt
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Two Sonarr pods must never share the /config SQLite DB (RWO local-path PVC).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr-lt
  template:
    metadata:
      labels:
        app: sonarr-lt
    spec:
      initContainers:
      # Root folder for this version's library, owned like the rest of /data/media
      # (chown of the folder itself only, never recursive).
      - name: library-folder
        image: busybox:1.38.0
        command: ["sh", "-c", "mkdir -p /data/media/tv-lt && chown 1000:1000 /data/media/tv-lt"]
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: sonarr-lt
        image: ghcr.io/linuxserver/sonarr:5.0.0-develop
        imagePullPolicy: Always
        ports:
        - containerPort: 8989
        envFrom:
        - configMapRef:
            name: sonarr-lt
        - secretRef:
            name: sonarr-lt
            # starts with a generated key until the Doppler key exists
            optional: true
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-lt-config
      - name: data
        hostPath:
          path: /data
          type: Directory

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  annotations:
    # Server-side diff + server-side apply (below): the pre/post-delete-finalizer.argocd.argoproj.io(/cleanup)
    # finalizers the controller adds to child Applications with delete hooks are owned by another
    # field manager, so they are not drift and a root sync keeps them (argoproj/argo-cd#17433).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: default
  source:
    path: argocd-apps/base/
    repoURL: https://github.com/AurimasNav/k8s-at-home.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    # required with ServerSideDiff: a client-side apply replaces metadata.finalizers and drops them
    - ServerSideApply=true
